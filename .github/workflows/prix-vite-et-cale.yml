name: Prix Vite & Calé

# Chaque lundi, relit les prix d'Open Prices et met à jour vite-et-cale/prix.json.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les prix
        run: python3 vite-et-cale/prix/maj_prix.py
      - name: Enregistrer si les prix ont changé
        run: |
          if git diff --quiet -- vite-et-cale/prix.json; then
            echo "Pas de changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite-et-cale/prix.json
          git commit -m "Vite & Calé : mise à jour des prix (Open Prices)"
          git push
