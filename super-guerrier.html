<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Éveil du Guerrier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Bangers&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E13;
  --surface:#151A21;
  --surface2:#1D242D;
  --line:#28313B;
  --ink:#ECEAE4;
  --muted:#8A96A3;
  --gold:#F5C542;
  --red:#E0553F;
  --green:#79BF95;
  --blue:#5E9BC4;
  --aura:#8A96A3;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select{font-family:inherit}
.manga{font-family:'Bangers',system-ui,sans-serif;letter-spacing:.04em;font-weight:400}
.muted{color:var(--muted)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
h2.sec{font-family:'Bangers';font-weight:400;letter-spacing:.05em;font-size:30px;margin:6px 0 12px}
h3.sub{font-size:12.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px;background:var(--gold);color:#1a1405}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.big{width:100%;padding:16px;font-size:18px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 12px;border-radius:99px;background:var(--surface2);font-size:13.5px;font-weight:600;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.in{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:16px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 2px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(11,14,19,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:12px;padding:10px 0}
.hav{width:44px;height:44px;border-radius:50%;flex:none;background:var(--surface2) center/cover;box-shadow:0 0 0 2px var(--aura),0 0 14px var(--aura);display:grid;place-items:center;font-family:'Bangers';font-size:20px}
.hinfo{flex:1;min-width:0}
.hname{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hform{font-size:12px;color:var(--aura);font-weight:700}
.hpow{text-align:right;white-space:nowrap}
.hpow span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.hpow b{font-family:'Bangers';font-size:24px;letter-spacing:.03em;color:var(--gold);line-height:1}
.streak{font-size:12px;background:var(--surface2);border-radius:99px;padding:4px 9px;white-space:nowrap}

/* ---------- Nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(21,26,33,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
nav.tabs button b{font-size:21px;line-height:1.1;filter:grayscale(.8);opacity:.75}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] b{filter:none;opacity:1}
section.view{display:none;padding:16px 0 24px}
section.view.on{display:block}

/* ---------- Stage ---------- */
.stage{position:relative;height:380px;border-radius:24px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 120%,color-mix(in srgb,var(--aura) 45%,transparent),transparent 60%),
             radial-gradient(circle at 50% 0%,#1b2330,transparent 70%),#0d1117}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.07));border-top:1px solid rgba(255,255,255,.07)}
.stage .rigbox{position:absolute;left:50%;bottom:6px;height:330px;width:330px;transform:translateX(-50%);z-index:1}
.stage.shake{animation:shake .08s linear infinite}
@keyframes shake{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
.scouter{position:absolute;left:14px;top:12px;z-index:2}
.scouter .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.scouter .v{font-family:'Bangers';font-size:38px;line-height:1;color:var(--gold);text-shadow:0 0 18px color-mix(in srgb,var(--gold) 60%,transparent)}
.formtag{position:absolute;right:14px;top:12px;z-index:2;text-align:right}
.formtag b{display:block;font-family:'Bangers';font-size:24px;letter-spacing:.04em;line-height:1;color:var(--aura);text-shadow:0 0 14px var(--aura)}
.formtag span{font-size:11.5px;color:var(--muted)}
.floatpts{position:absolute;left:50%;top:40%;z-index:3;font-family:'Bangers';font-size:56px;color:var(--gold);text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 24px var(--gold);transform:translateX(-50%);animation:floatup 1.4s ease-out forwards;pointer-events:none}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}
.nextf{margin-top:12px}
.nextf .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.nextf .t b{color:var(--aura)}
.bar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--aura),var(--gold));transition:width .8s}
.addbtn{margin-top:14px;width:100%;padding:18px;border-radius:18px;font-family:'Bangers';font-size:28px;letter-spacing:.05em;color:#1a0d05;background:linear-gradient(90deg,var(--gold),var(--red));box-shadow:0 10px 26px rgba(224,85,63,.3)}
.quick{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;padding:9px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}

/* Quêtes & boss */
.quest{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-top:8px}
.quest .ic{width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:21px;flex:none}
.quest .bd{flex:1;min-width:0}
.quest .nm{font-weight:700;font-size:14.5px}
.quest .pg{font-size:12px;color:var(--muted);margin:4px 0 5px}
.quest .bar{height:7px}
.quest.done{border-color:color-mix(in srgb,var(--green) 60%,transparent)}
.quest.done .ic{background:color-mix(in srgb,var(--green) 25%,transparent)}
.quest .rw{font-weight:800;font-size:13px;color:var(--gold);white-space:nowrap}
.boss{display:flex;gap:14px;align-items:center;padding:14px;border-radius:var(--radius);border:1px solid rgba(224,85,63,.45);background:linear-gradient(120deg,rgba(224,85,63,.16),rgba(21,26,33,1))}
.boss .be{font-size:50px;animation:bossb 2s ease-in-out infinite}
@keyframes bossb{50%{transform:translateY(-4px) rotate(-3deg)}}
.boss .bn{font-family:'Bangers';font-size:22px;letter-spacing:.04em}
.boss .bd{flex:1;min-width:0}
.boss .hp{height:12px;border-radius:99px;background:#3a1612;overflow:hidden;margin:6px 0 4px}
.boss .hp i{display:block;height:100%;background:linear-gradient(90deg,#ff6a4d,#c62828);transition:width .8s}
.boss.dead{border-color:color-mix(in srgb,var(--green) 60%,transparent);background:linear-gradient(120deg,rgba(121,191,149,.14),rgba(21,26,33,1))}
.boss.dead .be{filter:grayscale(1);animation:none;opacity:.5}
.today{display:flex;flex-direction:column;gap:6px}
.entry{display:flex;gap:10px;align-items:center;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.entry .en{flex:1;min-width:0}
.entry .en small{color:var(--muted)}
.entry .ep{color:var(--gold);font-weight:800}
.entry .del{width:28px;height:28px;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:13px;flex:none}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sh .t{flex:1;font-family:'Bangers';font-size:28px;letter-spacing:.04em;line-height:1}
.sh p{font-size:13px;color:var(--muted);margin-top:4px;font-family:'Archivo';letter-spacing:0}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface2);font-size:18px;flex:none}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.act{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--surface2);text-align:left;font-size:13.5px;font-weight:600;line-height:1.25}
.act i{font-style:normal;font-size:24px}
.act small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.act.off{opacity:.4}
.qty{display:flex;align-items:center;gap:10px;justify-content:center;margin:18px 0 10px}
.qty button{width:52px;height:52px;border-radius:50%;background:var(--surface2);font-size:24px;font-weight:700}
.qty input{width:140px;text-align:center;font-family:'Bangers';font-size:46px;letter-spacing:.03em;background:none;border:none;color:var(--ink);border-bottom:2px solid var(--line)}
.qty input:focus{outline:none;border-color:var(--gold)}
.unit{text-align:center;color:var(--muted);font-size:14px}
.preview{text-align:center;font-family:'Bangers';font-size:34px;color:var(--gold);margin:12px 0}
.preview small{display:block;font-family:'Archivo';font-size:12px;color:var(--muted);letter-spacing:0}

/* ---------- Journal ---------- */
.chart{display:flex;align-items:flex-end;gap:5px;height:150px;padding:10px 6px 0}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.chart i{width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--gold),var(--red));min-height:2px}
.chart span{font-size:10px;color:var(--muted)}
.chart b{font-size:9.5px;color:var(--muted);font-weight:600}
.tots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tot b{display:block;font-family:'Bangers';font-size:28px;letter-spacing:.03em;line-height:1.1}
.tot span{font-size:12px;color:var(--muted)}

/* ---------- Évolutions ---------- */
.forms{display:flex;flex-direction:column;gap:10px}
.form{display:flex;gap:14px;align-items:center;padding:10px 14px 10px 10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.form .fig{width:92px;height:104px;flex:none;border-radius:14px;background:radial-gradient(circle at 50% 100%,color-mix(in srgb,var(--fc) 45%,transparent),transparent 70%)}
.form.lock .fig svg{filter:brightness(0) drop-shadow(0 0 1px rgba(255,255,255,.35))}
.form .fn{font-family:'Bangers';font-size:24px;letter-spacing:.04em;line-height:1;color:var(--fc)}
.form.lock .fn{color:var(--muted)}
.form .fd{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.35}
.form .fp{font-size:12px;font-weight:700;margin-top:6px}
.form.cur{border-color:var(--fc);box-shadow:0 0 0 1px var(--fc),0 0 24px color-mix(in srgb,var(--fc) 25%,transparent)}
.form .now{position:absolute;right:10px;top:10px}

/* ---------- Guerriers ---------- */
.lb{display:flex;flex-direction:column;gap:8px}
.lbr{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.lbr.me{border-color:var(--gold)}
.lbr .rk{font-family:'Bangers';font-size:26px;width:34px;text-align:center}
.lbr .av{width:46px;height:46px;border-radius:50%;background:var(--surface2) center/cover;box-shadow:0 0 0 2px var(--c),0 0 12px var(--c);display:grid;place-items:center;font-family:'Bangers';font-size:20px;flex:none}
.lbr .nm{flex:1;min-width:0}
.lbr .nm b{display:block;font-size:15px}
.lbr .nm span{font-size:12px;color:var(--c);font-weight:700}
.lbr .pw{font-family:'Bangers';font-size:22px;color:var(--gold)}

/* ---------- Onboarding ---------- */
.ob{min-height:100vh;padding:calc(24px + env(safe-area-inset-top)) 0 40px}
.ob .hero{text-align:center;margin-bottom:10px}
.ob .hero h1{font-family:'Bangers';font-weight:400;font-size:46px;letter-spacing:.05em;line-height:1;color:var(--gold);text-shadow:0 0 30px rgba(245,197,66,.4)}
.ob .hero p{color:var(--muted);margin-top:8px;font-size:15px;line-height:1.45}
.photo{display:flex;align-items:center;gap:14px}
.photo .pv{width:84px;height:84px;border-radius:50%;background:var(--surface2) center/cover;display:grid;place-items:center;font-size:30px;box-shadow:0 0 0 2px var(--line);flex:none}
.priv{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.45}

/* ---------- Transformation ---------- */
#trans{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--tc,#fff) 22%,#000),#000 75%)}
#trans.on{display:flex}
#trans .tr{width:min(80vw,360px);height:min(80vw,360px)}
#trans .tt{font-family:'Bangers';font-size:min(12vw,58px);letter-spacing:.05em;line-height:1;color:var(--tc);text-shadow:0 0 30px var(--tc)}
#trans .ts{color:#ddd;font-size:15px;max-width:420px;line-height:1.45;min-height:44px}
#trans .yell{font-family:'Bangers';font-size:min(14vw,72px);color:#fff;text-shadow:0 0 30px var(--tc);animation:yell .4s ease-in-out infinite alternate}
@keyframes yell{from{transform:scale(1)}to{transform:scale(1.12)}}
#trans.shake .tr{animation:shake .06s linear infinite}
#flash{position:fixed;inset:0;z-index:101;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
#flash.on{opacity:1;transition:none}

/* ---------- Rig ---------- */
.rig{display:block;width:100%;height:100%;overflow:visible}
.rig .blink{animation:blink 3.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.rig .fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate}
.rig .fl2{animation-duration:.13s;animation-delay:-.05s}
@keyframes flick{from{transform:scale(.96,.94) skewX(-2deg)}to{transform:scale(1.03,1.06) skewX(2deg)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:400px){.stage{height:340px}.stage .rigbox{height:290px;width:290px}}
</style>
</head>
<body>

<div id="app"></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="trans" role="dialog" aria-modal="true"></div>
<div id="flash"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* =========================================================
   LES ÉVEILS — transformations (univers original)
   ========================================================= */
const FORMS = [
  {n:'Humain',              pts:0,     aura:null,      hc:'#1C1C1C', hair:'spiky', c:'#8A96A3', d:'Tout commence ici. Chaque action compte.'},
  {n:'Apprenti',            pts:150,   aura:'#DDE7F3', hc:'#1C1C1C', hair:'spiky', c:'#DDE7F3', d:'Une première étincelle. Ton énergie commence à se voir.'},
  {n:'Combattant',          pts:400,   aura:'#5EA8F2', hc:'#1C1C1C', hair:'spiky', c:'#5EA8F2', d:'Une aura bleue t\'entoure. Tu n\'es plus un débutant.'},
  {n:'Guerrier d\'Élite',   pts:900,   aura:'#EF5350', hc:'#1C1C1C', hair:'spiky', c:'#EF5350', d:'L\'aura rouge des guerriers d\'élite. Ta puissance double.'},
  {n:'Super Guerrier',      pts:1800,  aura:'#FFD54F', hc:'#FFD23F', hair:'tall',  c:'#FFD54F', d:'Tes cheveux s\'embrasent d\'or. La légende commence.'},
  {n:'Super Guerrier II',   pts:3500,  aura:'#FFE066', hc:'#FFD23F', hair:'tall',  c:'#FFE066', d:'Des éclairs crépitent autour de toi.', bolt:true},
  {n:'Super Guerrier III',  pts:6000,  aura:'#FFC107', hc:'#FFC93C', hair:'long',  c:'#FFC107', d:'Une crinière dorée et une énergie presque incontrôlable.', bolt:true},
  {n:'Forme Divine',        pts:9000,  aura:'#FF4F81', hc:'#E53950', hair:'slim',  c:'#FF4F81', d:'Plus de 9 000 ! Une puissance calme et divine.'},
  {n:'Forme Céleste',       pts:14000, aura:'#40C4FF', hc:'#29B6F6', hair:'tall',  c:'#40C4FF', d:'L\'énergie des étoiles. Seuls les plus réguliers arrivent ici.', bolt:true},
  {n:'Éveil Ultime',        pts:21000, aura:'#E3E8FF', hc:'#D3DAE6', hair:'slim',  c:'#E3E8FF', d:'Le corps agit seul. Tu as atteint le sommet.', bolt:true, spark:true},
];
const formIdx = pts => { let i = 0; FORMS.forEach((f,k) => { if(pts >= f.pts) i = k; }); return i; };

/* =========================================================
   ACTIONS RÉELLES — barème de points
   ========================================================= */
const ACTS = [
  {id:'course',    n:'Course à pied',       e:'🏃', cat:'sport',  u:'km',        p:12,   step:.5,  pre:[2,5,10]},
  {id:'marche',    n:'Marche',              e:'🚶', cat:'sport',  u:'pas',       p:.002, step:500, pre:[5000,8000,10000]},
  {id:'velo',      n:'Vélo',                e:'🚴', cat:'sport',  u:'km',        p:4,    step:1,   pre:[10,20,40]},
  {id:'natation',  n:'Natation',            e:'🏊', cat:'sport',  u:'min',       p:1.6,  step:5,   pre:[20,30,45]},
  {id:'muscu',     n:'Musculation',         e:'🏋️', cat:'sport',  u:'min',       p:1.3,  step:5,   pre:[30,45,60]},
  {id:'combat',    n:'Boxe, arts martiaux', e:'🥊', cat:'sport',  u:'min',       p:1.7,  step:5,   pre:[30,60,90]},

function tone(f, dur = .12, vol = .2, type = 'square'){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
function sweep(from, to, dur, vol = .12){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(from, a.currentTime); o.frequency.exponentialRampToValueAtTime(to, a.currentTime + dur);
  g.gain.setValueAtTime(.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(vol, a.currentTime + .1); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
function boom(){
  const a = ac(); if(!a) return;
  const n = a.sampleRate*.8, buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = (Math.random()*2-1)*Math.pow(1 - i/n, 2.5);
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();

  s.buffer = buf; s.connect(f).connect(g).connect(a.destination); s.start();
}

  let dx = b[0]-a[0], dy = b[1]-a[1], d = Math.hypot(dx, dy) || .001;
  const max = l1 + l2 - .5;
  if(d > max){ const k = max/d; dx *= k; dy *= k; d = max; }
  const c = (l1*l1 + d*d - l2*l2)/(2*l1*d);
  const t = Math.atan2(dy, dx) + bend*Math.acos(Math.max(-1, Math.min(1, c)));
  return [[a[0]+Math.cos(t)*l1, a[1]+Math.sin(t)*l1], [a[0]+dx, a[1]+dy]];
}

      }
    }
    if(k.b1 && time - this.lastBolt > .07){
      this.lastBolt = time;
      const show = Math.random() < .35 + boost*.4;
      for(const b of ['b1','b2']){
        if(!show){ k[b].setAttribute('points', ''); continue; }
        let x = H[0] + (Math.random()-.5)*90, y = 40 + Math.random()*60, pts = [];
        for(let j = 0; j < 6; j++){ pts.push(x.toFixed(0)+','+y.toFixed(0)); x += (Math.random()-.5)*22; y += 10 + Math.random()*14; }
        k[b].setAttribute('points', pts.join(' '));
      }
    }
    if(this.fN && effort !== this.eff){ this.eff = effort; this.fN.style.display = effort ? 'none' : ''; this.fE.style.display = effort ? '' : 'none'; }
  }
  /* animation « vivante » selon l'état */
  live(mode, t, boost = 0){
    if(mode === 'charge') return this.pose(shiftPose(POSES.charge, Math.sin(t*55)*1.2, Math.sin(t*40)*.8), true, t, boost);
    if(mode === 'victory') return this.pose(shiftPose(lerpPose(POSES.victory, POSES.stand, (Math.sin(t*10)+1)/6), 0, -Math.abs(Math.sin(t*5))*14), false, t, boost);
    if(mode === 'punch'){ const f = (Math.sin(t*9)+1)/2; return this.pose(lerpPose(POSES.guard, POSES.punch, f*f), f > .7, t, boost); }
    return this.pose(shiftPose(POSES.guard, 0, Math.sin(t*2.4)*1.4), false, t, boost);
  }
}

/* Boucle d'animation unique */
const ANIM = new Set();
function animAdd(fn){ ANIM.add(fn); if(ANIM.size === 1) requestAnimationFrame(loop); return () => ANIM.delete(fn); }
function loop(now){ if(!ANIM.size) return; for(const fn of [...ANIM]) fn(now/1000); requestAnimationFrame(loop); }

/* =========================================================
   PHOTO — recadrage carré 256 px
   ========================================================= */
function readPhoto(file, cb){
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const cv = document.createElement('canvas'), sz = 256; cv.width = cv.height = sz;
      const s = Math.min(im.width, im.height);
      cv.getContext('2d').drawImage(im, (im.width-s)/2, (im.height-s)/2, s, s, 0, 0, sz, sz);
      cb(cv.toDataURL('image/jpeg', .82));
    };
    im.onerror = () => toast('Image illisible');
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}

/* ---------- Enregistrer + effets ---------- */
function logAction(id, q, label){
  const p = me(), a = actById(id), before = total(p), fb = formIdx(before);
  const now = Date.now(), d = today(), w = weekKey();
  const pts = a.custom ? Math.max(1, Math.min(50, Math.round(q))) : Math.max(1, Math.round(q*a.p*streakMult(p)));
  if(a.once && dayLog(p).some(e => e.a === id)){ toast('Déjà compté aujourd\'hui'); return; }
  p.log.push({a:id, q: a.custom ? 1 : q, pts, d, w, ts:now, label: a.custom ? label : undefined});

  // Quêtes et combo
  const bonus = [];
  const got = new Set(p.log.filter(e => e.d === d && e.a === 'quete').map(e => e.qid));
  for(const qs of questsToday(p)) if(qs.ok && !got.has(qs.id)){ p.log.push({a:'quete', qid:qs.id, bonus:true, label:'Quête : ' + qs.n(qs.v), pts:QUEST_PTS, q:1, d, w, ts:now+1+bonus.length}); bonus.push(`🎯 Quête réussie : ${qs.n(qs.v)} (+${QUEST_PTS})`); }
  if(questsToday(p).every(x => x.ok) && !p.log.some(e => e.d === d && e.a === 'combo')){ p.log.push({a:'combo', bonus:true, label:'Combo des 3 quêtes', pts:COMBO_PTS, q:1, d, w, ts:now+10}); bonus.push(`💥 Combo des 3 quêtes ! (+${COMBO_PTS})`); }
  // Boss
  const b = bossNow(p);
  if(b.dead && !b.rewarded){ p.log.push({a:'boss', bonus:true, label:'Boss vaincu : ' + b.n, pts:BOSS_PTS, q:1, d, w, ts:now+20}); bonus.push(`👹 ${b.n} est vaincu ! (+${BOSS_PTS})`); }
  save();

  const after = total(p), fa = formIdx(after), gain = after - before;
  if(view !== 'home') go('home'); else renderHome();
  renderHeader();
  // effets
  heroMode = 'charge'; modeUntil = performance.now()/1000 + 1.4; heroBoost = 1;
  const st = $('#stage');
  if(st){
    st.classList.add('shake'); setTimeout(() => st.classList.remove('shake'), 700);
    const f = document.createElement('div'); f.className = 'floatpts'; f.textContent = '+' + fmtN(gain); st.appendChild(f); setTimeout(() => f.remove(), 1500);
    rollPower(before, p);
  }
  sweep(160, 700, .9, .08); buzz([40,30,80]);
  bonus.forEach((m, i) => setTimeout(() => toast(m), 900 + i*2200));
  if(fa > fb) setTimeout(() => transform(p, fb, fa), 1300);
}
function rollPower(beforePts, p){
  const el = $('#sPow'); if(!el) return;
  const from = Math.round(5 + beforePts*(1 + formIdx(beforePts)*.35)), to = power(p), t0 = performance.now();
  const stop = animAdd(() => {
    const f = Math.min(1, (performance.now() - t0)/900);
    if(!document.body.contains(el)){ stop(); return; }
    el.textContent = fmtN(from + (to - from)*(1 - Math.pow(1-f, 3)));
    if(f >= 1) stop();
  });
}

/* ---------- Transformation ---------- */
const TRANS_LINES = ['Quelque chose se réveille en toi…', 'Ton énergie déborde…', 'Le sol se met à trembler…', 'Tes limites se brisent…'];
function transform(p, from, to){
  const T = $('#trans'), F = FORMS[to], O = FORMS[from];
  T.style.setProperty('--tc', O.c);
  T.innerHTML = `<div class="ts" id="tLine">${TRANS_LINES[0]}</div><div class="tr" id="tRig"></div><div class="yell" id="tYell" hidden>HAAAAAA !</div>`;
  T.classList.add('on', 'shake');
  document.body.style.overflow = 'hidden';
  let w = new Warrior(p, from); $('#tRig').appendChild(w.svg);
  let boost = 0, mode = 'charge';
  const stop = animAdd(t => { boost = Math.min(1.6, boost + .01); w.live(mode, t, boost); });
  sweep(110, 900, 2.6, .14); buzz([100,50,100,50,300]);
  let i = 1;
  const li = setInterval(() => { const l = $('#tLine'); if(l && i < TRANS_LINES.length) l.textContent = TRANS_LINES[i++]; }, 650);
  setTimeout(() => { const y = $('#tYell'); if(y) y.hidden = false; }, 1500);
  setTimeout(() => {
    clearInterval(li);
    const fl = $('#flash'); fl.classList.add('on'); boom(); buzz(400);
    setTimeout(() => fl.classList.remove('on'), 60);
    T.classList.remove('shake');
    T.style.setProperty('--tc', F.c);
    w.svg.remove(); w = new Warrior(p, to); $('#tRig').appendChild(w.svg);
    mode = 'victory'; boost = .6;
    T.innerHTML = '';
    T.insertAdjacentHTML('beforeend', `<div class="ts">${esc(p.name)} devient…</div>`);
    T.appendChild(Object.assign(document.createElement('div'), {className:'tr', id:'tRig'}));
    $('#tRig').appendChild(w.svg);
    T.insertAdjacentHTML('beforeend', `<div class="tt">${esc(F.n)}</div><div class="ts">${esc(F.d)}</div><button class="btn big" id="tOk" style="max-width:320px">Continuer</button>`);
    setTimeout(() => [523,659,784,1047].forEach((f,k) => setTimeout(() => tone(f,.2,.18), k*130)), 400);
    $('#tOk').onclick = () => { stop(); T.classList.remove('on'); document.body.style.overflow = ''; go('home'); };
  }, 2800);
}

/* ---------- Journal ---------- */
function renderLog(){
  const p = me(), days = [];
  for(let i = 13; i >= 0; i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push(dkey(d)); }
  const per = days.map(d => p.log.filter(e => e.d === d).reduce((s,e) => s+e.pts, 0));
  const max = Math.max(10, ...per);
  const real = p.log.filter(e => !e.bonus);
  const tot = [
    ['Points au total', fmtN(total(p))],
    ['Actions enregistrées', fmtN(real.length)],
    ['Km (course + vélo)', fmtQ(sumA(real,'course') + sumA(real,'velo'))],
    ['Pas', fmtN(sumA(real,'marche'))],
    ['Pompes', fmtN(sumA(real,'pompes'))],
    ['Squats', fmtN(sumA(real,'squats'))],
    ['Abdos', fmtN(sumA(real,'abdos'))],
    ['Burpees', fmtN(sumA(real,'burpees'))],
    ['Min de gainage', fmtQ(sumA(real,'gainage'))],
    ['Min de sport', fmtN(['natation','muscu','combat','collectif','corde','yoga'].reduce((s,a) => s+sumA(real,a), 0))],
    ['Bonnes habitudes', fmtN(real.filter(e => actById(e.a)?.cat === 'sante').length)],
    ['Quêtes réussies', fmtN(p.log.filter(e => e.a === 'quete').length)],
    ['Boss vaincus', fmtN(p.log.filter(e => e.a === 'boss').length)],
    ['Meilleure série', bestStreak(p) + ' j'],
  ];
  const byDay = {};
  p.log.slice().reverse().forEach(e => (byDay[e.d] = byDay[e.d] || []).push(e));
  $('#v-log').innerHTML = `
    <h2 class="sec">Mon journal</h2>
    <div class="card"><div class="muted" style="font-size:12.5px">Points des 14 derniers jours</div>
      <div class="chart">${per.map((v,i) => `<div><b>${v ? fmtN(v) : ''}</b><i style="height:${v/max*100}%"></i><span>${days[i].slice(8)}</span></div>`).join('')}</div></div>
    <h3 class="sub">Mes totaux</h3>
    <div class="tots">${tot.map(([l,v]) => `<div class="tot"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
    <h3 class="sub">Historique</h3>
    ${Object.keys(byDay).length ? Object.entries(byDay).slice(0, 30).map(([d, L]) => `<div class="muted" style="font-size:12.5px;margin:14px 0 6px;font-weight:700">${new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'})} · ${fmtN(L.reduce((s,e)=>s+e.pts,0))} pts</div><div class="today">${L.map(entryHTML).join('')}</div>`).join('') : '<p class="muted">Ton historique apparaîtra ici.</p>'}`;
  bindDeletes($('#v-log'));
}
function bestStreak(p){
  const days = [...new Set(p.log.filter(e => !e.bonus).map(e => e.d))].sort();
  let best = 0, cur = 0, prev = null;
  for(const d of days){ const t = new Date(d+'T12:00'); cur = prev && (t - prev)/864e5 < 1.5 ? cur + 1 : 1; best = Math.max(best, cur); prev = t; }
  return best;
}

/* ---------- Éveils ---------- */
function renderEvo(){
  const p = me(), t = total(p), fi = formIdx(t);
  const v = $('#v-evo');
  v.innerHTML = `<h2 class="sec">Les 10 éveils</h2><p class="muted" style="font-size:14px;margin-bottom:12px">Gagne des points dans la vraie vie pour débloquer chaque transformation. Ta photo suit ton guerrier à chaque éveil.</p><div class="forms" id="forms"></div>`;
  const box = $('#forms'), rigs = [];
  FORMS.forEach((F, i) => {
    const lock = i > fi;
    const d = document.createElement('div');
    d.className = 'form' + (lock ? ' lock' : '') + (i === fi ? ' cur' : '');
    d.style.setProperty('--fc', F.c);
    d.innerHTML = `<div class="fig"></div><div><div class="fn">${esc(F.n)}</div><div class="fd">${lock ? '???' : esc(F.d)}</div><div class="fp">${i === 0 ? 'Départ' : lock ? `🔒 ${fmtN(F.pts)} pts · encore ${fmtN(F.pts - t)}` : `✓ Débloqué à ${fmtN(F.pts)} pts`}</div></div>${i === fi ? '<span class="pill now" style="color:var(--fc)">TOI</span>' : ''}`;
    const w = new Warrior(p, i, {view:'10 -30 180 240'});
    d.querySelector('.fig').appendChild(w.svg);
    rigs.push([w, i === fi]);
    box.appendChild(d);
  });
  viewStops.push(animAdd(tm => rigs.forEach(([w, cur], i) => w.live(cur ? 'charge' : 'idle', tm + i*.7, cur ? .3 : 0))));
}

  const list = DB.profiles.slice().sort((a,b) => total(b) - total(a));
  $('#v-team').innerHTML = `
    <h2 class="sec">Classement</h2>
    <p class="muted" style="font-size:14px;margin-bottom:12px">Crée un guerrier pour chaque membre de la famille ou chaque pote sur ce téléphone, et comparez vos puissances.</p>
    <div class="lb">${list.map((p,i) => { const F = FORMS[formIdx(total(p))]; return `
      <button class="lbr ${p.id === DB.cur ? 'me' : ''}" data-sw="${p.id}" style="--c:${F.c};text-align:left">
        <span class="rk">${['🥇','🥈','🥉'][i] || i+1}</span>
        <span class="av" style="${p.photo ? `background-image:url('${p.photo}')` : ''}">${p.photo ? '' : esc(p.name.slice(0,1).toUpperCase())}</span>
        <span class="nm"><b>${esc(p.name)}${p.id === DB.cur ? ' (toi)' : ''}</b><span>${esc(F.n)} · 🔥 ${streak(p)} j</span></span>
        <span class="pw">${fmtN(power(p))}</span>
      </button>`; }).join('')}</div>
    <button class="btn ghost big" id="tAdd" style="margin-top:14px">＋ Ajouter un guerrier</button>
    <p class="muted" style="font-size:12.5px;margin-top:10px">Touche un guerrier pour jouer avec son profil.</p>`;
  $('#v-team').querySelectorAll('[data-sw]').forEach(b => b.onclick = () => { DB.cur = b.dataset.sw; save(); toast('Profil : ' + me().name); renderApp(); });
  $('#tAdd').onclick = () => onboarding(false);
}

/* ---------- Profil ---------- */
function renderMe(){
  const p = me(), F = FORMS[formIdx(total(p))];
  $('#v-me').innerHTML = `
    <h2 class="sec">Mon profil</h2>
    <div class="card">
      <div class="row" style="gap:14px">
        <div class="hav" style="width:72px;height:72px;font-size:30px;${p.photo ? `background-image:url('${p.photo}')` : ''}">${p.photo ? '' : esc(p.name.slice(0,1).toUpperCase())}</div>
        <div><div style="font-weight:800;font-size:18px">${esc(p.name)}</div><div style="color:var(--aura);font-weight:700;font-size:13px">${esc(F.n)}</div>
        <div class="muted" style="font-size:13px">${p.age ? esc(p.age)+' ans · ' : ''}${esc(p.goal)} · ${esc((LEVELS.find(l => l[0] === p.level) || LEVELS[1])[1])}</div>
        <div class="muted" style="font-size:12px">Guerrier depuis le ${new Date(p.created+'T12:00').toLocaleDateString('fr-FR')}</div></div>
      </div>
      <button class="btn ghost big" id="mEdit" style="margin-top:14px">✏️ Modifier mon profil et ma photo</button>
    </div>
    <h3 class="sub">Comment gagner des points</h3>
    <div class="card" style="font-size:13.5px;line-height:1.6">
      ⚡ <b>Actions</b> : sport, force, santé, mental (voir « J'ai fait une action »).<br>
      🔥 <b>Régularité</b> : +5 % de points par jour d'affilée (jusqu'à +50 %).<br>
      🎯 <b>Quêtes du jour</b> : +${QUEST_PTS} chacune, +${COMBO_PTS} si les 3 sont faites.<br>
      👹 <b>Boss de la semaine</b> : +${BOSS_PTS} quand il est vaincu.
    </div>
    <h3 class="sub">Mes données</h3>
    <div class="row">
      <button class="btn ghost sm" id="mExp">⬇️ Exporter (sauvegarde)</button>
      <label class="btn ghost sm">⬆️ Importer<input type="file" accept="application/json" id="mImp" hidden></label>
    </div>
    <h3 class="sub">Zone de danger</h3>
    <button class="btn red sm" id="mDel">Supprimer ce guerrier</button>`;
  $('#mEdit').onclick = () => onboarding(true);
  $('#mExp').onclick = () => {
    const blob = new Blob([JSON.stringify(DB)], {type:'application/json'});
    const a = Object.assign(document.createElement('a'), {href:URL.createObjectURL(blob), download:'eveil-guerrier-sauvegarde.json'});
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('#mImp').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    f.text().then(txt => {
      try{ const d = JSON.parse(txt); if(!Array.isArray(d.profiles)) throw 0; if(!confirm('Remplacer toutes les données de ce téléphone par cette sauvegarde ?')) return; DB = d; save(); renderApp(); toast('Sauvegarde importée'); }
      catch(err){ toast('Fichier de sauvegarde invalide'); }
    });
  };
  $('#mDel').onclick = () => {
    if(!confirm(`Supprimer ${p.name} et toute sa progression ? C'est définitif.`)) return;
    DB.profiles = DB.profiles.filter(x => x.id !== p.id); DB.cur = DB.profiles[0] ? DB.profiles[0].id : null; save();
    view = 'home'; renderApp();
  };
}

/* ---------- Divers ---------- */
function openSheet(){ $('#scrim').classList.add('on'); }
function closeSheet(){ $('#scrim').classList.remove('on'); }
function bindClose(){ $('#sheet').querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet); }
$('#scrim').addEventListener('click', e => { if(e.target.id === 'scrim') closeSheet(); });
addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }

renderApp();
</script>
