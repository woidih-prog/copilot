<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Défis Héros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Bangers&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1216;
  --surface:#161C22;
  --surface2:#1D252D;
  --line:#2A343D;
  --ink:#ECEAE4;
  --muted:#8693A0;
  --amber:#F2B33D;
  --clay:#E0553F;
  --sage:#79BF95;
  --steel:#5E9BC4;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
input{font-family:inherit}
.manga{font-family:'Bangers',system-ui,sans-serif;letter-spacing:.04em;font-weight:400}
.muted{color:var(--muted)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(14,18,22,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.hd{display:flex;align-items:center;gap:12px;padding:10px 0}
.hd-info{flex:1;min-width:0}
.hd-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-title{font-size:12px;color:var(--amber)}
.xpbar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--clay));border-radius:99px;transition:width .6s}
.hd-xp{font-size:11px;color:var(--muted);margin-top:3px}
.hd-lvl{text-align:center;min-width:52px}
.hd-lvl b{display:block;font-family:'Bangers';font-size:30px;line-height:1;color:var(--amber)}
.hd-lvl span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.streak{font-size:12px;color:var(--ink);background:var(--surface2);border-radius:99px;padding:4px 9px;white-space:nowrap}

/* ---------- Avatars ---------- */
.av{
  --c:#888;
  position:relative;flex:none;
  width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 70%,#fff) 0,var(--c) 55%,color-mix(in srgb,var(--c) 60%,#000) 100%);
  display:grid;place-items:center;
  font-family:'Bangers';font-size:20px;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.35);
  box-shadow:0 0 0 2px rgba(255,255,255,.12),0 4px 12px rgba(0,0,0,.35);
}
.av em{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:.55em;background:var(--bg);border-radius:50%;width:1.7em;height:1.7em;display:grid;place-items:center;text-shadow:none;box-shadow:0 0 0 2px var(--line)}
.av.lg{width:88px;height:88px;font-size:38px}
.av.xl{width:120px;height:120px;font-size:52px}

/* ---------- Bottom nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(22,28,34,.96);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
nav.tabs button b{font-size:21px;line-height:1.1;filter:grayscale(.8);opacity:.75}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] b{filter:none;opacity:1}

section.view{display:none;padding:16px 0 24px}
section.view.on{display:block}
h2.sec{font-family:'Bangers';font-weight:400;letter-spacing:.05em;font-size:28px;margin:6px 0 12px}
h3.sub{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:22px 0 10px}

/* ---------- Cards / buttons ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px;
  background:var(--amber);color:#1a1307;
}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.red{background:var(--clay);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.seg button[data-d="legende"][aria-pressed="true"]{color:var(--amber)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}

/* ---------- Daily ---------- */
.daily{
  display:flex;gap:14px;align-items:center;
  background:linear-gradient(120deg,rgba(242,179,61,.18),rgba(224,85,63,.12));
  border:1px solid rgba(242,179,61,.35);border-radius:var(--radius);padding:14px;margin-bottom:8px;
}
.daily .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--amber);font-weight:700}
.daily .t{font-weight:700;font-size:17px;margin:2px 0}
.daily .d{font-size:13px;color:var(--muted)}

/* ---------- Map ---------- */
.map{
  position:relative;margin-top:12px;border-radius:22px;overflow:hidden;
  background:
    radial-gradient(circle at 20% 10%,rgba(94,155,196,.16),transparent 40%),
    radial-gradient(circle at 85% 40%,rgba(121,191,149,.13),transparent 40%),
    radial-gradient(circle at 15% 75%,rgba(224,85,63,.12),transparent 40%),
    radial-gradient(circle at 80% 95%,rgba(242,179,61,.14),transparent 40%),
    #111820;
  border:1px solid var(--line);
}
.map::before{
  content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:18px 18px;
}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;text-align:center;
}
.node .blob{
  position:absolute;width:170px;height:120px;left:50%;top:38px;transform:translate(-50%,-50%);
  border-radius:50%;filter:blur(26px);opacity:.33;background:var(--zc);pointer-events:none;
}
.node .orb{
  position:relative;width:76px;height:76px;border-radius:50%;
  display:grid;place-items:center;font-size:36px;
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--zc) 60%,#fff) 0,var(--zc) 50%,color-mix(in srgb,var(--zc) 55%,#000) 100%);
  box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--zc),0 10px 24px rgba(0,0,0,.45);
  transition:transform .15s;
}
.node:hover .orb,.node:focus-visible .orb{transform:scale(1.07)}
.node .nm{font-family:'Bangers';font-size:19px;letter-spacing:.04em;line-height:1.05;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.node .meta{font-size:11px;color:var(--muted)}
.node .stars{font-size:12px;letter-spacing:1px}
.node.locked .orb{filter:grayscale(1) brightness(.5)}
.node.locked .nm{color:var(--muted)}
.node .lock{position:absolute;right:-6px;top:-6px;font-size:18px;background:var(--bg);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--line)}
.node .here{position:absolute;left:-18px;top:-10px}
.node .here .av{width:36px;height:36px;font-size:15px;animation:bob 1.6s ease-in-out infinite}
.node.done .orb::after{content:"✓";position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;background:var(--sage);color:#0b1a10;font-weight:800;font-size:16px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
@keyframes bob{50%{transform:translateY(-5px)}}

/* ---------- Sheet (modal) ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{
  width:100%;max-width:760px;max-height:90vh;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-bottom:none;
  border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-hd{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.sheet-hd .zt{font-family:'Bangers';font-size:30px;letter-spacing:.04em;line-height:1}
.sheet-hd p{font-size:13px;color:var(--muted);margin-top:4px}
.x{margin-left:auto;align-self:flex-start;width:36px;height:36px;border-radius:50%;background:var(--surface2);font-size:18px;flex:none}

.ch{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface2);margin-top:10px}
.ch .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--bg);flex:none}
.ch .bd{flex:1;min-width:0}
.ch .nm{font-weight:700;font-size:15px}
.ch .ds{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.ch .tg{font-size:12px;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ch .tg b{color:var(--amber)}
.ch .medals{font-size:13px;letter-spacing:2px}
.ch.lock{opacity:.5}

/* ---------- List / filters ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;padding:7px 12px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;margin-bottom:10px}
.zhd{display:flex;align-items:center;gap:8px;margin:22px 0 2px;font-family:'Bangers';font-size:22px;letter-spacing:.04em}
.zhd small{font-family:'Archivo';font-size:12px;color:var(--muted);letter-spacing:0}

/* ---------- Characters ---------- */
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cc{
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  padding:16px 10px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);
}
.cc[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber) inset;background:linear-gradient(180deg,rgba(242,179,61,.12),var(--surface))}
.cc .n{font-weight:700;font-size:14px}
.cc .s{font-size:11.5px;color:var(--muted)}
.cc .b{font-size:11px;color:var(--sage)}

/* ---------- Profile ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:'Bangers';font-size:30px;letter-spacing:.03em;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.bdg{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px}
.bdg i{font-style:normal;font-size:30px;display:block}
.bdg b{display:block;font-size:12.5px;margin-top:6px}
.bdg span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}
.bdg.off{opacity:.38}
.bdg.off i{filter:grayscale(1)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;gap:10px;align-items:center;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.hist div span:nth-child(2){flex:1;min-width:0}
.hist .xp{color:var(--amber);font-weight:700}
.field{display:flex;gap:8px}
.field input{flex:1;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;min-width:0}

/* ---------- Runner (fullscreen session) ---------- */
#run{
  position:fixed;inset:0;z-index:60;display:none;flex-direction:column;
  background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--zc,#333) 35%,transparent),transparent 60%),var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
}
#run.on{display:flex}
.run-top{display:flex;align-items:center;gap:12px;max-width:760px;width:100%;margin:0 auto}
.run-top .t{flex:1;min-width:0}
.run-top .t b{display:block;font-family:'Bangers';font-size:26px;letter-spacing:.04em;line-height:1}
.run-top .t span{font-size:12px;color:var(--muted)}
.run-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;max-width:760px;width:100%;margin:0 auto;text-align:center}
.coach{display:flex;gap:10px;align-items:center;max-width:520px;text-align:left}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14px}
.big{font-family:'Bangers';font-size:min(30vw,160px);line-height:.9;letter-spacing:.02em}
.big small{font-size:.32em;color:var(--muted)}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.tap{
  width:min(78vw,340px);height:min(78vw,340px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--zc) 55%,#fff),var(--zc) 55%,color-mix(in srgb,var(--zc) 55%,#000));
  box-shadow:0 0 0 8px rgba(255,255,255,.05),0 20px 50px rgba(0,0,0,.5);
  display:grid;place-items:center;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  transition:transform .06s;
}
.tap:active{transform:scale(.96)}
.tap .big{text-shadow:0 4px 0 rgba(0,0,0,.3)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ring{position:relative;width:min(72vw,300px);height:min(72vw,300px)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in .big{font-size:min(20vw,96px)}
.phase{font-family:'Bangers';font-size:34px;letter-spacing:.05em}
.phase.rest{color:var(--sage)}
.phase.work{color:var(--clay)}
.phase.prep{color:var(--amber)}
.next{font-size:13px;color:var(--muted)}
.prog{width:min(90%,420px);height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--zc,var(--amber));transition:width .2s}

/* Sonic game */
.track{position:relative;width:min(92vw,560px);height:70px;border-radius:14px;background:repeating-linear-gradient(90deg,#2b6b35 0 40px,#337d3f 40px 80px);overflow:hidden;border:2px solid #1d4a24}
.track .runner{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:40px;transition:left .1s linear}
.track .goal{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:30px}
.lr{display:flex;gap:12px;width:min(92vw,560px)}
.lr button{flex:1;height:150px;border-radius:20px;font-family:'Bangers';font-size:42px;color:#fff;background:#1E5BD8;box-shadow:0 8px 0 #0f347f;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.lr button.want{outline:4px solid var(--amber)}
.lr button:active{transform:translateY(4px);box-shadow:0 4px 0 #0f347f}

/* Reaction game */
.react{width:min(92vw,560px);height:min(60vh,380px);border-radius:24px;display:grid;place-items:center;font-family:'Bangers';font-size:40px;letter-spacing:.04em;padding:20px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.react.wait{background:#7a1f1f;color:#fff}
.react.go{background:#F7D02C;color:#2a2200}
.react.idle{background:var(--surface2);color:var(--ink)}

/* Win modal */
.win{text-align:center}
.win .burst{font-family:'Bangers';font-size:54px;letter-spacing:.04em;color:var(--amber);line-height:1;margin:8px 0}
.win .xpgain{font-family:'Bangers';font-size:40px;color:var(--sage)}
.win .lvlup{margin-top:10px;padding:10px;border-radius:12px;background:rgba(242,179,61,.15);border:1px solid rgba(242,179,61,.4);font-weight:700}
.win .nb{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.win .nb div{padding:8px;border-radius:10px;background:var(--surface2);font-size:14px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}


/* ---------- Héros animés ---------- */
.rig{display:block;width:100%;height:100%;overflow:visible}
.rig .blink{animation:blink 3.6s infinite;transform-box:fill-box;transform-origin:center}
.rig .aura{animation:aura .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes aura{from{transform:scale(.94,.97);opacity:.75}to{transform:scale(1.05,1.06);opacity:1}}

/* ---------- Vue duel ---------- */
.dstage{
  position:relative;height:300px;border-radius:22px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 110%,color-mix(in srgb,var(--zc) 55%,transparent),transparent 65%),
             linear-gradient(180deg,#141b23,#0f141a);
}
.dstage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.08));border-top:1px solid rgba(255,255,255,.08)}
.dprev{position:absolute;left:50%;bottom:4px;height:270px;width:280px;transform:translateX(-50%);z-index:1}
.dtag{position:absolute;left:14px;top:12px;z-index:2;display:flex;flex-direction:column}
.dtag b{font-size:30px;line-height:1;color:var(--zc);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.dtag span{font-size:12px;color:var(--muted)}
.dvs{position:absolute;right:14px;top:12px;z-index:2;text-align:right;font-size:40px;line-height:.9;color:var(--amber);text-shadow:0 3px 0 rgba(0,0,0,.4)}
.dvs small{font-size:16px;color:var(--ink)}
.hint{font-size:13px;margin-top:8px;line-height:1.4}
.hpick{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.hpick::-webkit-scrollbar{display:none}
.hchip{flex:none;width:82px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;font-weight:600;scroll-snap-align:center}
.hchip svg{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 45%,transparent),var(--surface2))}
.hchip[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.wrapf{flex-wrap:wrap;overflow:visible}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:10px}
.fightbtn{width:100%;margin-top:22px;padding:16px;font-size:28px;letter-spacing:.06em;background:linear-gradient(90deg,var(--amber),var(--clay));color:#1a0d05;box-shadow:0 8px 24px rgba(224,85,63,.35)}
.beaten{display:flex;flex-wrap:wrap;gap:6px}
.seg button:disabled{opacity:.35}

/* ---------- Combat ---------- */
.fight{display:flex;flex-direction:column;gap:10px;height:100%;max-width:760px;width:100%;margin:0 auto;position:relative}
.ftop{display:flex;align-items:center;gap:12px}
.ft{flex:1;min-width:0;display:flex;flex-direction:column}
.ft b{font-size:24px;line-height:1}
.ft span{font-size:12px;color:var(--muted)}
.ftime{font-size:30px;color:var(--amber);min-width:90px;text-align:right}
.fstage{position:relative;flex:0 0 38%;min-height:200px;border-radius:20px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 115%,color-mix(in srgb,var(--zc) 60%,transparent),transparent 65%),linear-gradient(180deg,#151c24,#0f141a)}
.fstage .rig{position:absolute;left:50%;bottom:2px;height:96%;width:auto;transform:translateX(-50%)}
.hn{position:absolute;left:12px;top:10px;z-index:2;display:flex;flex-direction:column}
.hn b{font-family:'Bangers';font-size:24px;letter-spacing:.04em;line-height:1;color:var(--zc)}
.hn small{font-size:11px;color:var(--muted)}
.hcnt{position:absolute;right:14px;top:6px;z-index:2;font-size:64px;line-height:1;color:var(--zc);text-shadow:0 3px 0 rgba(0,0,0,.4)}
.say{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:3;max-width:80%;background:#fff;color:#111;font-weight:700;font-size:14px;padding:8px 12px;border-radius:14px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:pop .2s ease-out}
.say::after{content:"";position:absolute;left:50%;bottom:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0;transform:translateX(-50%)}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700}
.bar span{width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{flex:1;height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bt i{display:block;height:100%;width:0;border-radius:99px;transition:width .15s}
.pzone{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.pz{flex:1;min-height:150px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 50% 30%,#3c8a5c,#245a3b);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.4)}
.pz:active{transform:scale(.985)}
.pz .pc{font-size:min(28vw,120px);line-height:.9;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.pz .pl{font-size:13px;opacity:.85}
.pz.drop{background:radial-gradient(circle at 50% 30%,#c0473a,#7d2219);font-family:'Bangers';font-size:40px;letter-spacing:.05em}
.holdt{text-align:center;font-size:64px;line-height:1;color:var(--sage)}
.meter{width:60%;height:8px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:#fff}
.cd{position:absolute;inset:-12px -16px;z-index:10;display:none;place-items:center;background:rgba(10,13,17,.82);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.cdt{font-size:min(32vw,170px);color:var(--amber);text-align:center;line-height:1;animation:zoom .7s ease-out both;text-shadow:0 6px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center}
.cdt .vsn{font-size:min(11vw,52px);color:var(--ink)}
.cdt .vsx{font-size:min(16vw,80px);color:var(--clay);margin:4px 0}
@keyframes zoom{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
.endp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.et{font-size:54px;line-height:1}
.et.win{color:var(--amber)}.et.lose{color:var(--clay)}.et.draw{color:var(--steel)}
.er{display:flex;gap:10px;width:100%;max-width:420px}
.er div{flex:1;background:var(--surface2);border-radius:12px;padding:8px}
.er span{display:block;font-size:12px;color:var(--muted)}
.er b{font-size:17px}
.exp{font-size:34px;color:var(--sage)}
.lvlup,.nbg{padding:8px 12px;border-radius:10px;background:rgba(242,179,61,.15);border:1px solid rgba(242,179,61,.4);font-weight:700;font-size:14px}
.turn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.turn .tn{font-size:30px;color:var(--muted)}
.turn .tp{font-size:min(18vw,90px);line-height:1;color:var(--amber)}
.podium{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pr{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pr.ph{border-color:var(--zc)}
.pr .pn{font-size:28px;width:40px}
.pr .pname{flex:1;font-weight:700}
.pr small{color:var(--muted);font-weight:400}

/* ---------- Face à face ---------- */
.fo{position:relative;display:flex;flex-direction:column;height:100%;max-width:760px;width:100%;margin:0 auto;gap:8px}
.half{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;position:relative}
.half.flip{transform:rotate(180deg)}
.hhd{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.hhd b{font-size:24px}
.hcount{font-size:44px;line-height:1;color:var(--amber)}
.hz{flex:1;border-radius:22px;font-family:'Bangers';font-size:34px;letter-spacing:.06em;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:radial-gradient(circle at 50% 30%,#3a6fb5,#1f3f73);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
#h1 .hz{background:radial-gradient(circle at 50% 30%,#3c8a5c,#245a3b)}
.hz.drop{background:radial-gradient(circle at 50% 30%,#c0473a,#7d2219)!important}
.hz:disabled{opacity:.25}
.hmsg{position:absolute;left:0;right:0;top:50%;transform:translateY(-30%);text-align:center;font-size:38px;color:var(--amber);pointer-events:none;text-shadow:0 3px 10px rgba(0,0,0,.8)}
.hmsg small{display:block;font-family:'Archivo';font-size:13px;color:var(--ink);margin-top:6px;line-height:1.5}
.mid{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.mt{flex:1;display:flex;flex-direction:column;min-width:0}
.mt b{font-size:28px;line-height:1;color:var(--amber)}
.mt span{font-size:11.5px;color:var(--muted)}
.mh{display:flex;align-items:center;gap:4px}
.mh #mrig{width:76px;height:72px}
.mh span{font-size:30px;color:var(--zc);min-width:26px}

/* ---------- Galerie héros ---------- */
.ccfig{width:100%;height:150px;border-radius:12px;background:radial-gradient(circle at 50% 100%,color-mix(in srgb,var(--c) 55%,transparent),transparent 70%)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:420px){
  .node{width:120px}
  .node .orb{width:64px;height:64px;font-size:30px}
  .node .nm{font-size:17px}
}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <div id="hdAv"></div>
    <div class="hd-info">
      <div class="hd-name" id="hdName"></div>

    <div class="streak" id="hdStreak" title="Jours d'affilée"></div>
    <div class="hd-lvl"><b id="hdLvl">1</b><span>Niveau</span></div>
  </div>
</header>

<main class="wrap">
  <section class="view on" id="v-duel"></section>

  <section class="view" id="v-map">
    <div id="daily"></div>
    <div class="map" id="map"></div>
  </section>

  <section class="view" id="v-list">
    <h2 class="sec">Tous les défis</h2>
    <input class="search" id="q" type="search" placeholder="Chercher : pompes, course, Goku…" aria-label="Chercher un défi">
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </section>

  <section class="view" id="v-chars">
    <h2 class="sec">Les héros</h2>

    <div class="chars" id="chars"></div>
  </section>

  <section class="view" id="v-me">
    <h2 class="sec">Mon profil</h2>
    <div class="field">
      <input id="pname" maxlength="24" placeholder="Ton pseudo de héros" aria-label="Pseudo">

    <h3 class="sub">Statistiques</h3>

    <h3 class="sub">Trophées</h3>
    <div class="badges" id="badges"></div>
    <h3 class="sub">Historique</h3>
    <div class="hist" id="hist"></div>
    <h3 class="sub">Zone de danger</h3>
    <button class="btn ghost sm" id="reset">Remettre à zéro ma progression</button>
  </section>
</main>

<nav class="tabs" aria-label="Navigation">

    <button data-v="duel" aria-current="page"><b>⚔️</b>Duel</button>

</nav>

/* Niveaux : il faut 50·L·(L−1) XP au total pour atteindre le niveau L */
const xpFor = L => 50*L*(L-1);
function levelOf(xp){ let L = 1; while(xp >= xpFor(L+1)) L++; return L; }
function titleOf(L){ let t = TITLES[0][1]; for(const [l,n] of TITLES) if(L >= l) t = n; return t; }
const unlocked = z => levelOf(S.xp) >= z.lvl;

function streak(){
  const set = new Set(S.days); let n = 0; const d = new Date();
  if(!set.has(today())) d.setDate(d.getDate()-1);
  for(;;){
    const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!set.has(k)) break; n++; d.setDate(d.getDate()-1);
  }
  return n;
}

function target(ch, d){
  if(ch.targets) return ch.targets[DKEYS.indexOf(d)];
  if(ch.t === 'hiit') return Math.max(1, Math.round(ch.hiit.rounds*(ch.breath ? 1 : DIFFS[d].m)));
  const v = ch.base*DIFFS[d].m;
  return ch.t === 'distance' ? Math.round(v*10)/10 : Math.max(1, Math.round(v));
}
function fmtSecs(s){ s = Math.max(0, Math.round(s)); const m = Math.floor(s/60); return m ? m+' min'+(s%60 ? ' '+String(s%60).padStart(2,'0') : '') : s+' s'; }
function clock(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function hiitTotal(ch, d){ return buildPhases(ch, d).reduce((a,p) => a+p.s, 0); }
function targetText(ch, d){
  const v = target(ch, d);
  switch(ch.t){
    case 'reps': return v+' '+ch.u;
    case 'timer': return fmtSecs(v);
    case 'distance': return String(v).replace('.',',')+' km';
    case 'hiit': return v+' tour'+(v>1?'s':'')+' · '+fmtSecs(hiitTotal(ch,d));
    case 'game': return ch.game === 'sonic' ? v+' foulées en 10 s' : 'moyenne < '+v+' ms';
  }
}
const typeIcon = ch => ({reps:'🔢', timer:'⏱️', hiit:'🔁', distance:'📍', game:'🎮'})[ch.t];
function xpOf(ch, d){
  let x = ch.xp*DIFFS[d].xp;
  if(charById(S.char).zone === ch.z) x *= 1.25;
  if(isDaily(ch) && !S.daily[today()]) x *= 2;
  return Math.round(x);
}

/* Défi du jour : déterministe d'après la date, parmi les zones débloquées */
function dailyCh(){
  if(S.dailyPick && S.dailyPick.day === today() && chById(S.dailyPick.id)) return chById(S.dailyPick.id);
  const pool = CH.filter(c => unlocked(zoneById(c.z)));
  let h = 0; for(const ch of today()) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  S.dailyPick = {day:today(), id:pool[h % pool.length].id}; save();
  return chById(S.dailyPick.id);
}
const isDaily = ch => dailyCh().id === ch.id;

/* =========================================================

   ========================================================= */
let AC = null;
function beep(f = 880, dur = .12, vol = .25){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + dur);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}
const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
function fanfare(){ [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f,.16,.2), i*120)); }
let wake = null;
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen');
    else if(!on && wake){ await wake.release(); wake = null; }
  }catch(e){}
}

  return `<div class="av ${cls}" style="--c:${c.c}" aria-hidden="true">${c.ini}<em>${c.e}</em></div>`;
}
function renderHeader(){
  const L = levelOf(S.xp), c = charById(S.char);
  const lo = xpFor(L), hi = xpFor(L+1);
  $('#hdAv').innerHTML = avatar(c);
  $('#hdName').textContent = (S.name || 'Héros sans nom') + ' · coach ' + c.name;
  $('#hdTitle').textContent = titleOf(L);
  $('#hdBar').style.width = Math.min(100, (S.xp-lo)/(hi-lo)*100) + '%';
  $('#hdXp').textContent = `${S.xp-lo} / ${hi-lo} XP vers le niveau ${L+1}`;
  $('#hdLvl').textContent = L;
  const s = streak();
  $('#hdStreak').textContent = '🔥 ' + s;
  $('#hdStreak').title = s + ' jour(s) d\'affilée';
}

    <div class="row">
      <button class="btn ghost sm" id="m1">−1</button>
      <button class="btn ghost sm" id="p5">+5</button>

    </div>`;
  const upd = () => {
    $('#cnt').innerHTML = `${n}<small>/${goal}</small>`;

/* ---- Anneau de progression réutilisable ---- */
function ringHTML(id){
  return `<div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="44" fill="none" stroke="var(--surface2)" stroke-width="8"/>
      <circle id="${id}" cx="50" cy="50" r="44" fill="none" stroke="var(--zc)" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="0"/>
    </svg><div class="in" id="${id}-in"></div></div>`;
}
const setRing = (id, frac) => { const r = document.getElementById(id); if(r) r.style.strokeDashoffset = 276.46*(1-Math.max(0,Math.min(1,frac))); };

/* ---- Moteur de minuterie à phases (sert au chrono simple et aux intervalles) ---- */
function phaseEngine(phases, onTick, onEnd){
  let i = 0, left = phases[0].s, last = performance.now(), running = false, lastBeep = null;
  const t = setInterval(() => {
    const now = performance.now(), dt = (now - last)/1000; last = now;
    if(!running) return;
    left -= dt;
    const sec = Math.ceil(left);
    if(sec <= 3 && sec >= 1 && lastBeep !== i+':'+sec){ lastBeep = i+':'+sec; beep(660,.08,.18); }
    if(left <= 0){
      i++;
      if(i >= phases.length){ clearInterval(t); running = false; onTick(phases.length-1, 0); onEnd(); return; }
      left += phases[i].s; beep(phases[i].k === 'work' ? 1046 : 520, .25, .25); buzz(200);
    }
    onTick(i, left);
  }, 100);
  onCleanup(() => clearInterval(t));
  return {
    toggle(){ running = !running; last = performance.now(); if(running) beep(880,.1,.2); return running; },
    skip(){ left = .001; running = true; },
    get running(){ return running; },
  };
}

function runTimer(ch, d, el, done){
  const goal = target(ch, d);
  el.innerHTML = `${ringHTML('rg')}<div class="row"><button class="btn" id="go">▶ Démarrer</button><button class="btn ghost" id="fin" style="display:none">J'ai tenu ✓</button></div>`;
  const draw = left => { $('#rg-in').innerHTML = `<span class="big">${clock(left)}</span><span class="lbl">${esc(ch.cat === 'gainage' ? 'Tiens bon' : 'Continue')}</span>`; setRing('rg', left/goal); };
  draw(goal);
  const eng = phaseEngine([{l:ch.n, s:goal, k:'work'}], (i,left) => draw(left), () => { fanfare(); buzz([100,60,200]); done(goal); });
  $('#go').onclick = () => { const r = eng.toggle(); $('#go').textContent = r ? '⏸ Pause' : '▶ Reprendre'; $('#fin').style.display = ''; };
  $('#fin').onclick = () => { if(confirm('Valider le défi comme terminé ?')){ fanfare(); done(goal); } };
}

function buildPhases(ch, d){
  const h = ch.hiit, rounds = target(ch, d), P = [{l:'Prépare-toi', s:10, k:'prep'}];
  for(let r = 0; r < rounds; r++){
    if(h.seq){ h.seq.forEach(([l,s,k]) => P.push({l, s, k, r})); continue; }
    const labels = h.labels || ['Effort'];
    // Circuit : tous les exercices à chaque tour ; sinon un exercice par tour, en alternance
    const list = h.circuit ? labels : [labels[r % labels.length]];
    list.forEach((l, j) => {
      P.push({l, s:h.work, k:'work', r});
      const last = r === rounds-1 && j === list.length-1;
      if(!last && h.rest) P.push({l:'Repos', s:h.rest, k:'rest', r});
    });
  }
  return P;
}
function runHiit(ch, d, el, done){
  const P = buildPhases(ch, d), rounds = target(ch, d);
  const workSecs = P.filter(p => p.k === 'work').reduce((a,p) => a+p.s, 0);
  el.innerHTML = `
    <div class="phase prep" id="ph">Prépare-toi</div>
    ${ringHTML('rg')}
    <div class="next" id="nx"></div>
    <div class="row"><button class="btn" id="go">▶ Démarrer</button><button class="btn ghost" id="sk">Passer ⏭</button></div>`;
  const draw = (i, left) => {
    const p = P[i], nx = P.slice(i+1).find(q => q.k !== 'rest') || null;
    const ph = $('#ph'); ph.textContent = p.l; ph.className = 'phase '+p.k;
    $('#rg-in').innerHTML = `<span class="big">${clock(left)}</span><span class="lbl">${p.r !== undefined ? 'Tour '+(p.r+1)+' / '+rounds : 'Départ'}</span>`;
    setRing('rg', left/p.s);
    $('#nx').textContent = nx ? 'Ensuite : '+nx.l : 'Dernière ligne droite !';
  };
  draw(0, P[0].s);
  const eng = phaseEngine(P, draw, () => { fanfare(); buzz([100,60,200]); done(workSecs); });
  $('#go').onclick = () => { const r = eng.toggle(); $('#go').textContent = r ? '⏸ Pause' : '▶ Reprendre'; };
  $('#sk').onclick = () => eng.skip();
}

/* ---- Course : suivi GPS ou saisie manuelle ---- */
function runDistance(ch, d, el, done){
  const goal = target(ch, d);
  let km = 0, t0 = null, elapsed = 0, prev = null, watch = null, tick = null;
  el.innerHTML = `
    ${ringHTML('rg')}
    <div class="row" style="gap:22px">
      <div><div class="lbl">Temps</div><div class="manga" style="font-size:30px" id="tm">0:00</div></div>
      <div><div class="lbl">Allure</div><div class="manga" style="font-size:30px" id="pc">–</div></div>
    </div>
    <div class="row"><button class="btn" id="gps">📍 Démarrer le GPS</button></div>
    <p class="muted" id="gpsMsg" style="font-size:13px;max-width:420px">Le GPS mesure ta course (garde l'écran allumé). Sur tapis ou sans GPS, entre ta distance ci-dessous.</p>
    <div class="field" style="width:min(90%,340px)">
      <input id="man" type="number" inputmode="decimal" min="0" step="0.1" placeholder="Distance faite (km)" aria-label="Distance en km">
      <button class="btn sm" id="manOk">Valider</button>
    </div>`;
  const draw = () => {
    $('#rg-in').innerHTML = `<span class="big">${km.toFixed(2).replace('.',',')}</span><span class="lbl">/ ${String(goal).replace('.',',')} km</span>`;
    setRing('rg', km/goal);
    $('#tm').textContent = clock(elapsed);
    $('#pc').textContent = km > .05 ? clock(elapsed/km)+'/km' : '–';
  };
  draw();
  const hav = (a, b) => {
    const R = 6371, r = x => x*Math.PI/180;
    const dLa = r(b.latitude-a.latitude), dLo = r(b.longitude-a.longitude);
    const h = Math.sin(dLa/2)**2 + Math.cos(r(a.latitude))*Math.cos(r(b.latitude))*Math.sin(dLo/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  };
  const stopGps = () => { if(watch !== null) navigator.geolocation.clearWatch(watch); watch = null; clearInterval(tick); };
  onCleanup(stopGps);
  const complete = () => { stopGps(); fanfare(); buzz([100,60,200]); done(km); };
  $('#gps').onclick = () => {
    if(watch !== null){ stopGps(); $('#gps').textContent = '📍 Reprendre le GPS'; return; }
    if(!navigator.geolocation){ $('#gpsMsg').textContent = 'GPS indisponible sur cet appareil : utilise la saisie manuelle.'; return; }
    $('#gpsMsg').textContent = 'Recherche du signal GPS…';
    t0 = performance.now() - elapsed*1000;
    tick = setInterval(() => { elapsed = (performance.now()-t0)/1000; draw(); }, 1000);
    prev = null;
    watch = navigator.geolocation.watchPosition(pos => {
      const c = pos.coords;
      if(c.accuracy > 35) { $('#gpsMsg').textContent = `Signal faible (±${Math.round(c.accuracy)} m)…`; return; }
      $('#gpsMsg').textContent = `GPS actif (±${Math.round(c.accuracy)} m). Bonne course !`;
      if(prev){ const seg = hav(prev, c); if(seg > .004 && seg < .2) km += seg; }
      prev = c; draw();
      if(km >= goal) complete();
    }, err => { $('#gpsMsg').textContent = 'GPS refusé ou indisponible ('+err.message+'). Utilise la saisie manuelle.'; stopGps(); },
    {enableHighAccuracy:true, maximumAge:0, timeout:20000});
    $('#gps').textContent = '⏸ Pause GPS';
  };
  $('#manOk').onclick = () => {
    const v = parseFloat(String($('#man').value).replace(',','.'));
    if(!(v > 0)){ toast('Entre une distance en km'); return; }
    km = Math.max(km, v); draw();
    if(km >= goal) complete();
    else toast(`Encore ${(goal-km).toFixed(1).replace('.',',')} km pour valider !`);
  };
}

/* ---- Mini-jeu : sprint de Sonic (alterner gauche/droite) ---- */
function runSonic(ch, d, el, done){
  const goal = target(ch, d), DUR = 10;
  let n = 0, want = 'L', t0 = 0, left = DUR, playing = false, tm = null;
  el.innerHTML = `
    <div class="big" id="sc" style="font-size:90px">0</div>
    <div class="track"><span class="goal">🏁</span><span class="runner" id="rn" style="left:8%">🦔</span></div>
    <div class="lbl" id="sl">Objectif : ${goal} foulées · ${DUR} s</div>
    <div class="lr"><button id="L" class="want">◀ G</button><button id="R">D ▶</button></div>
    <button class="btn" id="go">Prêt ? Partez !</button>`;
  const step = side => {
    if(!playing || side !== want) return;
    n++; want = want === 'L' ? 'R' : 'L';
    $('#L').classList.toggle('want', want === 'L'); $('#R').classList.toggle('want', want === 'R');
    $('#sc').textContent = n;
    $('#rn').style.left = Math.min(92, 8 + n/goal*84) + '%';
    if(n % 10 === 0) beep(880 + n*4, .05, .12);
  };
  const end = () => {
    playing = false; clearInterval(tm);
    S.best[ch.id] = Math.max(S.best[ch.id] || 0, n); save();
    const ok = n >= goal;
    if(ok) fanfare(); else beep(200,.4,.2);
    done(n, ok);
  };
  const press = side => e => { e.preventDefault(); step(side); };
  $('#L').addEventListener('pointerdown', press('L'));
  $('#R').addEventListener('pointerdown', press('R'));
  const key = e => {
    if(['KeyF','ArrowLeft'].includes(e.code)){ e.preventDefault(); step('L'); }
    if(['KeyJ','ArrowRight'].includes(e.code)){ e.preventDefault(); step('R'); }
  };
  addEventListener('keydown', key);
  onCleanup(() => { removeEventListener('keydown', key); clearInterval(tm); });
  $('#go').onclick = () => {
    $('#go').disabled = true;
    let c = 3; $('#sl').textContent = c; beep(520,.12);
    const cd = setInterval(() => {
      c--;
      if(c > 0){ $('#sl').textContent = c; beep(520,.12); return; }
      clearInterval(cd); beep(1046,.25);
      playing = true; t0 = performance.now(); $('#go').style.display = 'none';
      tm = setInterval(() => {
        left = DUR - (performance.now()-t0)/1000;
        $('#sl').textContent = `${Math.max(0,left).toFixed(1)} s · objectif ${goal}`;
        if(left <= 0) end();
      }, 50);
    }, 700);
    onCleanup(() => clearInterval(cd));
  };
}

/* ---- Mini-jeu : réflexes (5 essais) ---- */
function runReaction(ch, d, el, done){
  const goal = target(ch, d), TRIES = 5, times = [];
  let state = 'idle', t0 = 0, to = null;
  el.innerHTML = `
    <button class="react idle" id="pad">Touche pour commencer</button>
    <div class="lbl" id="rl">Objectif : moyenne sous ${goal} ms · ${TRIES} essais</div>`;
  const pad = $('#pad');
  const setPad = (cls, txt) => { pad.className = 'react '+cls; pad.textContent = txt; };
  const arm = () => {
    state = 'wait'; setPad('wait', 'Attends l\'éclair…');
    to = setTimeout(() => { state = 'go'; t0 = performance.now(); setPad('go', '⚡ MAINTENANT !'); beep(1200,.08,.2); }, 1200 + Math.random()*2800);
  };
  onCleanup(() => clearTimeout(to));
  const hit = e => {
    e.preventDefault();
    if(state === 'idle' || state === 'pause'){ arm(); return; }
    if(state === 'wait'){ clearTimeout(to); state = 'pause'; beep(180,.3,.2); setPad('idle', 'Trop tôt ! Touche pour réessayer'); return; }
    if(state === 'go'){
      const ms = Math.round(performance.now()-t0); times.push(ms); buzz(30);
      const avg = Math.round(times.reduce((a,b) => a+b, 0)/times.length);
      $('#rl').textContent = `Essais : ${times.join(' · ')} ms — moyenne ${avg} ms`;
      if(times.length >= TRIES){
        state = 'end';
        S.best[ch.id] = Math.min(S.best[ch.id] || 9999, avg); save();
        const ok = avg <= goal;
        setPad('idle', `${avg} ms de moyenne`);
        if(ok) fanfare(); else beep(200,.4,.2);
        setTimeout(() => done(avg, ok), 700);
        return;
      }
      state = 'pause'; setPad('idle', `${ms} ms ! Touche pour l'essai ${times.length+1}`);
    }
  };
  pad.addEventListener('pointerdown', hit);
  const key = e => { if(e.code === 'Space') hit(e); };
  addEventListener('keydown', key); onCleanup(() => removeEventListener('keydown', key));
}

/* =========================================================
   FIN DE DÉFI : XP, stats, trophées
   ========================================================= */
function finish(ch, d, val, ok){
  const c = charById(S.char);
  stopRun();
  if(!ok){
    const msg = ch.game === 'sonic' ? `${val} foulées (record : ${S.best[ch.id]})` : `${val} ms de moyenne (record : ${S.best[ch.id]} ms)`;
    $('#sheet').innerHTML = `<div class="win">
      ${avatar(c,'xl')}
      <div class="burst" style="color:var(--clay)">Presque !</div>
      <p>${msg}</p>
      <p class="muted" style="margin-top:6px">Objectif : ${targetText(ch, d)}</p>
      <div class="bubble" style="margin:14px auto;max-width:360px">« ${esc(pick(c.q))} »</div>
      <div class="row"><button class="btn" id="again">Rejouer</button><button class="btn ghost" data-close>Fermer</button></div>
    </div>`;
    $('#again').onclick = () => { closeSheet(); startRun(ch, d); };
    $('#sheet').querySelector('[data-close]').onclick = () => { closeSheet(); renderAll(); };
    openSheet(); renderAll();
    return;
  }
  const before = levelOf(S.xp);
  const gain = xpOf(ch, d), wasDaily = isDaily(ch) && !S.daily[today()];
  S.xp += gain;
  if(wasDaily) S.daily[today()] = true;
  S.done[ch.id] = Object.assign(S.done[ch.id] || {}, {[d]: true});
  // Statistiques : nombre réel pour les répétitions et la course, secondes pour le reste
  if(ch.stat !== 'jeu') S.stats[ch.stat] = (S.stats[ch.stat] || 0) + val;
  if(!S.days.includes(today())) S.days.push(today());
  S.hist.push({c:ch.id, d, xp:gain, day:today(), v:val});
  if(S.hist.length > 500) S.hist = S.hist.slice(-500);
  const after = levelOf(S.xp);
  const newBadges = checkBadges();
  const newZones = ZONES.filter(z => z.lvl > before && z.lvl <= after);
  save();

  const valTxt = ch.t === 'reps' ? `${val} ${ch.u}` : ch.t === 'distance' ? `${val.toFixed(2).replace('.',',')} km` :
    ch.t === 'game' ? (ch.game === 'sonic' ? `${val} foulées` : `${val} ms de moyenne`) : fmtSecs(val)+' d\'effort';
  $('#sheet').innerHTML = `<div class="win">
    ${avatar(c,'xl')}
    <div class="burst">${pick(['Défi réussi !','K.O. !','Victoire !','Plus Ultra !','Stage clear !'])}</div>
    <p><b>${esc(ch.n)}</b> · ${DIFFS[d].medal} ${DIFFS[d].label}</p>
    <p class="muted">${valTxt}</p>
    <div class="xpgain">+${gain} XP${wasDaily ? ' <small style="font-size:.5em">(défi du jour ×2)</small>' : ''}</div>
    <div class="bubble" style="margin:10px auto;max-width:360px">${esc(c.name)} : « ${esc(pick(c.q))} »</div>
    ${after > before ? `<div class="lvlup">⬆️ Niveau ${after} ! Tu es maintenant « ${titleOf(after)} »${newZones.length ? '<br>🔓 Nouvelle zone : '+newZones.map(z => z.e+' '+esc(z.name)).join(', ') : ''}</div>` : ''}
    ${newBadges.length ? `<div class="nb">${newBadges.map(b => `<div>🏆 Trophée débloqué : ${b.e} <b>${esc(b.n)}</b></div>`).join('')}</div>` : ''}
    <div class="row" style="margin-top:16px"><button class="btn" data-close>Continuer</button></div>
  </div>`;
  $('#sheet').querySelector('[data-close]').onclick = () => { closeSheet(); renderAll(); };
  openSheet(); confetti(); renderAll();
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#F2B33D','#E0553F','#79BF95','#5E9BC4','#ECEAE4'];
  for(let i = 0; i < 70; i++){
    const p = document.createElement('i');
    p.style.left = Math.random()*100 + 'vw';
    p.style.background = pick(cols);
    p.style.animationDuration = 1.6 + Math.random()*1.6 + 's';
    p.style.animationDelay = Math.random()*.4 + 's';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3800);
}

function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, Math.round(v + (amt < 0 ? v : 255 - v)*amt)));
  return '#' + [f(n >> 16), f(n >> 8 & 255), f(n & 255)].map(v => v.toString(16).padStart(2,'0')).join('');
}

  const t = Math.atan2(dy, dx) + bend*Math.acos(Math.max(-1, Math.min(1, c)));

}

  }
}

/* Une seule boucle d'animation pour tout le jeu */
const ANIM = new Set();
function animAdd(fn){ ANIM.add(fn); if(ANIM.size === 1) requestAnimationFrame(animLoop); return () => ANIM.delete(fn); }
function animLoop(now){ if(!ANIM.size) return; for(const fn of [...ANIM]) fn(now/1000); requestAnimationFrame(animLoop); }

/* Poses « vivantes » : repos, victoire, défaite */
function idlePose(ex, t){
  const base = POSES[(EX[ex] && EX[ex].idle) || 'stand'];
  return shiftPose(base, 0, Math.sin(t*2.2)*1.2);
}
function victoryPose(t){ return shiftPose(lerpPose(POSES.victory, POSES.stand, (Math.sin(t*10)+1)/6), 0, -Math.abs(Math.sin(t*5))*16); }
function defeatPose(t){ return shiftPose(POSES.defeat, Math.sin(t*20)*.6, Math.sin(t*1.6)*1.5); }

const PACE = [2.3, 1.6, 1.1];        // secondes par répétition (forme 1, 2, 3), avant le facteur d'exercice
const HOLD = [30, 60, 110];          // secondes de gainage du héros selon la forme

function heroPlan(hero, form, exId, goal){
  const L = LOOK[hero], ex = EX[exId], pace = PACE[form]*ex.f*L.spd;
  if(ex.hold) return {hold: HOLD[form]/L.spd*(.88 + Math.random()*.24)};
  const timed = goal[0] === 't', N = +goal.slice(1), ends = []; let acc = 0;
  const count = timed ? Math.ceil(N/pace*1.5) + 5 : N;
  for(let i = 0; i < count; i++){
    const fat = timed ? 1 + .25*Math.pow(acc/N, 2) : 1 + .22*Math.pow(i/N, 2);
    acc += pace*fat*(.88 + Math.random()*.24);
    ends.push(acc);
  }
  return {ends};
}
const heroCountAt = (plan, t) => { let n = 0; while(n < plan.ends.length && plan.ends[n] <= t) n++; return n; };
function heroPoseAt(exId, plan, t, cap){
  const ex = EX[exId], n = heroCountAt(plan, t);
  if(cap && n >= cap) return {pose: victoryPose(t), effort:false, n: cap};
  const st = n ? plan.ends[n-1] : 0, en = plan.ends[n] || st + 1;
  const ph = Math.min(1, (t - st)/(en - st));
  const pose = samplePose(ex.cyc, ph, ex.alt && n % 2 === 1);
  return {pose, effort: Math.sin(ph*Math.PI) > .55, n};
}

/* =========================================================
   CAPTEUR DE MOUVEMENT (téléphone en main ou dans la poche)
   ========================================================= */
async function motionPermission(){
  try{
    if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
      return (await DeviceMotionEvent.requestPermission()) === 'granted';
    }
    return typeof DeviceMotionEvent !== 'undefined';
  }catch(e){ return false; }
}
function startMotion(sens, onRep, onLevel){
  let s = 9.81, base = 9.81, state = 'up', last = 0, got = false;
  const lo = 1.3*sens, hi = 1.7*sens;
  const h = e => {
    const a = e.accelerationIncludingGravity; if(!a || a.x === null) return;
    got = true;
    const m = Math.hypot(a.x, a.y, a.z);
    s = s*.7 + m*.3; base = base*.995 + s*.005;
    const dv = s - base; onLevel && onLevel(dv);
    const now = performance.now();
    if(state === 'up' && dv < -lo) state = 'down';
    else if(state === 'down' && dv > hi && now - last > 450){ state = 'up'; last = now; onRep(); }
  };
  addEventListener('devicemotion', h);
  const chk = setTimeout(() => { if(!got) toast('Aucun capteur détecté : tape l\'écran pour compter.'); }, 2500);
  return () => { removeEventListener('devicemotion', h); clearTimeout(chk); };
}

      <button data-c="tap" aria-pressed="${c.count==='tap'}">👆 Taper l'écran</button>
      <button data-c="motion" aria-pressed="${c.count==='motion'}" ${ex.motion ? '' : 'disabled'}>📳 Capteur de mouvement</button>
    </div>
    <p class="muted hint">${c.count === 'motion' && ex.motion ? 'Tiens le téléphone contre ta poitrine ou mets-le dans ta poche : chaque mouvement est compté (version bêta, tu peux aussi taper l\'écran).' : (ex.tip || 'Tape le gros bouton à chaque répétition, ou fais tenir le téléphone par quelqu\'un qui compte pour toi.')}</p>
    ${c.count === 'motion' && ex.motion ? `<div class="seg" id="dSens">${[[.6,'Sensible'],[1,'Normal'],[1.5,'Ferme']].map(([s,l]) => `<button data-s="${s}" aria-pressed="${s===c.sens}">${l}</button>`).join('')}</div>` : ''}` : ''}
    ${multi ? `
    <h3 class="sub">Joueurs</h3>
    <div id="dPlayers">${c.players.map((p,i) => `<div class="field" style="margin-bottom:8px"><input data-p="${i}" value="${esc(p)}" maxlength="16" aria-label="Joueur ${i+1}">${c.mode === 'tour' && c.players.length > 2 ? `<button class="btn ghost sm" data-rm="${i}" aria-label="Retirer">✕</button>` : ''}</div>`).join('')}</div>
    ${c.mode === 'tour' && c.players.length < 6 ? `<button class="btn ghost sm" id="dAdd">+ Ajouter un joueur</button>` : ''}
    ${c.mode === 'face' ? `<label class="chk"><input type="checkbox" id="dWith" ${c.withHero ? 'checked' : ''}> ${esc(hero.name)} participe aussi (3e concurrent)</label>` : ''}` : ''}
    <button class="btn fightbtn manga" id="dGo">⚔️ COMBAT !</button>
    <div id="dRec"></div>`;

  // aperçu animé
  if(prevStop) prevStop();
  const rig = new Rig(c.hero, c.form); $('#dPrev').appendChild(rig.svg);
  const plan = heroPlan(c.hero, c.form, c.ex, 'r100');
  let t0 = null;
  prevStop = animAdd(t => {
    if(!document.body.contains(rig.svg)){ prevStop(); return; }
    if(t0 === null) t0 = t;
    const tt = (t - t0) % (ex.hold ? 4 : plan.ends[7]);
    if(ex.hold){ rig.pose(idlePose(c.ex, t), true, t); return; }
    const hp = heroPoseAt(c.ex, plan, tt);
    rig.pose(hp.pose, hp.effort, t);
  });

  const hp = $('#dHeroes');
  CHARS.forEach(h => {
    const b = document.createElement('button');
    b.className = 'hchip'; b.setAttribute('aria-pressed', h.id === c.hero); b.style.setProperty('--c', h.c);
    b.appendChild(heroThumb(h.id));
    b.insertAdjacentHTML('beforeend', `<span>${esc(shortName(h))}</span>`);
    b.onclick = () => { c.hero = h.id; save(); renderDuel(); };
    hp.appendChild(b);
  });
  requestAnimationFrame(() => { const sel = hp.querySelector('[aria-pressed="true"]'); if(sel) sel.scrollIntoView({block:'nearest', inline:'center'}); });

  const bind = (sel, attr, key, conv = x => x) => v.querySelectorAll(sel + ' button').forEach(b => b.onclick = () => { c[key] = conv(b.dataset[attr]); save(); renderDuel(); });
  bind('#dMode', 'm', 'mode'); bind('#dForm', 'f', 'form', Number); bind('#dEx', 'x', 'ex'); bind('#dGoal', 'g', 'goal'); bind('#dCount', 'c', 'count'); bind('#dSens', 's', 'sens', Number);
  v.querySelectorAll('[data-p]').forEach(i => i.oninput = () => { c.players[+i.dataset.p] = i.value; save(); });
  v.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { c.players.splice(+b.dataset.rm, 1); save(); renderDuel(); });
  if($('#dAdd')) $('#dAdd').onclick = () => { c.players.push('Joueur ' + (c.players.length+1)); save(); renderDuel(); };
  if($('#dWith')) $('#dWith').onchange = e => { c.withHero = e.target.checked; save(); };
  if(c.mode === 'face') c.players = c.players.slice(0, 2);
  $('#dGo').onclick = async () => {
    const motion = c.mode !== 'face' && c.count === 'motion' && ex.motion && !ex.hold;
    if(motion && !(await motionPermission())){ toast('Capteur refusé : on passe en comptage au doigt.'); c.count = 'tap'; save(); }
    const names = c.players.map((p,i) => p.trim() || 'Joueur '+(i+1));
    if(c.mode === 'solo') fight({...c, player: S.name || 'Toi', count: motion && c.count === 'motion' ? 'motion' : 'tap'});
    else if(c.mode === 'face') faceOff({...c, players: names.slice(0,2)});
    else tourMode({...c, players: names, count: motion && c.count === 'motion' ? 'motion' : 'tap'});
  };

  const rec = S.duels || {};
  const beaten = Object.keys(rec).filter(k => rec[k].w);
  $('#dRec').innerHTML = beaten.length ? `<h3 class="sub">Héros battus</h3><div class="beaten">${beaten.map(k => { const h = charById(k); return `<span class="pill" style="color:${h.c}">${esc(h.name)} ×${rec[k].w}</span>`; }).join('')}</div>` : '';
}

/* =========================================================
   COMBAT — solo et « chacun son tour »
   ========================================================= */
function goalText(c){ const ex = EX[c.ex]; return ex.hold ? 'Le dernier qui tient' : GOALS[c.goal]; }
const fmtT = s => s.toFixed(1).replace('.', ',') + ' s';
function countdown(el, done, names){
  let i = 0;
  const steps = [names, '3', '2', '1', 'FIGHT !'];
  const show = () => {
    el.style.display = 'grid';
    el.innerHTML = `<div class="cdt manga">${steps[i]}</div>`;
    if(i > 0) beep(i === 4 ? 1046 : 520, i === 4 ? .3 : .12, .25);
    i++;
    if(i < steps.length) to = setTimeout(show, i === 1 ? 1300 : 750);
    else to = setTimeout(() => { el.style.display = 'none'; done(); }, 600);
  };
  let to; show();
  onCleanup(() => clearTimeout(to));
}

function fight(c, tour){
  stopRun();
  const ex = EX[c.ex], hero = charById(c.hero), L = lookOf(c.hero, c.form);
  const hold = !!ex.hold, timed = !hold && c.goal[0] === 't', N = hold ? 0 : +c.goal.slice(1);
  const plan = (tour && tour.plan) || heroPlan(c.hero, c.form, c.ex, c.goal);
  const run = $('#run');
  run.style.setProperty('--zc', hero.c);
  run.innerHTML = `
    <div class="fight">
      <div class="ftop">
        <button class="x" id="fx" aria-label="Quitter">✕</button>
        <div class="ft"><b class="manga">${ex.e} ${esc(ex.n)}</b><span>${esc(goalText(c))}${tour ? ' · '+esc(c.player) : ''}</span></div>
        <div class="ftime manga" id="ftime">${timed ? N+' s' : '0,0 s'}</div>
      </div>
      <div class="fstage" id="fst">
        <span class="hn"><b>${esc(hero.name)}</b><small>${esc(L.formName)}</small></span>
        <span class="hcnt manga" id="hcnt">${hold ? '' : '0'}</span>
        <div class="say" id="fsay" hidden></div>
      </div>
      <div class="bars">
        <div class="bar"><span>${esc(shortName(hero))}</span><div class="bt"><i id="hb" style="background:${hero.c}"></i></div></div>
        <div class="bar"><span>${esc(c.player)}</span><div class="bt"><i id="pb" style="background:var(--sage)"></i></div></div>
      </div>
      <div class="pzone" id="pzone">
        ${hold
          ? `<div class="holdt manga" id="pcnt">0,0 s</div><button class="pz drop" id="pz">😵 JE LÂCHE !</button>`
          : `<button class="pz" id="pz"><span class="pc manga" id="pcnt">0</span><span class="pl">${c.count === 'motion' ? '📳 Capteur actif · tu peux aussi taper' : esc(ex.tip ? 'Tape à chaque répétition' : 'Tape à chaque répétition (espace au clavier)')}</span>${c.count === 'motion' ? '<span class="meter"><i id="mtr"></i></span>' : ''}</button>
             <div class="row"><button class="btn ghost sm" id="fm1">−1</button><button class="btn ghost sm" id="fgu">🏳️ Abandonner</button></div>`}
      </div>
      <div class="cd" id="cd"></div>
    </div>`;
  run.classList.add('on');
  document.body.style.overflow = 'hidden';
  keepAwake(true);
  const rig = new Rig(c.hero, c.form);
  $('#fst').appendChild(rig.svg);

  fight.lb = null;
  let phase = 'intro', t0 = 0, pc = 0, hc = 0, end = null, lastSay = 0, heroDoneSaid = false, tEnd = 0;
  const say = (txt, ms = 2200) => { const s = $('#fsay'); if(!s) return; s.textContent = txt; s.hidden = false; clearTimeout(say.t); say.t = setTimeout(() => s.hidden = true, ms); };
  const now = () => performance.now()/1000;

  const stopAnim = animAdd(t => {
    if(phase === 'intro'){ rig.pose(idlePose(c.ex, t), false, t); return; }
    const el = phase === 'live' ? now() - t0 : tEnd;
    if(phase === 'end'){
      const heroWon = end && end.res === 'lose';
      rig.pose(heroWon ? victoryPose(t) : end && end.res === 'draw' ? idlePose(c.ex, t) : defeatPose(t), !heroWon, t);
      return;
    }
    // en direct
    if(hold){
      const holding = el < plan.hold;
      rig.pose(holding ? shiftPose(POSES.plankUp, 0, Math.sin(t*2)*1 + (el > plan.hold*.75 ? Math.sin(t*30)*.8 : 0)) : defeatPose(t), holding && el > plan.hold*.5, t);
      if(!holding && !heroDoneSaid){ heroDoneSaid = true; say(`Je lâche à ${fmtT(plan.hold)}… Tiens bon, tu as gagné si tu tiens encore !`, 3500); beep(300,.3,.2); }
      $('#pcnt').textContent = fmtT(el);
      $('#hb').style.width = Math.min(100, el/plan.hold*100) + '%';
      $('#pb').style.width = Math.min(100, el/plan.hold*100) + '%';
      $('#ftime').textContent = fmtT(el);
      if(el - lastSay > 8 && holding){ lastSay = el; say(pick([...hero.q, 'Je peux tenir des heures !', 'Tu trembles déjà ?'])); }
      return;
    }
    const hp = heroPoseAt(c.ex, plan, el, timed ? 0 : N);
    if(hp.n !== hc){ hc = hp.n; $('#hcnt').textContent = hc; }
    rig.pose(hp.pose, hp.effort, t);
    const goalN = timed ? Math.max(hc, pc, 1)*1.15 : N;
    $('#hb').style.width = Math.min(100, hc/goalN*100) + '%';
    $('#pb').style.width = Math.min(100, pc/goalN*100) + '%';
    if(timed){
      const left = N - el; $('#ftime').textContent = fmtT(Math.max(0, left));
      if(left <= 3 && Math.ceil(left) !== fight.lb){ fight.lb = Math.ceil(left); beep(660,.08,.18); }
      if(left <= 0) finishFight(N);
    } else {
      $('#ftime').textContent = fmtT(el);
      if(hc >= N && !heroDoneSaid){ heroDoneSaid = true; say(`Fini en ${fmtT(plan.ends[N-1])} ! Termine quand même 😎`, 3500); beep(300,.3,.2); }
    }
    if(el - lastSay > 6 && !heroDoneSaid){ lastSay = el; say(pick(hc > pc + 1 ? AHEAD : pc > hc + 1 ? BEHIND : hero.q)); }
  });
  onCleanup(stopAnim);

  function addRep(k = 1){
    if(phase !== 'live' || hold) return;
    pc = Math.max(0, pc + k);
    $('#pcnt').textContent = pc;
    if(k > 0){ beep(620 + Math.min(pc, 50)*8, .05, .14); buzz(20); }
    if(!timed && pc >= N) finishFight(now() - t0);
  }
  function finishFight(el){
    if(phase !== 'live') return;
    phase = 'end'; tEnd = el;
    let res, you, them;
    if(hold){ res = el > plan.hold ? 'win' : 'lose'; you = fmtT(el); them = fmtT(plan.hold); }
    else if(timed){ const hcN = heroCountAt(plan, N); res = pc > hcN ? 'win' : pc === hcN ? 'draw' : 'lose'; you = pc + ' ' + ex.u; them = hcN + ' ' + ex.u; hc = hcN; }
    else if(pc >= N){ const ht = plan.ends[N-1]; res = el < ht ? 'win' : 'lose'; you = fmtT(el); them = fmtT(ht); }
    else { res = 'lose'; you = pc + ' / ' + N + ' (abandon)'; them = fmtT(plan.ends[N-1]); }
    end = {res, you, them, reps: hold ? Math.round(el) : pc, time: el, gaveUp: !hold && !timed && pc < N};
    if(res === 'win') fanfare(); else if(res === 'lose') beep(200, .5, .2);
    buzz(res === 'win' ? [80,50,160] : 300);
    const xp = tour ? 0 : duelReward(c, end);
    const T = {win:'VICTOIRE !', lose:'DÉFAITE…', draw:'ÉGALITÉ !'}[res];
    const line = res === 'win' ? pick(['Impossible… tu es plus fort que moi !', 'Bien joué. La prochaine fois, je ne te ferai pas de cadeau.', 'Tu as dépassé tes limites !']) : res === 'lose' ? pick(hold ? ['Déjà ? Je tenais encore facilement !', 'Ton gainage manque de chakra…', 'Reviens quand tu tiendras plus longtemps !'] : ['Reviens quand tu seras prêt !', 'Pas assez rapide ! Entraîne-toi encore.', 'Je suis trop fort pour toi… pour l\'instant.']) : 'On remet ça ?';
    say(line, 60000);
    $('#pzone').innerHTML = `
      <div class="endp">
        <div class="et manga ${res}">${T}</div>
        <div class="er"><div><span>${esc(c.player)}</span><b>${esc(you)}</b></div><div><span>${esc(hero.name)}</span><b>${esc(them)}</b></div></div>
        ${xp ? `<div class="exp manga">+${xp.gain} XP</div>${xp.lvl ? `<div class="lvlup">⬆️ Niveau ${xp.lvl} : ${titleOf(xp.lvl)} !</div>` : ''}${xp.badges.map(b => `<div class="nbg">🏆 ${b.e} ${esc(b.n)}</div>`).join('')}` : ''}
        <div class="row">${tour ? `<button class="btn" id="eNext">${tour.last ? '🏆 Voir le classement' : '➡️ Joueur suivant'}</button>` : `<button class="btn" id="eRe">🔁 Revanche</button><button class="btn ghost" id="eBack">Changer</button>`}</div>
      </div>`;
    if(res === 'win') confetti();
    if(tour) $('#eNext').onclick = () => tour.next(end);
    else { $('#eRe').onclick = () => fight(c); $('#eBack').onclick = () => { stopRun(); renderAll(); }; }
    renderHeader();
  }

  $('#fx').onclick = () => { stopRun(); renderAll(); };
  const pz = $('#pz');
  if(hold) pz.onclick = () => { if(phase === 'live') finishFight(now() - t0); };
  else {
    pz.addEventListener('pointerdown', e => { e.preventDefault(); addRep(1); });
    $('#fm1').onclick = () => addRep(-1);
    $('#fgu').onclick = () => { if(phase === 'live') finishFight(now() - t0); };
  }
  const key = e => { if(e.code === 'Space' && !e.target.closest('input')){ e.preventDefault(); if(hold){ if(phase === 'live') finishFight(now() - t0); } else addRep(1); } };
  addEventListener('keydown', key); onCleanup(() => removeEventListener('keydown', key));

  countdown($('#cd'), () => {
    phase = 'live'; t0 = now();
    if(c.count === 'motion' && !hold){
      const stopM = startMotion(c.sens || 1, () => addRep(1), dv => { const m = $('#mtr'); if(m) m.style.width = Math.min(100, Math.abs(dv)*25) + '%'; });
      onCleanup(stopM);
    }
  }, `<span class="vsn">${esc(c.player)}</span><span class="vsx">VS</span><span class="vsn" style="color:${hero.c}">${esc(hero.name)}</span>`);
}

function duelReward(c, end){
  const ex = EX[c.ex], mult = [.7, 1, 1.6][c.form];
  const score = ex.hold ? end.time/2 : end.reps*1.5;
  let gain = Math.round((20 + score)*mult);
  if(end.res !== 'win') gain = Math.round(gain*.35);
  if(end.gaveUp) gain = Math.round(end.reps);
  const before = levelOf(S.xp);
  S.xp += gain;
  S.stats[ex.stat] = (S.stats[ex.stat] || 0) + (ex.hold ? Math.round(end.time) : end.reps);
  if(!S.days.includes(today())) S.days.push(today());
  S.duels = S.duels || {};
  const r = S.duels[c.hero] = S.duels[c.hero] || {w:0, l:0, top:-1};
  if(end.res === 'win'){ r.w++; r.top = Math.max(r.top, c.form); } else if(end.res === 'lose') r.l++;
  S.duelLog = (S.duelLog || []).concat({h:c.hero, x:c.ex, f:c.form, r:end.res, day:today(), xp:gain}).slice(-200);
  const badges = checkBadges();
  save();
  const after = levelOf(S.xp);
  return {gain, lvl: after > before ? after : 0, badges};
}

/* ---- Chacun son tour ---- */
function tourMode(c){
  const plan = heroPlan(c.hero, c.form, c.ex, c.goal), res = [];
  const ex = EX[c.ex], hero = charById(c.hero);
  const step = i => {
    if(i >= c.players.length) return tourResults(c, plan, res);
    stopRun();
    const run = $('#run');
    run.style.setProperty('--zc', hero.c);
    run.innerHTML = `<div class="fight"><div class="ftop"><button class="x" id="fx" aria-label="Quitter">✕</button><div class="ft"><b class="manga">Chacun son tour</b><span>${ex.e} ${esc(ex.n)} · ${esc(goalText(c))}</span></div></div>
      <div class="turn"><div class="tn manga">Au tour de</div><div class="tp manga">${esc(c.players[i])}</div><p class="muted">Joueur ${i+1} sur ${c.players.length} · passe-lui le téléphone !</p><button class="btn fightbtn manga" id="tgo">Je suis prêt !</button></div></div>`;
    run.classList.add('on'); document.body.style.overflow = 'hidden';
    $('#fx').onclick = () => { stopRun(); renderAll(); };
    $('#tgo').onclick = () => fight({...c, player: c.players[i]}, {plan, last: i === c.players.length-1, next: r => { res.push({name: c.players[i], ...r}); step(i+1); }});
  };
  step(0);
}
function rankRows(c, plan, rows){
  const ex = EX[c.ex], timed = !ex.hold && c.goal[0] === 't', N = ex.hold ? 0 : +c.goal.slice(1);
  const hero = charById(c.hero);
  const all = rows.map(r => ({name:r.name, score: ex.hold ? r.time : timed ? r.reps : (r.gaveUp ? 1e6 - r.reps : r.time), label: r.you}));
  all.push({name: hero.name, hero: true, score: ex.hold ? plan.hold : timed ? heroCountAt(plan, N) : plan.ends[N-1],
    label: ex.hold ? fmtT(plan.hold) : timed ? heroCountAt(plan, N) + ' ' + ex.u : fmtT(plan.ends[N-1])});
  const desc = ex.hold || timed;
  all.sort((a,b) => desc ? b.score - a.score : a.score - b.score);
  return all;
}
function tourResults(c, plan, rows){
  stopRun();
  const hero = charById(c.hero), all = rankRows(c, plan, rows);
  S.xp += 15; S.multi = (S.multi || 0) + 1;
  if(!S.days.includes(today())) S.days.push(today());
  const badges = checkBadges(); save();
  const run = $('#run');
  run.innerHTML = `<div class="fight"><div class="ftop"><button class="x" id="fx" aria-label="Quitter">✕</button><div class="ft"><b class="manga">Classement</b><span>${EX[c.ex].e} ${esc(EX[c.ex].n)} · ${esc(goalText(c))}</span></div></div>
    <div class="podium">${all.map((r,i) => `<div class="pr ${r.hero ? 'ph' : ''}"><span class="pn manga">${['🥇','🥈','🥉'][i] || (i+1)+'.'}</span><span class="pname">${esc(r.name)}${r.hero ? ' <small>(héros)</small>' : ''}</span><b>${esc(r.label)}</b></div>`).join('')}</div>
    <p class="muted" style="text-align:center;margin-top:12px">+15 XP pour la partie${badges.map(b => ' · 🏆 '+b.e+' '+esc(b.n)).join('')}</p>
    <div class="row" style="margin-top:14px"><button class="btn" id="tre">🔁 Rejouer</button><button class="btn ghost" id="tbk">Retour</button></div></div>`;
  run.classList.add('on');
  confetti();
  $('#fx').onclick = $('#tbk').onclick = () => { stopRun(); renderAll(); };
  $('#tre').onclick = () => tourMode(c);
  renderHeader();
}

/* =========================================================
   FACE À FACE — 2 joueurs sur le même écran (+ le héros)
   ========================================================= */
function faceOff(c){
  stopRun();
  const ex = EX[c.ex], hero = charById(c.hero), hold = !!ex.hold, timed = !hold && c.goal[0] === 't', N = hold ? 0 : +c.goal.slice(1);
  const plan = heroPlan(c.hero, c.form, c.ex, c.goal);
  const P = c.players.map(n => ({name:n, n:0, done:null}));
  const run = $('#run');
  run.style.setProperty('--zc', hero.c);
  const half = i => `
    <div class="half ${i === 0 ? 'flip' : ''}" id="h${i}">
      <div class="hhd"><b class="manga">${esc(P[i].name)}</b><span class="manga hcount" id="c${i}">${hold ? '0,0 s' : 0}</span></div>
      <button class="hz ${hold ? 'drop' : ''}" id="z${i}">${hold ? '😵 JE LÂCHE !' : 'TAPE ICI'}</button>
      <div class="hmsg manga" id="m${i}"></div>
    </div>`;
  run.innerHTML = `
    <div class="fo">
      ${half(0)}
      <div class="mid">
        <button class="x" id="fx" aria-label="Quitter">✕</button>
        <div class="mt"><b class="manga" id="ftime">${timed ? N+' s' : '0,0 s'}</b><span>${ex.e} ${esc(ex.n)} · ${esc(goalText(c))}</span></div>
        <button class="btn ghost sm" id="fend">Terminer</button>
        ${c.withHero ? `<div class="mh"><div id="mrig"></div><span class="manga" id="hcnt">${hold ? '' : 0}</span></div>` : ''}
      </div>
      ${half(1)}
      <div class="cd" id="cd"></div>
    </div>`;
  run.classList.add('on'); document.body.style.overflow = 'hidden'; keepAwake(true);
  let rig = null;
  if(c.withHero){ rig = new Rig(c.hero, c.form, {view:'0 0 220 210'}); $('#mrig').appendChild(rig.svg); }
  let phase = 'intro', t0 = 0, tEnd = 0;
  const now = () => performance.now()/1000;
  const heroDone = () => hold ? plan.hold : timed ? null : plan.ends[N-1];

  const stopAnim = animAdd(t => {
    const el = phase === 'live' ? now() - t0 : tEnd;
    if(rig){
      if(phase === 'intro') rig.pose(idlePose(c.ex, t), false, t);
      else if(hold) rig.pose(el < plan.hold ? shiftPose(POSES.plankUp, 0, Math.sin(t*2)) : defeatPose(t), el > plan.hold*.5 && el < plan.hold, t);
      else { const hp = heroPoseAt(c.ex, plan, el, timed ? 0 : N); rig.pose(hp.pose, hp.effort, t); $('#hcnt').textContent = hp.n; }
    }
    if(phase !== 'live') return;
    if(timed){ const left = N - el; $('#ftime').textContent = fmtT(Math.max(0,left)); if(left <= 0) endFO(N); }
    else $('#ftime').textContent = fmtT(el);
    if(hold) P.forEach((p,i) => { if(p.done === null) $('#c'+i).textContent = fmtT(el); });
  });
  onCleanup(stopAnim);

  const tap = i => e => {
    e.preventDefault();
    if(phase !== 'live') return;
    const p = P[i], el = now() - t0;
    if(p.done !== null) return;
    if(hold){ p.done = el; $('#c'+i).textContent = fmtT(el); $('#m'+i).textContent = 'Tenu ' + fmtT(el); beep(300,.2,.2); }
    else {
      p.n++; $('#c'+i).textContent = p.n; beep(i ? 700 : 520, .05, .14); buzz(15);
      if(!timed && p.n >= N){ p.done = el; $('#m'+i).textContent = 'Fini en ' + fmtT(el) + ' !'; fanfare(); }
    }
    if(P.every(q => q.done !== null)) endFO(el);
  };
  [0,1].forEach(i => $('#z'+i).addEventListener('pointerdown', tap(i)));
  $('#fx').onclick = () => { stopRun(); renderAll(); };
  $('#fend').onclick = () => endFO(now() - t0);

  function endFO(el){
    if(phase !== 'live') return;
    phase = 'end'; tEnd = el;
    const rows = P.map(p => ({name:p.name, time: p.done ?? el, reps: p.n, gaveUp: !hold && !timed && p.done === null,
      you: hold ? fmtT(p.done ?? el) : timed ? p.n + ' ' + ex.u : p.done !== null ? fmtT(p.done) : p.n + '/' + N}));
    let all = rankRows(c, plan, rows);
    if(!c.withHero) all = all.filter(r => !r.hero);
    P.forEach((p,i) => {
      const rk = all.findIndex(r => !r.hero && r.name === p.name && r.label === rows[i].you);
      $('#m'+i).innerHTML = `${rk === 0 ? '🏆 GAGNÉ !' : (rk+1) + 'e place'}<small>${all.map((r,j) => `${j+1}. ${esc(r.name)} — ${esc(r.label)}`).join('<br>')}</small>`;
      $('#z'+i).disabled = true;
    });
    $('#fend').remove();
    const mid = run.querySelector('.mid .mt');
    mid.insertAdjacentHTML('beforeend', `<div class="row" style="margin-top:6px"><button class="btn sm" id="fre">🔁 Revanche</button></div>`);
    $('#fre').onclick = () => faceOff(c);
    S.xp += 10; S.multi = (S.multi || 0) + 1; if(!S.days.includes(today())) S.days.push(today());
    checkBadges(); save(); renderHeader();
    fanfare(); confetti();
  }

  countdown($('#cd'), () => { phase = 'live'; t0 = now(); }, `<span class="vsn">${esc(P[0].name)}</span><span class="vsx">VS</span><span class="vsn">${esc(P[1].name)}</span>${c.withHero ? `<span class="vsx">+</span><span class="vsn" style="color:${hero.c}">${esc(hero.name)}</span>` : ''}`);
}

/* =========================================================
   HÉROS — galerie + image personnalisée
   ========================================================= */
function renderHeroes(){
  const box = $('#chars');
  box.innerHTML = '';
  CHARS.forEach(h => {
    const L = LOOK[h.id], rec = (S.duels || {})[h.id];
    const card = document.createElement('div');
    card.className = 'cc'; card.setAttribute('aria-pressed', h.id === S.char);
    const fig = document.createElement('div'); fig.className = 'ccfig'; fig.style.setProperty('--c', h.c);
    const rig = new Rig(h.id, 0); rig.pose(POSES.stand); fig.appendChild(rig.svg);
    card.appendChild(fig);
    card.insertAdjacentHTML('beforeend', `
      <span class="n">${esc(h.name)}</span>
      <span class="s">${esc(h.from)}</span>
      <span class="b">Coach : +25 % XP · ${esc(zoneById(h.zone).name)}</span>
      ${rec ? `<span class="s">⚔️ ${rec.w} victoire(s) · ${rec.l} défaite(s)</span>` : ''}
      <div class="row" style="gap:6px">
        <button class="btn sm" data-duel="${h.id}">⚔️ Défier</button>
        <button class="btn ghost sm" data-coach="${h.id}">${h.id === S.char ? '✓ Coach' : 'Coach'}</button>
        <button class="btn ghost sm" data-img="${h.id}" aria-label="Image de ${esc(h.name)}">📷</button>
      </div>`);
    box.appendChild(card);
    // petite animation au survol / toucher
    let stop = null;
    fig.onpointerenter = () => { if(stop) return; const t0 = performance.now()/1000; stop = animAdd(t => { const tt = t - t0; if(tt > 2.4 || !document.body.contains(fig)){ rig.pose(POSES.stand); stop(); stop = null; return; } rig.pose(victoryPose(tt), false, tt); }); };
  });
  box.querySelectorAll('[data-coach]').forEach(b => b.onclick = () => {
    S.char = b.dataset.coach; save(); renderAll();
    const c = charById(S.char); toast(`${c.name} : « ${pick(c.q)} »`);
  });
  box.querySelectorAll('[data-duel]').forEach(b => b.onclick = () => { dcfg().hero = b.dataset.duel; save(); go('duel'); });
  box.querySelectorAll('[data-img]').forEach(b => b.onclick = () => imageSheet(b.dataset.img));
}
function imageSheet(id){
  const h = charById(id), cur = S.img && S.img[id];
  $('#sheet').innerHTML = `
    <div class="sheet-hd"><div><div class="zt" style="color:${h.c}">Image de ${esc(h.name)}</div>
    <p>Choisis une photo de ton téléphone ou colle le lien d'une image. Elle devient la tête du héros animé et son portrait partout dans le jeu. Elle reste sur ton appareil.</p></div>
    <button class="x" data-close aria-label="Fermer">✕</button></div>
    ${cur ? `<div style="text-align:center;margin-bottom:12px"><img src="${esc(cur)}" alt="" style="width:110px;height:110px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px ${h.c}"></div>` : ''}
    <label class="btn" style="width:100%;margin-bottom:10px">🖼️ Choisir une image<input type="file" accept="image/*" id="imgFile" hidden></label>
    <div class="field"><input id="imgUrl" type="url" placeholder="https://… lien d'une image" aria-label="Lien d'image"><button class="btn sm" id="imgOk">OK</button></div>
    ${cur ? `<button class="btn ghost sm" id="imgDel" style="margin-top:12px">Retirer l'image</button>` : ''}`;
  openSheet();
  $('#sheet').querySelector('[data-close]').onclick = closeSheet;
  const setImg = src => { S.img = S.img || {}; S.img[id] = src; save(); closeSheet(); renderAll(); toast('Image enregistrée pour ' + h.name); };
  $('#imgFile').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const im = new Image();
      im.onload = () => {
        const cv = document.createElement('canvas'), sz = 256; cv.width = cv.height = sz;
        const s = Math.min(im.width, im.height);
        cv.getContext('2d').drawImage(im, (im.width-s)/2, (im.height-s)/2, s, s, 0, 0, sz, sz);
        setImg(cv.toDataURL('image/jpeg', .85));
      };
      im.onerror = () => toast('Image illisible');
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  };
  $('#imgOk').onclick = () => {
    const u = $('#imgUrl').value.trim();
    if(!/^https?:\/\//i.test(u)){ toast('Colle un lien qui commence par https://'); return; }
    const im = new Image();
    im.onload = () => setImg(u);
    im.onerror = () => toast('Impossible de charger cette image');
    im.src = u;
  };
  if($('#imgDel')) $('#imgDel').onclick = () => { delete S.img[id]; save(); closeSheet(); renderAll(); };
}
