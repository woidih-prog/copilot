<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Frigo Énergie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F0; --surface:#FFFFFF; --surface2:#F3ECE1; --line:#E9E0D2;
  --ink:#2A211B; --muted:#7D7065; --accent:#C2552D; --accent-ink:#FFFFFF;
  --herb:#3F7D4E; --gold:#C9962B; --red:#C4473A; --shadow:0 10px 30px rgba(74,48,26,.10);
  --radius:20px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171310; --surface:#211B17; --surface2:#2B241E; --line:#3A3129;
    --ink:#F2EAE0; --muted:#A99C8E; --accent:#E9794F; --accent-ink:#1A0E08;
    --herb:#7CC08D; --gold:#E3B655; --red:#E5776A; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-bottom:calc(78px + env(safe-area-inset-bottom));line-height:1.45}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font-family:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.serif{font-family:'Fraunces',Georgia,serif}
h1.title{font-family:'Fraunces',Georgia,serif;font-size:32px;line-height:1.08;letter-spacing:-.01em;margin:4px 0 6px}
h2.sec{font-family:'Fraunces',Georgia,serif;font-size:27px;line-height:1.12;margin:6px 0 6px}
h3.sub{font-family:'Fraunces',Georgia,serif;font-size:20px;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
h3.sub small{font-family:'Inter';font-size:12.5px;color:var(--muted);font-weight:500}
.lead{color:var(--muted);font-size:15px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:99px;font-weight:600;font-size:14.5px;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:8px 13px;font-size:13px}
.btn.wide{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;line-height:1.2;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .s{font-size:10px;color:var(--herb);font-weight:700;margin-left:4px;text-transform:uppercase;letter-spacing:.04em}
.chip[aria-pressed="true"] .s{color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--herb) 16%,var(--surface));color:var(--herb)}
.pill.part{background:color-mix(in srgb,var(--gold) 18%,var(--surface));color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.disc{font-size:12px;color:var(--muted);margin-top:24px;line-height:1.55}
.empty{padding:18px;border-radius:16px;border:1px dashed var(--line);color:var(--muted);font-size:14px;text-align:center}

/* Header & nav */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0}
.logo{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:700;flex:1;letter-spacing:-.01em}
.logo span{color:var(--accent)}
.season{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.me{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:18px;display:grid;place-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);position:relative;text-align:center}
nav.tabs button b{font-size:20px;line-height:1.2;filter:grayscale(.9);opacity:.65}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs button[aria-current="page"] b{filter:none;opacity:1}
nav.tabs .badge{position:absolute;top:3px;left:calc(50% + 8px);background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px}
section.view{display:none;padding:10px 0 28px}
section.view.on{display:block}

/* Photo / illustration de plat */
.ph{position:relative;overflow:hidden;background:var(--pbg,#E9C9A6)}
.ph .plate{position:absolute;left:50%;top:50%;width:74%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#fff 0 56%,#f3eee7 57% 63%,#fff 64% 70%,#e8e1d6 71%);
  box-shadow:0 18px 30px rgba(60,35,15,.28),0 2px 4px rgba(60,35,15,.15)}
.ph .dish{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:var(--ds,64px);line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.ph .side{position:absolute;font-size:var(--ss,26px);line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
.ph .napkin{position:absolute;width:38%;height:22%;right:-6%;bottom:6%;background:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 6px,transparent 6px 12px);transform:rotate(-14deg);border-radius:6px}
.ph .herb{position:absolute;font-size:calc(var(--ss,26px)*.9);opacity:.9}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .cred{position:absolute;right:6px;bottom:6px;font-size:9.5px;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Accueil */
.hello{margin-top:4px}
.hello .k{font-size:13px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.1em}
.days{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 6px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:128px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.day i{font-style:normal;font-size:28px;line-height:1}
.day b{font-size:13.5px;line-height:1.2}
.day small{font-size:11.5px;color:var(--muted);line-height:1.25}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-pressed="true"] small{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.fridge{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);width:100%}
.fridge .ic{width:46px;height:46px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:24px;flex:none}
.fridge .t{flex:1;min-width:0;font-size:14px}
.fridge .t b{display:block;font-size:15px}
.fridge .t span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fridge .go{color:var(--accent);font-weight:700;font-size:14px}
.focus{margin-top:14px;padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--herb) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--herb) 25%,var(--line))}
.focus summary{cursor:pointer;font-weight:600;font-size:14.5px;list-style:none;display:flex;gap:8px;align-items:center}
.focus summary::-webkit-details-marker{display:none}
.focus summary::after{content:"›";margin-left:auto;color:var(--muted);transition:transform .2s}
.focus[open] summary::after{transform:rotate(90deg)}
.focus ul{padding-left:18px;font-size:13.5px;margin-top:10px}
.focus li{margin:4px 0}
.settings{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* Carte repas (accueil) */
.meal{margin-top:16px;border-radius:24px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
.meal .ph{aspect-ratio:16/10;--ds:86px;--ss:34px;cursor:pointer}
.meal .mom{position:absolute;left:12px;top:12px;z-index:2;background:rgba(255,255,255,.92);color:#2A211B;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em}
.meal .favb{position:absolute;right:12px;top:12px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);color:#2A211B;font-size:18px;display:grid;place-items:center}
.meal .favb[aria-pressed="true"]{color:#D23B3B}
.meal .bd{padding:14px 16px 16px}
.meal .nm{font-family:'Fraunces',Georgia,serif;font-size:23px;line-height:1.15;cursor:pointer}
.meal .meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.meal .why{font-size:13.5px;color:var(--muted)}
.meal .miss{font-size:13px;margin-top:8px}
.meal .miss b{color:var(--accent)}
.meal .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* Grille recettes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:12px}
.rc{border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(74,48,26,.06)}
.rc .ph{aspect-ratio:1/1;--ds:56px;--ss:22px}
.rc .b{padding:10px 11px 12px}
.rc .b b{display:block;font-family:'Fraunces',Georgia,serif;font-size:15.5px;line-height:1.2}
.rc .b span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.rc .tag{position:absolute;left:8px;top:8px;z-index:2;background:rgba(255,255,255,.92);color:#2A211B;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.search{width:100%;padding:13px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px}
.sticky{position:sticky;top:58px;z-index:5;background:var(--bg);padding:8px 0}

/* Détail recette */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(20,12,6,.5);display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{width:100%;max-width:820px;max-height:94vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;animation:up .22s ease-out;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.detail .ph{aspect-ratio:4/3;--ds:120px;--ss:44px}
.detail .close{position:absolute;right:14px;top:14px;z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);color:#2A211B;font-size:18px;display:grid;place-items:center}
.detail .favb{position:absolute;right:62px;top:14px;z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);color:#2A211B;font-size:18px;display:grid;place-items:center}
.detail .favb[aria-pressed="true"]{color:#D23B3B}
.detail .bd{padding:18px 18px 0;margin-top:-24px;position:relative;background:var(--bg);border-radius:24px 24px 0 0}
.detail h2{font-family:'Fraunces',Georgia,serif;font-size:28px;line-height:1.1}
.detail .meta{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.detail .why{padding:14px;border-radius:16px;background:color-mix(in srgb,var(--herb) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--herb) 22%,var(--line));font-size:14px}
.detail .why b{display:block;margin-bottom:4px}
.detail h4{font-family:'Fraunces',Georgia,serif;font-size:20px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.detail h4 small{font-family:'Inter';font-size:12.5px;color:var(--muted);font-weight:500}
.irow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.irow .ie{font-size:22px;width:30px;text-align:center}
.irow .in{flex:1;min-width:0}
.irow .in small{display:block;color:var(--muted);font-size:12px}
.irow .st{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.irow .st.y{background:color-mix(in srgb,var(--herb) 16%,var(--surface));color:var(--herb)}
.irow .st.n{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.irow .st.o{background:var(--surface2);color:var(--muted)}
.steps{list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;padding:10px 0;font-size:15px}
.steps li::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:'Fraunces',Georgia,serif}
.detail .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

/* Frigo */
.ingcat{margin-top:18px}
.ingcat h4{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:center}

/* Courses */
.shop{display:flex;flex-direction:column;gap:6px}
.si{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.si input{width:20px;height:20px;accent-color:var(--accent)}
.si.done .t{text-decoration:line-through;color:var(--muted)}
.si .t{flex:1}
.si .from{display:block;font-size:12px;color:var(--muted)}
.si button{color:var(--muted);font-size:16px;width:28px;height:28px;border-radius:50%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}

/* Saison */
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.gcard h5{font-size:15px;margin-bottom:4px}
.gcard p{font-size:13px;color:var(--muted)}
.prod{display:flex;flex-wrap:wrap;gap:8px}
.prod span{padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}

/* Profil */
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 8px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:42px;height:42px;border-radius:50%;background:var(--surface2);font-size:20px;font-weight:700;text-align:center}
.stepper b{min-width:30px;text-align:center;font-size:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap hd">
  <div class="logo">Frigo <span>Énergie</span></div>
  <div class="season" id="hSeason"></div>
  <button class="me" id="hMe" aria-label="Mes réglages">⚙️</button>
</div></header>

<main class="wrap">
  <section class="view on" id="v-plan"></section>
  <section class="view" id="v-frigo"></section>
  <section class="view" id="v-rec"></section>
  <section class="view" id="v-shop"></section>
  <section class="view" id="v-season"></section>
</main>

<nav class="tabs" aria-label="Navigation"><div class="wrap">
  <button data-v="plan" aria-current="page"><b>🍽️</b>Ma journée</button>
  <button data-v="frigo"><b>🧊</b>Mon frigo</button>
  <button data-v="rec"><b>📖</b>Recettes</button>
  <button data-v="shop"><b>🛒</b>Courses<span class="badge" id="shopBadge" hidden></span></button>
  <button data-v="season"><b>🌱</b>Saison</button>
</div></nav>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* =========================================================
   INGRÉDIENTS
   mois de saison (France métropolitaine) ; flags : M viande, F poisson, E œuf, D laitier, G gluten, P porc, H miel
   ========================================================= */
const R = (a, b) => { const o = []; let m = a; for(;;){ o.push(m); if(m === b) break; m = m % 12 + 1; } return o; };
const CATS_ING = {leg:'🥕 Légumes', fruit:'🍎 Fruits', prot:'🍗 Viandes, poissons, tofu', lait:'🥚 Œufs & laitiers', fec:'🍞 Féculents & céréales', legu:'🫘 Légumineuses', ole:'🌰 Oléagineux & graines', plac:'🫙 Placard'};
const ING = [
  // légumes
  ['carotte','Carottes','leg',null],['poireau','Poireaux','leg',R(9,4)],['chou','Chou','leg',R(10,3)],['choufleur','Chou-fleur','leg',R(9,4)],
  ['brocoli','Brocoli','leg',R(6,11)],['courge','Courge / potiron','leg',R(9,2)],['epinard','Épinards','leg',[3,4,5,6,9,10,11]],['salade','Salade verte','leg',R(4,11)],
  ['tomate','Tomates','leg',R(6,9)],['courgette','Courgettes','leg',R(6,9)],['poivron','Poivrons','leg',R(7,9)],['concombre','Concombre','leg',R(5,9)],
  ['aubergine','Aubergine','leg',R(7,9)],['haricotvert','Haricots verts','leg',R(6,9)],['betterave','Betterave cuite','leg',null],['navet','Navets','leg',R(10,3)],
  ['patatedouce','Patate douce','leg',R(10,3)],['champignon','Champignons','leg',null],['oignon','Oignon','leg',null],['ail','Ail','leg',null],
  ['radis','Radis','leg',R(3,6)],['petitpois','Petits pois (frais/surgelés)','leg',null],['endive','Endives','leg',R(10,4)],['avocat','Avocat','leg',R(11,4)],
  ['legsurg','Légumes surgelés','leg',null],
  // fruits
  ['pomme','Pommes','fruit',R(8,4)],['poire','Poires','fruit',R(8,3)],['banane','Bananes','fruit',null],['orange','Oranges','fruit',R(11,4)],
  ['clementine','Clémentines','fruit',R(11,2)],['kiwi','Kiwis','fruit',R(11,4)],['citron','Citron','fruit',null],['fraise','Fraises','fruit',R(4,6)],
  ['fruitsrouges','Fruits rouges (frais/surgelés)','fruit',null],['abricot','Abricots','fruit',R(6,8)],['peche','Pêches','fruit',R(6,9)],['melon','Melon','fruit',R(6,9)],
  ['raisin','Raisin','fruit',R(8,10)],['dattes','Dattes / fruits secs','fruit',null],['figue','Figues','fruit',R(8,10)],['prune','Prunes','fruit',R(7,9)],['cerise','Cerises','fruit',R(5,7)],
  // protéines
  ['poulet','Poulet','prot',null,'M'],['dinde','Dinde','prot',null,'M'],['boeuf','Bœuf haché','prot',null,'M'],['jambon','Jambon','prot',null,'MP'],
  ['lardons','Lardons','prot',null,'MP'],['poisson','Poisson blanc','prot',null,'F'],['saumon','Saumon','prot',null,'F'],['sardines','Sardines en boîte','prot',null,'F'],
  ['maquereau','Maquereau en boîte','prot',null,'F'],['thon','Thon en boîte','prot',null,'F'],['tofu','Tofu','prot',null],
  // œufs & laitiers
  ['oeufs','Œufs','lait',null,'E'],['lait','Lait','lait',null,'D'],['laitveg','Boisson végétale','lait',null],['yaourt','Yaourt nature','lait',null,'D'],
  ['fromageblanc','Fromage blanc','lait',null,'D'],['fromage','Fromage (râpé, emmental…)','lait',null,'D'],['feta','Feta','lait',null,'D'],

const KEY = 'frigo-energie-v1';
const DEF = {fridge:[], days:['travail'], moments:['pdj','dej','col','din'], age:'adulte', persons:1, budget:3, time:30, diet:[], favs:[], shop:[], seasonOverride:null, skip:{}};
let S = load();
function load(){ try{ const r = localStorage.getItem(KEY); if(r) return Object.assign({}, DEF, JSON.parse(r)); }catch(e){} return JSON.parse(JSON.stringify(DEF)); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const month = () => new Date().getMonth() + 1;
const season = () => S.seasonOverride || seasonOf(month());
const inSeason = k => { const i = INGM[k]; return !i.m || i.m.includes(month()); };
const isFreshSeasonal = k => INGM[k] && INGM[k].m && INGM[k].m.includes(month());
const have = k => S.fridge.includes(k);
const ageOf = () => AGES.find(a => a.id === S.age) || AGES[2];
const euro = v => v.toFixed(2).replace('.', ',') + ' €';

/* Régimes */
const DIETS = [
  {id:'vege', n:'Végétarien', bad:'MFP'},
  {id:'vegan', n:'Végétalien', bad:'MFPEDH'},
  {id:'pesc', n:'Pescétarien', bad:'MP'},
  {id:'sansporc', n:'Sans porc', bad:'P'},
  {id:'sansgluten', n:'Sans gluten', bad:'G'},
  {id:'sanslactose', n:'Sans lactose', bad:'D'},
];
const badFlags = () => S.diet.map(d => DIETS.find(x => x.id === d).bad).join('');
const ok = k => { const b = badFlags(); return ![...INGM[k].f].some(f => b.includes(f)); };

/* =========================================================
   MOTEUR DE SUGGESTION
   ========================================================= */
function analyse(r){
  const slots = r.r.map(alts => {
    const allowed = alts.filter(ok);
    if(!allowed.length) return null;
    const got = allowed.find(have);
    const pickSeasonal = allowed.find(k => isFreshSeasonal(k)) || allowed[0];
    return {alts: allowed, use: got || pickSeasonal, have: !!got};
  });
  if(slots.some(s => s === null)) return null;               // incompatible avec le régime
  const opts = r.o.filter(ok);
  const haveN = slots.filter(s => s.have).length;
  return {slots, opts, haveN, total: slots.length, missing: slots.filter(s => !s.have).map(s => s.use)};
}
function goalWeights(){
  const w = {};
  S.days.forEach(id => { const d = DAYS.find(x => x.id === id); if(d) for(const [g,v] of Object.entries(d.w)) w[g] = (w[g] || 0) + v; });
  return w;
}
function score(r, a, w, moment){
  const sea = season();
  const ratio = a.haveN / a.total;
  let s = ratio*60;
  if(a.missing.length === 0) s += 15;
  const maxW = Math.max(1, ...Object.values(w));
  s += r.g.reduce((acc, g) => acc + (w[g] || 0), 0) / maxW * 6;
  if(r.s.includes('all') || r.s.includes(sea)) s += 10; else s -= 18;
  s += a.slots.filter(x => isFreshSeasonal(x.use)).length*2;
  if(r.t <= S.time) s += 6; else s -= (r.t - S.time)/3;
  if(r.c <= S.budget) s += 5; else s -= (r.c - S.budget)*4;
  if(moment === 'dej' && S.days.some(id => DAYS.find(d => d.id === id)?.box) && r.box) s += 6;
  if(r.m[0] === moment) s += 3;
  s += Math.min(4, a.opts.filter(have).length);
  return s;
}
function suggestions(moment){
  const w = goalWeights();
  return RECIPES.filter(r => r.m.includes(moment))
    .map(r => { const a = analyse(r); return a && {r, a, s: score(r, a, w, moment)}; })
    .filter(Boolean)
    .sort((x, y) => y.s - x.s);
}

function renderMeals(){
  const box = $('#pMeals'); if(!box) return;
  const used = new Set();
  box.innerHTML = '';
  for(const m of MOMENTS.filter(x => S.moments.includes(x.id))){
    const list = suggestions(m.id).filter(x => !used.has(x.r.id));
    if(!list.length){ box.insertAdjacentHTML('beforeend', `<div class="meal"><div class="bd"><b>${m.e} ${m.n}</b><div class="empty" style="margin-top:10px">Aucune recette compatible avec tes réglages. Assouplis le régime, le temps ou le budget.</div></div></div>`); continue; }
    const idx = (S.skip[m.id] || 0) % list.length;
    const it = list[idx]; used.add(it.r.id);
    box.insertAdjacentHTML('beforeend', mealCard(it, m, idx, list.length));
  }
  bindCards(box);
}
function costOf(r){ return r.c * S.persons * ageOf().f; }
function mealCard({r, a}, m, idx, n){
  const fav = S.favs.includes(r.id), pct = Math.round(a.haveN / a.total * 100);
  const gh = r.g.filter(g => goalWeights()[g]).slice(0, 3);
  const sea = r.s.includes('all') || r.s.includes(season());
  return `<article class="meal">
    <div data-open="${r.id}" style="position:relative">${photo(r, a)}
      <span class="mom">${m.e} ${m.n}</span>
    </div>
    <div class="bd">
      <div class="nm" data-open="${r.id}">${esc(r.n)}</div>
      <div class="meta">
        <span class="pill ${a.missing.length ? 'part' : 'ok'}">${a.missing.length ? `🧊 ${pct} % dans ton frigo` : '✅ Tout est dans ton frigo'}</span>
        <span class="pill">⏱️ ${r.t} min</span>
        <span class="pill">💶 ${euro(costOf(r))}</span>

        ${r.box ? '<span class="pill">🥡 à emporter</span>' : ''}
      </div>
      <div class="why">${gh.length ? `<b>${gh.map(g => GOALS[g].e + ' ' + GOALS[g].n).join(' · ')}</b> — ` : ''}${esc(r.why)}</div>
      ${a.missing.length ? `<div class="miss">Il te manque : <b>${esc(a.missing.map(k => INGM[k].n.toLowerCase()).join(', '))}</b></div>` : ''}
      <div class="acts">
        <button class="btn sm" data-open="${r.id}">Voir la recette</button>
        ${n > 1 ? `<button class="btn ghost sm" data-next="${m.id}">🔄 Autre idée</button>` : ''}
        <button class="btn ghost sm" data-fav="${r.id}" aria-pressed="${fav}">${fav ? '♥ Favori' : '♡'}</button>
      </div>
    </div>
  </article>`;
}
function bindCards(root){
  root.querySelectorAll('[data-next]').forEach(b => b.onclick = () => { const id = b.dataset.next; S.skip[id] = (S.skip[id] || 0) + 1; save(); renderMeals(); });
  root.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openRecipe(b.dataset.open));
  root.querySelectorAll('[data-fav]').forEach(b => b.onclick = e => { e.stopPropagation(); toggleFav(b.dataset.fav); });
}
function toggleFav(id){
  S.favs = S.favs.includes(id) ? S.favs.filter(x => x !== id) : [...S.favs, id]; save();
  const on = S.favs.includes(id);
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b => { b.setAttribute('aria-pressed', on); if(!b.classList.contains('favb')) b.textContent = on ? '♥ Favori' : '♡'; else b.textContent = on ? '♥' : '♡'; });
  toast(on ? 'Ajouté aux favoris' : 'Retiré des favoris');
}
function addMissing(r){
  const a = analyse(r) || analyseLoose(r); let n = 0;
  a.missing.forEach(k => { if(!S.shop.some(s => s.k === k)){ S.shop.push({k, from:r.n, done:false}); n++; } });
  save(); updateBadge();
  toast(n ? `${n} ingrédient${n > 1 ? 's' : ''} ajouté${n > 1 ? 's' : ''} aux courses` : 'Déjà dans ta liste');
}

function qtyFor(k, r){
  const q = r.q && r.q[k]; if(!q) return '';
  const f = ageOf().f * S.persons;
  if(Math.abs(f - 1) < .01) return q;
  const sc = n => { const v = parseFloat(String(n).replace(',', '.'))*f; return v >= 10 ? String(Math.round(v/5)*5) : String(Math.round(v*2)/2).replace('.', ','); };
  if(q.startsWith('½')) return (f < .75 ? '¼' : f < 1.5 ? '½' : sc('0.5')) + q.slice(1);
  return q.replace(/^(\d+(?:[.,]\d+)?)(?:\s*à\s*(\d+))?/, (all, a, b) => b ? `${sc(a)} à ${sc(b)}` : sc(a));
}

function analyseLoose(r){
  const slots = r.r.map(alts => { const got = alts.find(have); return {alts, use: got || alts[0], have: !!got}; });
  return {slots, opts: r.o, haveN: slots.filter(s => s.have).length, total: slots.length, missing: slots.filter(s => !s.have).map(s => s.use)};
}
function closeSheet(){ $('#scrim').classList.remove('on'); }

const RF = {q:'', m:'all', g:null, quick:false, cheap:false, sea:false, mine:false, fav:false};
function renderRecipes(){
  const v = $('#v-rec');
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  v.innerHTML = `
    <h2 class="sec">${RECIPES.length} recettes</h2>
    <p class="lead">Simples, de saison et pas chères. Touche une recette pour la voir en entier.</p>
    <div class="sticky"><input class="search" id="rq" type="search" placeholder="Chercher : lentilles, curry, pâtes…" value="${esc(RF.q)}" aria-label="Chercher une recette"></div>
    <div class="chips scroll" id="rM">${[['all','Toutes'],...MOMENTS.map(m => [m.id, m.e + ' ' + m.n])].map(([k,l]) => `<button class="chip" data-v="${k}" aria-pressed="${RF.m === k}">${l}</button>`).join('')}</div>
    <div class="chips scroll" id="rG" style="margin-top:8px">${Object.entries(GOALS).map(([k,g]) => `<button class="chip" data-v="${k}" aria-pressed="${RF.g === k}">${g.e} ${g.n}</button>`).join('')}</div>
    <div class="chips scroll" id="rX" style="margin-top:8px">
      <button class="chip" data-x="mine" aria-pressed="${RF.mine}">🧊 Avec mon frigo</button>
      <button class="chip" data-x="sea" aria-pressed="${RF.sea}">🌱 De saison</button>
      <button class="chip" data-x="quick" aria-pressed="${RF.quick}">⚡ 15 min max</button>
      <button class="chip" data-x="cheap" aria-pressed="${RF.cheap}">💶 1 € max</button>
      <button class="chip" data-x="fav" aria-pressed="${RF.fav}">♥ Favoris</button>
    </div>
    <div class="grid" id="rGrid"></div>`;
  const draw = () => {
    const q = norm(RF.q.trim());
    let list = RECIPES.map(r => ({r, a: analyse(r)})).filter(({r, a}) => a &&
      (RF.m === 'all' || r.m.includes(RF.m)) && (!RF.g || r.g.includes(RF.g)) &&
      (!RF.quick || r.t <= 15) && (!RF.cheap || r.c <= 1) && (!RF.fav || S.favs.includes(r.id)) &&
      (!RF.sea || r.s.includes('all') || r.s.includes(season())) &&
      (!RF.mine || a.haveN / a.total >= .66) &&
      (!q || norm(r.n + ' ' + r.r.flat().map(k => INGM[k].n).join(' ') + ' ' + r.o.map(k => INGM[k].n).join(' ')).includes(q)));
    if(RF.mine) list.sort((x, y) => (y.a.haveN/y.a.total) - (x.a.haveN/x.a.total));
    $('#rGrid').innerHTML = list.length ? list.map(({r, a}) => `<button class="rc" data-open="${r.id}">
      <div style="position:relative">${photo(r, a)}${a.missing.length === 0 ? '<span class="tag">✅ J\'ai tout</span>' : ''}</div>
      <div class="b"><b>${esc(r.n)}</b><span>⏱️ ${r.t} min · 💶 ${euro(r.c)} · ${r.g.slice(0,3).map(g => GOALS[g].e).join('')}</span></div>
    </button>`).join('') : '<div class="empty" style="grid-column:1/-1">Aucune recette ne correspond. Retire un filtre.</div>';
    $('#rGrid').querySelectorAll('[data-open]').forEach(b => b.onclick = () => openRecipe(b.dataset.open));
  };
  $('#rq').oninput = e => { RF.q = e.target.value; draw(); };
  v.querySelectorAll('#rM .chip').forEach(b => b.onclick = () => { RF.m = b.dataset.v; renderRecipes(); });
  v.querySelectorAll('#rG .chip').forEach(b => b.onclick = () => { RF.g = RF.g === b.dataset.v ? null : b.dataset.v; renderRecipes(); });
  v.querySelectorAll('#rX .chip').forEach(b => b.onclick = () => { RF[b.dataset.x] = !RF[b.dataset.x]; renderRecipes(); });
  draw();
}

    <h3 class="sub">⏰ À chaque moment</h3>
    <div class="guide">
      <div class="gcard"><h5>🌅 Petit-déjeuner</h5><p>Un féculent complet (avoine, pain complet), une protéine (œuf, laitier, oléagineux) et un fruit : ça évite le coup de barre de 11 h.</p></div>
      <div class="gcard"><h5>☀️ Déjeuner</h5><p>La moitié de l'assiette en légumes, un quart de féculents, un quart de protéines. À emporter si la journée est chargée.</p></div>
      <div class="gcard"><h5>🍏 Collation</h5><p>Un fruit et une poignée d'oléagineux, ou un laitier. Utile pour les enfants, les ados, les sportifs et les longues journées.</p></div>
      <div class="gcard"><h5>🌙 Dîner</h5><p>Plutôt léger et digeste pour bien dormir. Plus de féculents si tu as fait du sport.</p></div>
      <div class="gcard"><h5>💧 Toute la journée</h5><p>De l'eau régulièrement : même une petite déshydratation fait baisser la concentration.</p></div>
    </div>`;
  $('#v-season').querySelectorAll('[data-open]').forEach(b => b.onclick = () => openRecipe(b.dataset.open));
}

/* =========================================================
   PROFIL (feuille)
   ========================================================= */
function openProfile(){
  const draw = () => {
    $('#sheet').innerHTML = `<div style="padding:18px 18px 0">
      <div style="display:flex;align-items:center;gap:10px"><h2 class="sec" style="flex:1">Mes réglages</h2><button class="btn ghost sm" data-close>Fermer</button></div>
      <p class="lead">Ils adaptent les portions, le temps et le budget des repas proposés.</p>
      <label class="f">Âge</label>
      <div class="chips" id="mAge">${AGES.map(a => `<button class="chip" data-v="${a.id}" aria-pressed="${a.id === S.age}">${esc(a.n)}</button>`).join('')}</div>
      <p class="muted" style="font-size:13px;margin-top:8px">💡 ${esc(ageOf().tip)}</p>
      <label class="f">Nombre de personnes</label>
      <div class="stepper"><button id="pM" aria-label="Moins">−</button><b>${S.persons}</b><button id="pP" aria-label="Plus">+</button></div>
      <label class="f">Temps de préparation maximum</label>
      <div class="chips" id="mTime">${[10,20,30,45,60].map(t => `<button class="chip" data-v="${t}" aria-pressed="${t === S.time}">${t === 60 ? 'Pas de limite' : t + ' min'}</button>`).join('')}</div>
      <label class="f">Budget par portion</label>
      <div class="chips" id="mBud">${[[1,'1 € max (serré)'],[2,'2 € max'],[3,'3 € max'],[5,'Pas de limite']].map(([b,l]) => `<button class="chip" data-v="${b}" aria-pressed="${b === S.budget}">${l}</button>`).join('')}</div>
      <label class="f">Régime / allergies</label>
      <div class="chips" id="mDiet">${DIETS.map(d => `<button class="chip" data-v="${d.id}" aria-pressed="${S.diet.includes(d.id)}">${esc(d.n)}</button>`).join('')}</div>
      <label class="f">Saison</label>
      <div class="chips" id="mSea"><button class="chip" data-v="" aria-pressed="${!S.seasonOverride}">Automatique</button>${Object.entries(SEASONS).map(([k,s]) => `<button class="chip" data-v="${k}" aria-pressed="${S.seasonOverride === k}">${s.e} ${s.n}</button>`).join('')}</div>
      <p class="disc">🔒 Tout reste sur ton téléphone. En cas d'allergie, de grossesse, de maladie chronique ou de régime médical, demande l'avis d'un professionnel de santé.</p>
    </div>`;
    const sh = $('#sheet');
    sh.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { closeSheet(); go(view); });
    const set = (sel, key, conv = x => x) => sh.querySelectorAll(sel + ' .chip').forEach(b => b.onclick = () => { S[key] = conv(b.dataset.v); S.skip = {}; save(); renderHeader(); draw(); });
    set('#mAge', 'age'); set('#mTime', 'time', Number); set('#mBud', 'budget', Number); set('#mSea', 'seasonOverride', x => x || null);
    sh.querySelectorAll('#mDiet .chip').forEach(b => b.onclick = () => { const d = b.dataset.v; S.diet = S.diet.includes(d) ? S.diet.filter(x => x !== d) : [...S.diet, d]; S.skip = {}; save(); draw(); });
    $('#pM').onclick = () => { S.persons = Math.max(1, S.persons - 1); save(); draw(); };
    $('#pP').onclick = () => { S.persons = Math.min(12, S.persons + 1); save(); draw(); };
  };
  draw();
  $('#scrim').classList.add('on');
  $('#scrim').onclick = e => { if(e.target.id === 'scrim'){ closeSheet(); go(view); } };
}

/* =========================================================
   NAVIGATION
   ========================================================= */
let view = 'plan';
function go(v){
  view = v;
  document.querySelectorAll('nav.tabs button').forEach(b => b.dataset.v === v ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  document.querySelectorAll('section.view').forEach(s => s.classList.toggle('on', s.id === 'v-'+v));
  ({plan:renderPlan, frigo:renderFrigo, rec:renderRecipes, shop:renderShop, season:renderSeason})[v]();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => go(b.dataset.v));
$('#hMe').onclick = openProfile;
function renderHeader(){ const s = SEASONS[season()]; $('#hSeason').textContent = `${s.e} ${s.n}`; }
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

renderHeader(); updateBadge(); go('plan');

</script>
</body>
</html>
