<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Frigo Énergie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EC; --surface:#FFFFFF; --surface2:#EFEBE2; --line:#E2DCCF;
  --ink:#1F2A22; --muted:#6B7368; --accent:#2F7D4F; --accent-ink:#FFFFFF;
  --warm:#E07A3F; --gold:#C9962B; --red:#C4473A; --blue:#3E7CB1; --purple:#7A5BB5;
  --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121612; --surface:#1A201B; --surface2:#232A24; --line:#2E372F;
    --ink:#E8ECE6; --muted:#97A196; --accent:#5DBB84; --accent-ink:#0E1A12;
    --warm:#F0955C; --gold:#E0B44E; --red:#E06A5C; --blue:#6FA6D6; --purple:#A68BDB;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-bottom:calc(76px + env(safe-area-inset-bottom));line-height:1.45}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font-family:inherit}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.serif{font-family:'Fraunces',Georgia,serif}
h1.title{font-family:'Fraunces',Georgia,serif;font-size:30px;line-height:1.1;margin:8px 0 4px}
h2.sec{font-family:'Fraunces',Georgia,serif;font-size:26px;line-height:1.15;margin:6px 0 6px}
h3.sub{font-size:12.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin:24px 0 10px;font-weight:700}
.lead{color:var(--muted);font-size:14.5px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14.5px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{opacity:.75}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}

/* Header & nav */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:10px;padding:11px 0}
.logo{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:700;flex:1}
.logo span{color:var(--accent)}
.season{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);position:relative}
nav.tabs button b{font-size:20px;line-height:1.2;filter:grayscale(.9);opacity:.7}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current="page"] b{filter:none;opacity:1}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--warm);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px}
section.view{display:none;padding:16px 0 28px}
section.view.on{display:block}

/* Planner */
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.day{display:flex;gap:10px;align-items:center;text-align:left;padding:11px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;line-height:1.2}
.day i{font-style:normal;font-size:22px}
.day small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.fridgebar{display:flex;align-items:center;gap:12px;margin-top:12px}
.fridgebar .t{flex:1;font-size:14px}
.fridgebar .t b{font-size:15px}
.goalbox{margin-top:14px;padding:14px;border-radius:var(--radius);background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
.goalbox h4{font-size:14px;margin-bottom:6px}
.goalbox ul{padding-left:18px;font-size:13.5px}
.goalbox li{margin:3px 0}

/* Meal cards */
.meal{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.meal .mh{display:flex;align-items:center;gap:8px;padding:12px 14px 0}
.meal .mom{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--warm)}
.meal .mh .sp{flex:1}
.meal .bd{padding:6px 14px 14px}
.meal .nm{font-family:'Fraunces',Georgia,serif;font-size:21px;line-height:1.2}
.meal .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.match{font-weight:700}
.match.full{color:var(--accent)}
.match.part{color:var(--gold)}
.why{font-size:13.5px;margin:6px 0 10px;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.why b{font-weight:600}
.ings{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ing{font-size:13px;padding:5px 9px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.ing.have{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.ing.miss{border-style:dashed;color:var(--muted)}
.ing.opt{opacity:.8}
details.steps{margin-top:10px}
details.steps summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent);list-style:none}
details.steps summary::-webkit-details-marker{display:none}
details.steps ol{padding-left:20px;margin-top:8px;font-size:14px}
details.steps li{margin:5px 0}
.tip{font-size:13px;margin-top:10px;color:var(--muted)}
.tip b{color:var(--ink)}
.mact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fav[aria-pressed="true"]{color:var(--red)}
.empty{padding:16px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-size:14px;text-align:center}

/* Frigo */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px}
.ingcat{margin-top:18px}
.ingcat h4{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.ingcat .chip .s{font-size:10px;color:var(--accent);font-weight:700;margin-left:4px}
.ingcat .chip[aria-pressed="true"] .s{color:var(--accent-ink)}
.sticky{position:sticky;top:62px;z-index:5;background:var(--bg);padding:8px 0}

/* Courses */
.shop{display:flex;flex-direction:column;gap:6px}
.si{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.si input{width:20px;height:20px;accent-color:var(--accent)}
.si.done span{text-decoration:line-through;color:var(--muted)}
.si .from{font-size:12px;color:var(--muted)}
.si span{flex:1}
.si button{color:var(--muted);font-size:16px;width:28px;height:28px;border-radius:50%}

/* Saison */
.prod{display:flex;flex-wrap:wrap;gap:6px}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.gcard h4{font-size:15px;margin-bottom:4px}
.gcard p{font-size:13px;color:var(--muted)}

/* Profil */
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.in{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--surface2);font-size:20px;font-weight:700}
.stepper b{min-width:30px;text-align:center;font-size:20px}
.disc{font-size:12px;color:var(--muted);margin-top:20px;line-height:1.5}

/* Browse */
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);width:100%}
.rrow .e{font-size:26px;width:40px;text-align:center}
.rrow .b{flex:1;min-width:0}
.rrow .b b{display:block;font-size:15px}
.rrow .b span{font-size:12.5px;color:var(--muted)}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{width:100%;max-width:780px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface2);font-size:17px;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap hd">
  <div class="logo">Frigo <span>Énergie</span></div>
  <div class="season" id="hSeason"></div>
</div></header>

<main class="wrap">
  <section class="view on" id="v-plan"></section>
  <section class="view" id="v-frigo"></section>
  <section class="view" id="v-shop"></section>
  <section class="view" id="v-season"></section>
  <section class="view" id="v-me"></section>
</main>

<nav class="tabs" aria-label="Navigation"><div class="wrap">
  <button data-v="plan" aria-current="page"><b>🍽️</b>Ma journée</button>
  <button data-v="frigo"><b>🧊</b>Mon frigo</button>
  <button data-v="shop"><b>🛒</b>Courses<span class="badge" id="shopBadge" hidden></span></button>
  <button data-v="season"><b>🌱</b>Saison</button>
  <button data-v="me"><b>👤</b>Profil</button>
</div></nav>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* =========================================================
   INGRÉDIENTS
   mois de saison (France métropolitaine) ; flags : M viande, F poisson, E œuf, D laitier, G gluten, P porc, H miel
   ========================================================= */
const R = (a, b) => { const o = []; let m = a; for(;;){ o.push(m); if(m === b) break; m = m % 12 + 1; } return o; };
const CATS_ING = {leg:'🥕 Légumes', fruit:'🍎 Fruits', prot:'🍗 Viandes, poissons, tofu', lait:'🥚 Œufs & laitiers', fec:'🍞 Féculents & céréales', legu:'🫘 Légumineuses', ole:'🌰 Oléagineux & graines', plac:'🫙 Placard'};
const ING = [
  // légumes
  ['carotte','Carottes','leg',null],['poireau','Poireaux','leg',R(9,4)],['chou','Chou','leg',R(10,3)],['choufleur','Chou-fleur','leg',R(9,4)],
  ['brocoli','Brocoli','leg',R(6,11)],['courge','Courge / potiron','leg',R(9,2)],['epinard','Épinards','leg',[3,4,5,6,9,10,11]],['salade','Salade verte','leg',R(4,11)],
  ['tomate','Tomates','leg',R(6,9)],['courgette','Courgettes','leg',R(6,9)],['poivron','Poivrons','leg',R(7,9)],['concombre','Concombre','leg',R(5,9)],
  ['aubergine','Aubergine','leg',R(7,9)],['haricotvert','Haricots verts','leg',R(6,9)],['betterave','Betterave cuite','leg',null],['navet','Navets','leg',R(10,3)],
  ['patatedouce','Patate douce','leg',R(10,3)],['champignon','Champignons','leg',null],['oignon','Oignon','leg',null],['ail','Ail','leg',null],
  ['radis','Radis','leg',R(3,6)],['petitpois','Petits pois (frais/surgelés)','leg',null],['endive','Endives','leg',R(10,4)],['avocat','Avocat','leg',R(11,4)],
  ['legsurg','Légumes surgelés','leg',null],
  // fruits
  ['pomme','Pommes','fruit',R(8,4)],['poire','Poires','fruit',R(8,3)],['banane','Bananes','fruit',null],['orange','Oranges','fruit',R(11,4)],
  ['clementine','Clémentines','fruit',R(11,2)],['kiwi','Kiwis','fruit',R(11,4)],['citron','Citron','fruit',null],['fraise','Fraises','fruit',R(4,6)],
  ['fruitsrouges','Fruits rouges (frais/surgelés)','fruit',null],['abricot','Abricots','fruit',R(6,8)],['peche','Pêches','fruit',R(6,9)],['melon','Melon','fruit',R(6,9)],
  ['raisin','Raisin','fruit',R(8,10)],['dattes','Dattes / fruits secs','fruit',null],
  // protéines
  ['poulet','Poulet','prot',null,'M'],['dinde','Dinde','prot',null,'M'],['boeuf','Bœuf haché','prot',null,'M'],['jambon','Jambon','prot',null,'MP'],
  ['lardons','Lardons','prot',null,'MP'],['poisson','Poisson blanc','prot',null,'F'],['saumon','Saumon','prot',null,'F'],['sardines','Sardines en boîte','prot',null,'F'],
  ['maquereau','Maquereau en boîte','prot',null,'F'],['thon','Thon en boîte','prot',null,'F'],['tofu','Tofu','prot',null],
  // œufs & laitiers
  ['oeufs','Œufs','lait',null,'E'],['lait','Lait','lait',null,'D'],['laitveg','Boisson végétale','lait',null],['yaourt','Yaourt nature','lait',null,'D'],
  ['fromageblanc','Fromage blanc','lait',null,'D'],['fromage','Fromage (râpé, emmental…)','lait',null,'D'],['feta','Feta','lait',null,'D'],
  ['mozza','Mozzarella','lait',null,'D'],['beurre','Beurre','lait',null,'D'],['creme','Crème fraîche','lait',null,'D'],
  // féculents
  ['pain','Pain complet','fec',null,'G'],['avoine','Flocons d\'avoine','fec',null,'G'],['riz','Riz','fec',null],['pates','Pâtes (complètes)','fec',null,'G'],
  ['semoule','Semoule','fec',null,'G'],['boulgour','Boulgour','fec',null,'G'],['quinoa','Quinoa','fec',null],['pdt','Pommes de terre','fec',null],['wraps','Galettes / wraps','fec',null,'G'],
  // légumineuses
  ['lentilles','Lentilles','legu',null],['corail','Lentilles corail','legu',null],['poischiches','Pois chiches (boîte)','legu',null],['haricotsrouges','Haricots rouges (boîte)','legu',null],
  // oléagineux
  ['noix','Noix','ole',null],['amandes','Amandes','ole',null],['graines','Graines (lin, chia, courge)','ole',null],['cacahuete','Beurre de cacahuète','ole',null],['chocolat','Chocolat noir','ole',null],
  // placard
  ['miel','Miel','plac',null,'H'],['tomconc','Tomates concassées (boîte)','plac',null],['coco','Lait de coco','plac',null],['curcuma','Curcuma','plac',null],
  ['gingembre','Gingembre','plac',null],['soja','Sauce soja','plac',null,'G'],['moutarde','Moutarde','plac',null],['cannelle','Cannelle','plac',null],['cacao','Cacao en poudre','plac',null],
];
const INGM = Object.fromEntries(ING.map(([k,n,c,m,f]) => [k, {k, n, c, m, f:f || ''}]));
const STAPLES = 'sel, poivre, huile d\'olive ou de colza, vinaigre, herbes et épices de base, farine, sucre';

/* =========================================================
   OBJECTIFS & TYPES DE JOURNÉE
   ========================================================= */
const GOALS = {
  concentration:{n:'Concentration', e:'🎯', d:'Glucides à libération lente (avoine, pain complet, légumineuses), des protéines dès le matin et de l\'eau régulièrement, pour éviter le coup de barre.'},
  memoire:      {n:'Mémoire',       e:'🧠', d:'Oméga-3 (poissons gras, noix, huile de colza), œufs, fruits rouges et légumes verts.'},
  force:        {n:'Force',         e:'💪', d:'Des protéines à chaque repas (œufs, viande, poisson, légumineuses, laitiers, tofu).'},
  endurance:    {n:'Endurance',     e:'🏃', d:'Des glucides pour le carburant (riz, pâtes, avoine, banane), du fer (lentilles, viande) et beaucoup d\'eau.'},
  antiinflam:   {n:'Anti-inflammatoire', e:'🌿', d:'Légumes colorés, fruits rouges, oméga-3, huile d\'olive ou de colza, curcuma (avec du poivre), gingembre. On limite les produits ultra-transformés.'},
  resilience:   {n:'Résistance & moral', e:'🛡️', d:'Vitamine C (agrumes, kiwi, choux), magnésium (oléagineux, chocolat noir, légumineuses), des plats réconfortants et du sommeil.'},
  energie:      {n:'Énergie',       e:'⚡', d:'Des repas complets : un féculent, une protéine et des légumes, sans sauter de repas.'},
};
const DAYS = [
  {id:'travail',  e:'💼', n:'Grosse journée de travail', d:'concentration, tenir jusqu\'au soir', w:{concentration:3, energie:2, resilience:1, memoire:1}, box:true},
  {id:'etudes',   e:'📚', n:'Journée d\'études / examen', d:'mémoire, concentration', w:{concentration:3, memoire:3, energie:1}, box:true},
  {id:'physique', e:'🔨', n:'Travail physique', d:'chantier, debout, port de charges', w:{energie:3, endurance:2, force:2}, box:true, more:true},
  {id:'force',    e:'🏋️', n:'Séance de force', d:'muscu, sport de combat', w:{force:3, energie:1, antiinflam:1}, more:true},
  {id:'endurance',e:'🚴', n:'Sport d\'endurance', d:'course, vélo, match', w:{endurance:3, energie:2, antiinflam:1}, more:true},
  {id:'recup',    e:'🌿', n:'Récupération', d:'courbatures, fatigue, anti-inflammatoire', w:{antiinflam:3, resilience:2, force:1}},
  {id:'stress',   e:'🧘', n:'Période de stress', d:'moral, résistance, sommeil', w:{resilience:3, antiinflam:1, concentration:1}},
  {id:'calme',    e:'🏡', n:'Journée tranquille', d:'repas légers et équilibrés', w:{antiinflam:1, resilience:1, energie:1}},
];
const MOMENTS = [
  {id:'pdj', n:'Petit-déjeuner', e:'🌅'},
  {id:'dej', n:'Déjeuner', e:'☀️'},
  {id:'col', n:'Collation', e:'🍏'},
  {id:'din', n:'Dîner', e:'🌙'},
];
const AGES = [
  {id:'enfant', n:'Enfant (3–11 ans)', f:.6, tip:'Pas de café, de boissons énergisantes ni de sodas. Des laitiers ou équivalents pour le calcium, et un vrai petit-déjeuner avant l\'école.'},
  {id:'ado',    n:'Ado (12–17 ans)',   f:1.15, tip:'Grosse période de croissance : ne saute pas le petit-déj, pense au calcium (laitiers) et au fer (lentilles, viande, œufs).'},
  {id:'adulte', n:'Adulte (18–64 ans)', f:1, tip:'Un féculent, une protéine et des légumes à chaque repas principal, et de l\'eau tout au long de la journée.'},
  {id:'senior', n:'Senior (65 ans et +)', f:.9, tip:'Garde des protéines à chaque repas pour conserver tes muscles, bois même sans soif, et mise sur le calcium et la vitamine D (laitiers, poissons gras, œufs).'},
];

/* =========================================================
   ÉTAT
   ========================================================= */
const KEY = 'frigo-energie-v1';
const DEF = {fridge:[], days:['travail'], moments:['pdj','dej','col','din'], age:'adulte', persons:1, budget:3, time:30, diet:[], favs:[], shop:[], seasonOverride:null, skip:{}};
let S = load();
function load(){ try{ const r = localStorage.getItem(KEY); if(r) return Object.assign({}, DEF, JSON.parse(r)); }catch(e){} return JSON.parse(JSON.stringify(DEF)); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const month = () => new Date().getMonth() + 1;
const season = () => S.seasonOverride || seasonOf(month());
const inSeason = k => { const i = INGM[k]; return !i.m || i.m.includes(month()); };
const isFreshSeasonal = k => INGM[k] && INGM[k].m && INGM[k].m.includes(month());
const have = k => S.fridge.includes(k);
const ageOf = () => AGES.find(a => a.id === S.age) || AGES[2];
const euro = v => v.toFixed(2).replace('.', ',') + ' €';

/* Régimes */
const DIETS = [
  {id:'vege', n:'Végétarien', bad:'MFP'},
  {id:'vegan', n:'Végétalien', bad:'MFPEDH'},
  {id:'pesc', n:'Pescétarien', bad:'MP'},
  {id:'sansporc', n:'Sans porc', bad:'P'},
  {id:'sansgluten', n:'Sans gluten', bad:'G'},
  {id:'sanslactose', n:'Sans lactose', bad:'D'},
];
const badFlags = () => S.diet.map(d => DIETS.find(x => x.id === d).bad).join('');
const ok = k => { const b = badFlags(); return ![...INGM[k].f].some(f => b.includes(f)); };

/* =========================================================
   MOTEUR DE SUGGESTION
   ========================================================= */
function analyse(r){
  const slots = r.r.map(alts => {
    const allowed = alts.filter(ok);
    if(!allowed.length) return null;
    const got = allowed.find(have);
    const pickSeasonal = allowed.find(k => isFreshSeasonal(k)) || allowed[0];
    return {alts: allowed, use: got || pickSeasonal, have: !!got};
  });
  if(slots.some(s => s === null)) return null;               // incompatible avec le régime
  const opts = r.o.filter(ok);
  const haveN = slots.filter(s => s.have).length;
  return {slots, opts, haveN, total: slots.length, missing: slots.filter(s => !s.have).map(s => s.use)};
}
function goalWeights(){
  const w = {};
  S.days.forEach(id => { const d = DAYS.find(x => x.id === id); if(d) for(const [g,v] of Object.entries(d.w)) w[g] = (w[g] || 0) + v; });
  return w;
}
function score(r, a, w, moment){
  const sea = season();
  const ratio = a.haveN / a.total;
  let s = ratio*60;
  if(a.missing.length === 0) s += 15;
  const maxW = Math.max(1, ...Object.values(w));
  s += r.g.reduce((acc, g) => acc + (w[g] || 0), 0) / maxW * 6;
  if(r.s.includes('all') || r.s.includes(sea)) s += 10; else s -= 18;
  s += a.slots.filter(x => isFreshSeasonal(x.use)).length*2;
  if(r.t <= S.time) s += 6; else s -= (r.t - S.time)/3;
  if(r.c <= S.budget) s += 5; else s -= (r.c - S.budget)*4;
  if(moment === 'dej' && S.days.some(id => DAYS.find(d => d.id === id)?.box) && r.box) s += 6;
  if(r.m[0] === moment) s += 3;
  s += Math.min(4, a.opts.filter(have).length);
  return s;
}
function suggestions(moment){
  const w = goalWeights();
  return RECIPES.filter(r => r.m.includes(moment))
    .map(r => { const a = analyse(r); return a && {r, a, s: score(r, a, w, moment)}; })
    .filter(Boolean)
    .sort((x, y) => y.s - x.s);
}

  v.querySelectorAll('#pMoments .chip').forEach(b => b.onclick = () => {
    const id = b.dataset.m;
    S.moments = S.moments.includes(id) ? S.moments.filter(x => x !== id) : MOMENTS.map(m => m.id).filter(m => S.moments.includes(m) || m === id);
    save(); renderPlan();
  });
  $('#pFridge').onclick = () => go('frigo');
  $('#pEdit').onclick = () => go('me');
  renderMeals();
}
function renderMeals(){
  const box = $('#pMeals'); if(!box) return;
  const used = new Set();
  box.innerHTML = '';
  for(const m of MOMENTS.filter(x => S.moments.includes(x.id))){
    const list = suggestions(m.id).filter(x => !used.has(x.r.id) || false);
    if(!list.length){ box.insertAdjacentHTML('beforeend', `<div class="meal"><div class="mh"><span class="mom">${m.e} ${m.n}</span></div><div class="bd"><div class="empty">Aucune recette compatible avec tes réglages. Essaie d'assouplir le régime, le temps ou le budget.</div></div></div>`); continue; }
    const idx = (S.skip[m.id] || 0) % list.length;
    const it = list[idx]; used.add(it.r.id);
    box.insertAdjacentHTML('beforeend', mealCard(it, m, idx, list.length));
  }
  bindMealCards(box);
}
function qtyFor(k, r){
  const q = r.q && r.q[k]; if(!q) return '';
  const f = ageOf().f * S.persons;
  if(Math.abs(f - 1) < .01) return q;
  return q.replace(/^(\d+(?:[.,]\d+)?)(?:\s*à\s*(\d+))?/, (all, a, b) => {
    const sc = n => { const v = parseFloat(String(n).replace(',', '.'))*f; return v >= 10 ? String(Math.round(v/5)*5) : String(Math.round(v*2)/2).replace('.', ','); };
    return b ? `${sc(a)} à ${sc(b)}` : sc(a);
  }).replace(/^½/, f >= 1.5 ? String(Math.round(.5*f*2)/2).replace('.', ',') : '½');
}
function mealCard({r, a}, m, idx, n){
  const fav = S.favs.includes(r.id);
  const pct = Math.round(a.haveN / a.total * 100);
  const cost = r.c * S.persons * ageOf().f;
  const goalsHit = r.g.filter(g => goalWeights()[g]);
  const sea = r.s.includes('all') || r.s.includes(season());
  return `<article class="meal" data-r="${r.id}" data-m="${m ? m.id : ''}">
    <div class="mh">${m ? `<span class="mom">${m.e} ${m.n}</span>` : ''}<span class="sp"></span>
      <button class="btn ghost sm fav" data-fav="${r.id}" aria-pressed="${fav}" aria-label="Favori">${fav ? '♥' : '♡'}</button></div>
    <div class="bd">
      <div class="nm">${r.e} ${esc(r.n)}</div>
      <div class="meta">
        <span class="pill match ${a.missing.length ? 'part' : 'full'}">${a.missing.length ? `🧊 ${pct} % dans ton frigo` : '✅ Tout est dans ton frigo'}</span>
        <span class="pill">⏱️ ${r.t} min</span>
        <span class="pill">💶 ~${euro(cost)}${S.persons > 1 ? ' au total' : ''}</span>
        ${sea ? `<span class="pill">🌱 de saison</span>` : ''}
        ${r.box ? '<span class="pill">🥡 à emporter</span>' : ''}
        ${r.veille ? '<span class="pill">🌙 la veille</span>' : ''}
      </div>
      <div class="why">${goalsHit.length ? `<b>${goalsHit.map(g => GOALS[g].e + ' ' + GOALS[g].n).join(' · ')}</b><br>` : ''}${esc(r.why)}</div>
      <div class="ings">
        ${a.slots.map(s => `<span class="ing ${s.have ? 'have' : 'miss'}">${s.have ? '✓' : '+'} ${esc(INGM[s.use].n)}${qtyFor(s.use, r) ? ` <small class="muted">${esc(qtyFor(s.use, r))}</small>` : ''}${!s.have && s.alts.length > 1 ? ` <small class="muted">(ou ${esc(s.alts.filter(k => k !== s.use).slice(0,2).map(k => INGM[k].n.toLowerCase()).join(', '))})</small>` : ''}</span>`).join('')}
        ${a.opts.map(k => `<span class="ing opt ${have(k) ? 'have' : ''}">${have(k) ? '✓' : '○'} ${esc(INGM[k].n)} <small class="muted">facultatif</small></span>`).join('')}
      </div>
      <details class="steps"><summary>📖 Préparation (${r.st.length} étapes)</summary><ol>${r.st.map(s => `<li>${esc(s)}</li>`).join('')}</ol></details>
      <div class="mact">
        ${m && n > 1 ? `<button class="btn ghost sm" data-next="${m.id}">🔄 Autre idée (${idx+1}/${n})</button>` : ''}
        ${a.missing.length ? `<button class="btn sm" data-shop="${r.id}">🛒 Ajouter ${a.missing.length} manquant${a.missing.length > 1 ? 's' : ''} aux courses</button>` : ''}
      </div>
    </div>
  </article>`;
}
function bindMealCards(root){
  root.querySelectorAll('[data-next]').forEach(b => b.onclick = () => { const id = b.dataset.next; S.skip[id] = (S.skip[id] || 0) + 1; save(); renderMeals(); });
  root.querySelectorAll('[data-fav]').forEach(b => b.onclick = () => {
    const id = b.dataset.fav;
    S.favs = S.favs.includes(id) ? S.favs.filter(x => x !== id) : [...S.favs, id]; save();
    b.setAttribute('aria-pressed', S.favs.includes(id)); b.textContent = S.favs.includes(id) ? '♥' : '♡';
    toast(S.favs.includes(id) ? 'Ajouté aux favoris' : 'Retiré des favoris');
  });
  root.querySelectorAll('[data-shop]').forEach(b => b.onclick = () => {
    const r = RECIPES.find(x => x.id === b.dataset.shop), a = analyse(r);
    let n = 0;
    a.missing.forEach(k => { if(!S.shop.some(s => s.k === k)){ S.shop.push({k, from:r.n, done:false}); n++; } });
    save(); updateBadge(); toast(n ? `${n} ingrédient${n > 1 ? 's' : ''} ajouté${n > 1 ? 's' : ''} à la liste de courses` : 'Déjà dans ta liste');
  });
}

/* =========================================================
   VUE : MON FRIGO
   ========================================================= */
let fq = '';
function renderFrigo(){
  const v = $('#v-frigo');
  v.innerHTML = `
    <h2 class="sec">Mon frigo & placard</h2>
    <p class="lead">Touche ce que tu as. Les produits marqués <b style="color:var(--accent)">saison</b> sont de saison en ${MONTHS[month()-1]}. Pas besoin de cocher le sel, l'huile, les épices de base ni la farine.</p>
    <div class="sticky"><input class="search" id="fq" type="search" placeholder="Chercher : œufs, riz, poireaux…" value="${esc(fq)}" aria-label="Chercher un ingrédient"></div>
    <div id="fList"></div>
    <div class="row" style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap">
      <button class="btn" id="fGo">🍽️ Voir mes repas</button>
      <button class="btn ghost" id="fClear">Vider le frigo</button>
    </div>`;
  const draw = () => {
    const q = fq.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    $('#fList').innerHTML = Object.entries(CATS_ING).map(([c, l]) => {
      const items = ING.filter(i => i[2] === c && (!q || norm(i[1]).includes(q)));
      if(!items.length) return '';
      const n = items.filter(i => have(i[0])).length;
      return `<div class="ingcat"><h4>${l} ${n ? `<span class="pill">${n}</span>` : ''}</h4><div class="chips">${items.map(([k, nm]) => `<button class="chip" data-k="${k}" aria-pressed="${have(k)}">${esc(nm)}${isFreshSeasonal(k) ? '<span class="s">saison</span>' : ''}${!ok(k) ? ' <small>(hors régime)</small>' : ''}</button>`).join('')}</div></div>`;
    }).join('') || '<p class="muted" style="margin-top:16px">Aucun ingrédient trouvé.</p>';
    $('#fList').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      S.fridge = have(k) ? S.fridge.filter(x => x !== k) : [...S.fridge, k];
      S.skip = {}; save();
      b.setAttribute('aria-pressed', have(k));
    });
  };
  draw();
  $('#fq').oninput = e => { fq = e.target.value; draw(); };
  $('#fGo').onclick = () => go('plan');
  $('#fClear').onclick = () => { if(confirm('Décocher tous les ingrédients ?')){ S.fridge = []; save(); draw(); } };
}

/* =========================================================
   VUE : COURSES
   ========================================================= */
function updateBadge(){ const n = S.shop.filter(s => !s.done).length, b = $('#shopBadge'); b.hidden = !n; b.textContent = n; }
function renderShop(){
  const v = $('#v-shop');
  const seasonal = ING.filter(i => i[3] && i[3].includes(month()) && ['leg','fruit'].includes(i[2]) && ok(i[0]));
  v.innerHTML = `
    <h2 class="sec">Ma liste de courses</h2>
    <p class="lead">Les ingrédients manquants de tes repas. Coche au fur et à mesure dans le magasin.</p>
    <div class="shop" id="shopList" style="margin-top:14px">${S.shop.length ? S.shop.map((s,i) => `
      <label class="si ${s.done ? 'done' : ''}"><input type="checkbox" data-i="${i}" ${s.done ? 'checked' : ''}><span>${esc(INGM[s.k] ? INGM[s.k].n : s.k)}<br><span class="from">pour : ${esc(s.from)}</span></span><button data-rm="${i}" aria-label="Retirer">✕</button></label>`).join('') : '<div class="empty">Ta liste est vide. Sur « Ma journée », touche « Ajouter aux courses » sous un repas.</div>'}</div>
    ${S.shop.length ? `<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" id="sShare">📤 Partager / copier</button><button class="btn ghost" id="sDone">Retirer les articles cochés</button><button class="btn ghost" id="sFridge">✓ Cochés → mon frigo</button></div>` : ''}
    <h3 class="sub">💡 Astuces petit budget</h3>
    <div class="card" style="font-size:14px">
      <ul style="padding-left:18px">
        <li>Les <b>légumes surgelés</b> nature sont aussi nutritifs que les frais, souvent moins chers, et ne se perdent pas.</li>
        <li>Les <b>sardines, maquereaux et thon en boîte</b> apportent des oméga-3 pour 1 à 2 €.</li>
        <li><b>Lentilles, pois chiches, haricots secs</b> : les protéines les moins chères qui existent.</li>
        <li>Achète les <b>fruits et légumes de saison</b> : meilleurs, et jusqu'à 2 fois moins chers.</li>
        <li>Cuisine en double le soir pour avoir le déjeuner du lendemain.</li>
      </ul>
    </div>
    <h3 class="sub">🌱 À mettre dans le panier en ${MONTHS[month()-1]}</h3>
    <div class="prod">${seasonal.map(i => `<button class="chip" data-add="${i[0]}">${esc(i[1])}</button>`).join('')}</div>`;
  v.querySelectorAll('[data-i]').forEach(c => c.onchange = () => { S.shop[+c.dataset.i].done = c.checked; save(); updateBadge(); c.closest('.si').classList.toggle('done', c.checked); });
  v.querySelectorAll('[data-rm]').forEach(b => b.onclick = e => { e.preventDefault(); S.shop.splice(+b.dataset.rm, 1); save(); updateBadge(); renderShop(); });
  v.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const k = b.dataset.add; if(!S.shop.some(s => s.k === k)) S.shop.push({k, from:'produit de saison', done:false}); save(); updateBadge(); renderShop(); toast('Ajouté à la liste'); });
  if($('#sShare')) $('#sShare').onclick = async () => {
    const txt = 'Liste de courses :\n' + S.shop.filter(s => !s.done).map(s => '- ' + (INGM[s.k] ? INGM[s.k].n : s.k)).join('\n');
    try{ if(navigator.share){ await navigator.share({title:'Liste de courses', text:txt}); return; } }catch(e){ return; }
    try{ await navigator.clipboard.writeText(txt); toast('Liste copiée'); }catch(e){ toast('Impossible de copier'); }
  };
  if($('#sDone')) $('#sDone').onclick = () => { S.shop = S.shop.filter(s => !s.done); save(); updateBadge(); renderShop(); };
  if($('#sFridge')) $('#sFridge').onclick = () => {
    const done = S.shop.filter(s => s.done).map(s => s.k);
    if(!done.length){ toast('Coche d\'abord ce que tu as acheté'); return; }
    S.fridge = [...new Set([...S.fridge, ...done])]; S.shop = S.shop.filter(s => !s.done); save(); updateBadge(); renderShop(); toast(`${done.length} produit(s) rangé(s) dans ton frigo`);
  };
}

/* =========================================================
   VUE : SAISON & GUIDE
   ========================================================= */
function renderSeason(){
  const m = month(), sea = SEASONS[seasonOf(m)];
  const leg = ING.filter(i => i[2] === 'leg' && i[3] && i[3].includes(m));
  const fr = ING.filter(i => i[2] === 'fruit' && i[3] && i[3].includes(m));
  const nextM = m % 12 + 1, coming = ING.filter(i => i[3] && i[3].includes(nextM) && !i[3].includes(m));
  $('#v-season').innerHTML = `
    <h2 class="sec">${sea.e} De saison en ${MONTHS[m-1]}</h2>
    <p class="lead">${esc(sea.tip)}</p>
    <h3 class="sub">🥕 Légumes</h3><div class="prod">${leg.map(i => `<span class="chip">${esc(i[1])}</span>`).join('')}</div>
    <h3 class="sub">🍎 Fruits</h3><div class="prod">${fr.map(i => `<span class="chip">${esc(i[1])}</span>`).join('') || '<span class="muted">Peu de fruits frais ce mois-ci : pense aux fruits surgelés et aux fruits secs.</span>'}</div>
    ${coming.length ? `<h3 class="sub">🔜 Arrive en ${MONTHS[nextM-1]}</h3><div class="prod">${coming.map(i => `<span class="chip">${esc(i[1])}</span>`).join('')}</div>` : ''}
    <h3 class="sub">🧭 Quoi manger pour…</h3>
    <div class="guide">${Object.values(GOALS).map(g => `<div class="gcard"><h4>${g.e} ${g.n}</h4><p>${esc(g.d)}</p></div>`).join('')}</div>
    <h3 class="sub">⏰ À chaque moment de la journée</h3>
    <div class="guide">
      <div class="gcard"><h4>🌅 Petit-déjeuner</h4><p>Un féculent complet (avoine, pain complet), une protéine (œuf, laitier, oléagineux) et un fruit. Il évite le coup de barre de 11 h.</p></div>
      <div class="gcard"><h4>☀️ Déjeuner</h4><p>La moitié de l'assiette en légumes, un quart de féculents, un quart de protéines. À emporter si la journée est chargée.</p></div>
      <div class="gcard"><h4>🍏 Collation</h4><p>Un fruit et une poignée d'oléagineux, ou un laitier. Utile pour les enfants, les ados, les sportifs et les longues journées.</p></div>
      <div class="gcard"><h4>🌙 Dîner</h4><p>Plutôt léger et digeste pour bien dormir : légumes, une protéine, un peu de féculents (plus si tu as fait du sport).</p></div>
      <div class="gcard"><h4>💧 Toute la journée</h4><p>De l'eau régulièrement : même une petite déshydratation fait baisser la concentration.</p></div>
    </div>
    <h3 class="sub">📚 Toutes les recettes (${RECIPES.length})</h3>
    <div class="chips" id="bF">${[['all','Toutes'],['fav','♥ Favoris'],...MOMENTS.map(x => [x.id, x.e+' '+x.n])].map(([k,l]) => `<button class="chip" data-b="${k}" aria-pressed="${k === browseF}">${l}</button>`).join('')}</div>
    <div class="rlist" id="bList" style="margin-top:10px"></div>`;
  $('#v-season').querySelectorAll('[data-b]').forEach(b => b.onclick = () => { browseF = b.dataset.b; renderSeason(); });
  const list = RECIPES.filter(r => browseF === 'all' || (browseF === 'fav' ? S.favs.includes(r.id) : r.m.includes(browseF)));
  $('#bList').innerHTML = list.length ? list.map(r => { const a = analyse(r); return `<button class="rrow" data-open="${r.id}"><span class="e">${r.e}</span><span class="b"><b>${esc(r.n)}</b><span>⏱️ ${r.t} min · 💶 ~${euro(r.c)} · ${r.g.map(g => GOALS[g].e).join(' ')}${a ? ` · 🧊 ${a.haveN}/${a.total}` : ' · hors régime'}</span></span><span class="muted">›</span></button>`; }).join('') : '<div class="empty">Aucune recette ici pour l\'instant.</div>';
  $('#bList').querySelectorAll('[data-open]').forEach(b => b.onclick = () => openRecipe(b.dataset.open));
}
let browseF = 'all';
function openRecipe(id){
  const r = RECIPES.find(x => x.id === id), a = analyse(r) || analyseLoose(r);
  $('#sheet').innerHTML = `<div style="display:flex;justify-content:flex-end"><button class="x" data-close aria-label="Fermer">✕</button></div>${mealCard({r, a}, null, 0, 1)}`;
  $('#scrim').classList.add('on');
  $('#sheet').querySelector('[data-close]').onclick = closeSheet;
  bindMealCards($('#sheet'));
}
function analyseLoose(r){
  const slots = r.r.map(alts => { const got = alts.find(have); return {alts, use: got || alts[0], have: !!got}; });
  return {slots, opts: r.o, haveN: slots.filter(s => s.have).length, total: slots.length, missing: slots.filter(s => !s.have).map(s => s.use)};
}
function closeSheet(){ $('#scrim').classList.remove('on'); }
$('#scrim').addEventListener('click', e => { if(e.target.id === 'scrim') closeSheet(); });
addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

/* =========================================================
   VUE : PROFIL
   ========================================================= */
function renderMe(){
  const v = $('#v-me');
  v.innerHTML = `
    <h2 class="sec">Mon profil</h2>
    <p class="lead">Ces réglages adaptent les portions, le temps de préparation et le budget des repas proposés.</p>
    <label class="f">Âge</label>
    <div class="chips" id="mAge">${AGES.map(a => `<button class="chip" data-v="${a.id}" aria-pressed="${a.id === S.age}">${esc(a.n)}</button>`).join('')}</div>
    <p class="muted" style="font-size:13px;margin-top:8px">💡 ${esc(ageOf().tip)}</p>
    <label class="f">Nombre de personnes</label>
    <div class="stepper"><button id="pM" aria-label="Moins">−</button><b id="pN">${S.persons}</b><button id="pP" aria-label="Plus">+</button></div>
    <label class="f">Temps de préparation maximum</label>
    <div class="chips" id="mTime">${[10,20,30,45,60].map(t => `<button class="chip" data-v="${t}" aria-pressed="${t === S.time}">${t === 60 ? '1 h et +' : t + ' min'}</button>`).join('')}</div>
    <label class="f">Budget par portion</label>
    <div class="chips" id="mBud">${[[1,'≤ 1 € (serré)'],[2,'≤ 2 €'],[3,'≤ 3 €'],[5,'Pas de limite']].map(([b,l]) => `<button class="chip" data-v="${b}" aria-pressed="${b === S.budget}">${l}</button>`).join('')}</div>
    <label class="f">Régime / allergies</label>
    <div class="chips" id="mDiet">${DIETS.map(d => `<button class="chip" data-v="${d.id}" aria-pressed="${S.diet.includes(d.id)}">${esc(d.n)}</button>`).join('')}</div>
    <label class="f">Saison</label>
    <div class="chips" id="mSea"><button class="chip" data-v="" aria-pressed="${!S.seasonOverride}">Automatique (${SEASONS[seasonOf(month())].n.toLowerCase()})</button>${Object.entries(SEASONS).map(([k,s]) => `<button class="chip" data-v="${k}" aria-pressed="${S.seasonOverride === k}">${s.e} ${s.n}</button>`).join('')}</div>
    <h3 class="sub">♥ Mes favoris</h3>
    <div class="rlist">${S.favs.length ? S.favs.map(id => RECIPES.find(r => r.id === id)).filter(Boolean).map(r => `<button class="rrow" data-open="${r.id}"><span class="e">${r.e}</span><span class="b"><b>${esc(r.n)}</b><span>⏱️ ${r.t} min · 💶 ~${euro(r.c)}</span></span><span class="muted">›</span></button>`).join('') : '<div class="empty">Touche ♡ sur un repas pour le retrouver ici.</div>'}</div>
    <p class="disc">🔒 Tout reste sur ton téléphone. Les conseils sont généraux : en cas d'allergie, de grossesse, de maladie chronique ou de régime médical, demande l'avis d'un professionnel de santé.</p>`;
  const set = (sel, key, conv = x => x) => v.querySelectorAll(sel + ' .chip').forEach(b => b.onclick = () => { S[key] = conv(b.dataset.v); S.skip = {}; save(); renderMe(); renderHeader(); });
  set('#mAge', 'age'); set('#mTime', 'time', Number); set('#mBud', 'budget', Number); set('#mSea', 'seasonOverride', x => x || null);
  v.querySelectorAll('#mDiet .chip').forEach(b => b.onclick = () => { const d = b.dataset.v; S.diet = S.diet.includes(d) ? S.diet.filter(x => x !== d) : [...S.diet, d]; S.skip = {}; save(); renderMe(); });
  $('#pM').onclick = () => { S.persons = Math.max(1, S.persons - 1); save(); renderMe(); };
  $('#pP').onclick = () => { S.persons = Math.min(12, S.persons + 1); save(); renderMe(); };
  v.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openRecipe(b.dataset.open));
}

/* =========================================================
   NAVIGATION
   ========================================================= */
let view = 'plan';
function go(v){
  view = v;
  document.querySelectorAll('nav.tabs button').forEach(b => b.dataset.v === v ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  document.querySelectorAll('section.view').forEach(s => s.classList.toggle('on', s.id === 'v-'+v));
  ({plan:renderPlan, frigo:renderFrigo, shop:renderShop, season:renderSeason, me:renderMe})[v]();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => go(b.dataset.v));
function renderHeader(){ const s = SEASONS[season()]; $('#hSeason').textContent = `${s.e} ${s.n} · ${MONTHS[month()-1]}`; }
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

renderHeader(); updateBadge(); go('plan');
</script>
</body>
</html>
