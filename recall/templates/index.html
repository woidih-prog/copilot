<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recall 3.0</title><style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;color:#222}.wrap{max-width:1050px;margin:auto;padding:22px}h1{margin:0}.top{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input{flex:1;min-width:220px;padding:14px;border:1px solid #ccc;border-radius:8px;font-size:16px}button,.btn{padding:12px 16px;border:0;border-radius:8px;background:#222;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.card{background:#fff;padding:16px;margin:10px 0;border-radius:10px;box-shadow:0 1px 3px #ddd}.meta{font-size:13px;color:#666;margin:8px 0}.title{font-weight:bold;font-size:17px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.secondary{background:#eee;color:#222}.mail{border-left:5px solid #777}.file{border-left:5px solid #444}.empty{padding:30px;text-align:center;color:#777}.snip{font-size:14px;color:#333;margin-top:6px;white-space:pre-wrap;max-height:4.5em;overflow:hidden}.person{cursor:pointer;border-left:5px solid #2a6}.tag{font-size:12px;background:#eee;border-radius:12px;padding:4px 8px;margin-right:5px}
</style></head><body><div class="wrap"><h1>Recall <small>V3.0</small></h1><p>Recherche, classement et ouverture directe des documents.</p>
<div class="top"><input id="q" placeholder="Ex. facture Boulanger, Lucas, PDF..." onkeydown="if(event.key==='Enter')go()"><button onclick="go()">Rechercher</button><a class="btn secondary" href="/auth/gmail/add">+ Gmail</a><label class="btn secondary">Importer WhatsApp<input type="file" id="up" accept=".zip" hidden onchange="upload(this.files[0])"></label></div>
<div class="filters"><button class="secondary" onclick="setQ('pdf')">📄 Tous les PDF</button><button class="secondary" onclick="setQ('fathom')">🔗 Fathom</button><button class="secondary" onclick="setKind('fichier')">📁 Fichiers</button><button class="secondary" onclick="setKind('mail')">📧 Emails</button><button class="secondary" onclick="peopleView()">👤 Personnes</button></div>
<div id="accounts"></div><div id="res" class="empty">Recherche un document, une facture, un contact ou un lien.</div></div>
<script>
let currentKind='';
async function accounts(){let d=await fetch('/api/gmail/accounts').then(r=>r.json()); document.getElementById('accounts').innerHTML=d.accounts.length?'<p>📧 '+d.accounts.map(x=>x.email).join(' · ')+'</p>':''}accounts();
function setQ(x){q.value=x;currentKind='';go()}function setKind(x){currentKind=x;go()}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function go(){let query=q.value.trim();let url='/api/search?q='+encodeURIComponent(query)+'&kind='+encodeURIComponent(currentKind);let d=await fetch(url).then(r=>r.json());let r=document.getElementById('res');if(!d.results.length){r.className='empty';r.textContent='Aucun résultat trouvé.';return}r.className='';r.innerHTML='<h2>'+d.count+' résultat(s)</h2>'+d.results.map(x=>card(x)).join('')}
function card(x){let title=x.filename||x.subject||x.url||x.sender||'Sans titre';let date=x.date||'Date inconnue';let meta=[x.source,date,x.sender,x.subject,x.conversation].filter(Boolean).join(' · ');let snip=(x.kind==='mail'||x.kind==='message')&&x.text?'<div class="snip">'+esc(x.text.slice(0,300))+'</div>':'';let actions='';if(x.kind==='fichier')actions='<div class="actions"><a class="btn" target="_blank" href="/api/file/'+x.file_id+'">👁 Ouvrir</a><a class="btn secondary" href="/api/file/'+x.file_id+'?download=true">⬇ Télécharger</a></div>';if(x.kind==='lien')actions='<div class="actions"><a class="btn" target="_blank" href="'+esc(x.url)+'">Ouvrir le lien</a></div>';return '<div class="card '+(x.kind==='fichier'?'file':'mail')+'"><span class="tag">'+esc(x.kind)+'</span><span class="tag">'+esc(x.source)+'</span><div class="title">'+esc(title)+'</div><div class="meta">'+esc(meta)+'</div>'+snip+actions+'</div>'}
async function peopleView(){let d=await fetch('/api/people?q='+encodeURIComponent(q.value.trim())).then(r=>r.json());let r=document.getElementById('res');if(!d.people.length){r.className='empty';r.textContent='Aucune personne trouvée.';return}r.className='';r.innerHTML='<h2>'+d.count+' personne(s)</h2>'+d.people.map(p=>'<div class="card person" data-k="'+esc(p.key)+'" onclick="personView(this.dataset.k)"><div class="title">'+esc(p.name)+'</div><div class="meta">'+p.count+' élément(s) · '+esc(p.sources.join(', '))+' · dernier : '+esc(p.last||'?')+'</div></div>').join('')}
async function personView(k){let d=await fetch('/api/person?key='+encodeURIComponent(k)).then(r=>r.json());let r=document.getElementById('res');r.className='';r.innerHTML='<p><button class="secondary" onclick="peopleView()">← Personnes</button></p><h2>'+esc(d.name)+' · '+d.count+' élément(s)</h2><p><button disabled title="Arrive avec la clé API">🧠 Synthèse IA (bientôt)</button></p>'+d.results.map(x=>card(x)).join('')}
async function upload(f){if(!f)return;let fd=new FormData();fd.append('file',f);await fetch('/api/import',{method:'POST',body:fd});alert('Import terminé');}
</script></body></html>
