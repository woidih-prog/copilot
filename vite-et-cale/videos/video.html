<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vite & Calé : vidéos</title>
<!-- Vidéos verticales 1080 × 1920 pour TikTok, Reels et Shorts.
     ?v=1, 2 ou 3 choisit la vidéo. window.seek(ms) place l'animation à un instant donné :
     rendu.js s'en sert pour prendre les images une par une. Sans rendu.js, la page se joue en boucle. -->
<style>
@font-face{font-family:"Bricolage";src:url(fonts/bricolage-800.woff2) format("woff2");font-weight:800}
@font-face{font-family:"Figtree";src:url(fonts/figtree.woff2) format("woff2");font-weight:300 900}
:root{--bg:#F1F4EC;--ink:#1B251E;--leaf:#2D774A;--leaf-soft:#E2EEE4;--squash:#B8650F;--squash-soft:#F7EAD9;--muted:#5A685F}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--leaf)}
body{font-family:"Figtree",sans-serif;color:var(--ink);position:relative}
.scene{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  /* zones gardées libres pour les boutons de TikTok : haut 220, bas 400, droite 150 */
  padding:220px 150px 400px 80px;text-align:center}
.vert{background:var(--leaf);color:#fff}
.clair{background:var(--bg)}
.sombre{background:var(--ink);color:#fff}
h1{font:800 132px/1.02 "Bricolage",sans-serif;letter-spacing:-.02em;text-wrap:balance}
h2{font:800 92px/1.05 "Bricolage",sans-serif;letter-spacing:-.02em;text-wrap:balance}
.sur{font:700 36px/1.2 "Figtree";letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:36px}
.sous{font:500 50px/1.3 "Figtree";margin-top:40px;text-wrap:balance}
.mot{display:inline-block;opacity:0;animation:mot .45s cubic-bezier(.2,1.4,.4,1) both}
.jaune{color:#FFD98A}
.orange{color:var(--squash)}
.vertt{color:var(--leaf)}
@keyframes mot{from{opacity:0;transform:translateY(60px) scale(.85)}to{opacity:1;transform:none}}
@keyframes entre{from{opacity:0}to{opacity:1}}
@keyframes sort{to{opacity:0}}
@keyframes monte{from{opacity:0;transform:translateY(420px) rotate(4deg)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes glisse{from{transform:translateY(0)}to{transform:translateY(var(--dy,-260px))}}
@keyframes barre{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* téléphone */
.tel{width:600px;height:1140px;border-radius:64px;background:#101512;padding:16px;box-shadow:0 40px 90px rgba(0,0,0,.35);
  opacity:0;animation:monte .8s cubic-bezier(.2,.9,.3,1) both;flex:none;position:relative}
.tel .ecran{width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--bg)}
.tel img{width:100%;display:block;animation:glisse 3.2s ease-in-out both}
.avec-tel{justify-content:flex-start;padding-top:230px}
.avec-tel h2{font-size:76px;margin-bottom:44px}
.puce{position:absolute;background:#fff;color:var(--ink);font:700 40px/1.15 "Figtree";padding:22px 30px;border-radius:28px;
  box-shadow:0 14px 40px rgba(0,0,0,.25);opacity:0;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both;text-align:left;white-space:nowrap}
.puce b{font:800 56px/1 "Bricolage";display:block;color:var(--squash)}
.puce.v b{color:var(--leaf)}

/* gros chiffre */
.chiffre{font:800 250px/1 "Bricolage";letter-spacing:-.03em;color:var(--squash);white-space:nowrap}
.chiffre small{font-size:120px}
.trait{width:520px;height:14px;border-radius:7px;background:var(--leaf);margin:44px 0 0;transform-origin:left;animation:barre .7s ease-out both}
.liste{margin-top:56px;display:grid;gap:26px;text-align:left}
.liste div{font:600 54px/1.2 "Figtree";opacity:0;animation:mot .45s cubic-bezier(.2,1.4,.4,1) both;display:flex;gap:24px;align-items:center}
.liste i{flex:none;width:68px;height:68px;border-radius:50%;background:var(--leaf);color:#fff;font:800 40px/68px "Bricolage";text-align:center;font-style:normal}
.note{position:absolute;left:80px;right:150px;bottom:420px;font:500 30px/1.3 "Figtree";opacity:.6}

/* fin */
.logo{width:260px;height:260px;border-radius:58px;box-shadow:0 24px 60px rgba(0,0,0,.3);opacity:0;animation:pop .6s cubic-bezier(.2,1.5,.4,1) both}
.nom{font:800 128px/1 "Bricolage";letter-spacing:-.02em;margin-top:48px}
.nom .et .mot{color:#8FDCAE}
.bouton{margin-top:60px;background:#fff;color:var(--leaf);font:800 60px/1 "Bricolage";padding:36px 60px;border-radius:999px;
  opacity:0;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both, bat 1.2s ease-in-out infinite}
</style>
</head>
<body>
<script>
const V = new URLSearchParams(location.search).get("v") || "1";

/* Les chiffres viennent des captures de decouvrir/img (semaine d'exemple pour 2 personnes). */
const VIDEOS = {
  "1": { duree: 13000, scenes: [
    { de:0, a:3000, cls:"vert", html: sur("Fin de mois ?") + mots("h1", "Manger toute la semaine pour |59 €| à deux ?") },
    { de:3000, a:7200, cls:"clair avec-tel", html: `<h2>${motsBruts("L'appli te fait ta semaine.", 3200)}</h2>` +
        tel("semaine.jpg", 3300, "-28px") +
        puce("left:60px;top:900px", 4300, "<b>7 jours</b>3 repas par jour", "v") +
        puce("right:170px;top:1180px", 5000, "<b>1,97 €</b>l'assiette") },
    { de:7200, a:10400, cls:"clair", html: sur("La semaine pour 2") + `<div class="chiffre" data-compte="59.43" data-de="7400" data-a="8600">0 €</div><div class="trait" style="animation-delay:7.5s"></div>` +
        liste(8300, ["84 g de protéines par jour", "46 min de cuisine par jour", "Des produits de saison"]) +
        `<div class="note">Exemple de semaine dans l'appli, prix relevés en magasin (Open Prices).</div>` },
    fin(10400, 13000, "Ta semaine de repas, sans te ruiner.")
  ]},
  "2": { duree: 13000, scenes: [
    { de:0, a:3000, cls:"sombre", html: sur("Arrête de payer plein pot") + mots("h1", "Les |promos| de ton quartier, en |direct.|") },
    { de:3000, a:7200, cls:"vert avec-tel", html: `<h2>${motsBruts("Repérées en magasin par tes voisins.", 3200)}</h2>` +
        tel("promos.jpg", 3300, "-28px") +
        puce("left:60px;top:880px", 4300, "<b>43 promos</b>à 20 km de Paris") +
        puce("right:170px;top:1200px", 5000, "<b>En direct</b>mises à jour chaque minute", "v") },
    { de:7200, a:10400, cls:"clair", html: mots("h2", "Tu vois une promo ? |Photo.| C'est partagé.", 7400) +
        liste(8400, ["Tu prends l'étiquette en photo", "Tes voisins la voient aussitôt", "Ta semaine se refait avec"]) },
    fin(10400, 13000, "Les bons plans du coin, dans ta poche.")
  ]},
  "3": { duree: 13000, scenes: [
    { de:0, a:3000, cls:"vert", html: sur("Qu'est-ce qu'on mange ce soir ?") + mots("h1", "Plus jamais cette |question.|") },
    { de:3000, a:7200, cls:"clair avec-tel", html: `<h2>${motsBruts("Ta liste de courses, déjà prête.", 3200)}</h2>` +
        tel("courses.jpg", 3300, "-28px") +
        puce("left:60px;top:900px", 4300, "<b>Par rayon</b>tu coches en magasin", "v") +
        puce("right:170px;top:1190px", 5000, "<b>51,71 €</b>le total, avant d'y aller") },
    { de:7200, a:10400, cls:"sombre", html: mots("h2", "Tu choisis, l'appli |s'adapte.|", 7400) +
        liste(8200, ["Ton budget", "Ton magasin", "Ton four ou ton air fryer", "Tes allergies et tes goûts"]) },
    fin(10400, 13000, "Des repas qui calent, à petit budget.")
  ]}
};

function sur(t){ return `<div class="sur">${t}</div>`; }
/* « |mot| » : mis en couleur. Les mots arrivent un par un à partir de t0 (ms depuis le début de la vidéo). */
function motsBruts(txt, t0, pas=110){
  let surligne=false, i=0;
  return txt.split("|").map(bloc=>{
    const out = bloc.split(" ").filter(Boolean).map(m=>`<span class="mot${surligne?" coul":""}" style="animation-delay:${((t0||300)+(i++)*pas)/1000}s">${m}</span>`).join(" ");
    surligne=!surligne; return out;
  }).join(" ");
}
function mots(tag, txt, t0){ return `<${tag}>${motsBruts(txt, t0)}</${tag}>`; }
function tel(img, t0, dy){ return `<div class="tel" style="animation-delay:${t0/1000}s"><div class="ecran"><img src="../decouvrir/img/${img}" style="--dy:${dy};animation-delay:${(t0+900)/1000}s" alt=""></div></div>`; }
function puce(pos, t0, html, cls=""){ return `<div class="puce ${cls}" style="${pos};animation-delay:${t0/1000}s">${html}</div>`; }
function liste(t0, items){ return `<div class="liste">`+items.map((x,i)=>`<div style="animation-delay:${(t0+i*350)/1000}s"><i>✓</i>${x}</div>`).join("")+`</div>`; }
function fin(de, a, phrase){ return { de, a, cls:"vert", fin:true, html:
  `<img class="logo" src="../icon-512.png" style="animation-delay:${(de+150)/1000}s" alt="">`+
  `<div class="nom">${motsBruts("Vite", de+450)} <span class="et">${motsBruts("&", de+560)}</span> ${motsBruts("Calé", de+670)}</div>`+
  `<div class="sous">${motsBruts(phrase, de+900, 70)}</div>`+
  `<div class="bouton" style="animation-delay:${(de+1500)/1000}s, ${(de+2000)/1000}s">Lien en bio</div>` }; }

const video = VIDEOS[V];
video.scenes.forEach((s,i)=>{
  const d = document.createElement("section");
  d.className = "scene "+s.cls;
  const fondu = i===0 ? "0s" : ".35s";
  d.style.animation = `entre ${fondu} both ${s.de/1000}s`;   // la scène suivante vient par-dessus : pas de trou entre deux scènes
  d.style.zIndex = i+1;
  d.innerHTML = s.html;
  document.body.appendChild(d);
});
document.querySelectorAll(".vert .coul,.sombre .coul").forEach(e=>e.classList.add("jaune"));
document.querySelectorAll(".clair .coul").forEach(e=>e.classList.add("orange"));

const euros = n => n.toFixed(2).replace(".", ",");
function compteurs(ms){
  document.querySelectorAll("[data-compte]").forEach(e=>{
    const de=+e.dataset.de, a=+e.dataset.a, but=+e.dataset.compte;
    const p = Math.min(1, Math.max(0, (ms-de)/(a-de))), doux = 1-Math.pow(1-p,3);
    const [ent, dec] = euros(but*doux).split(",");
    e.innerHTML = `${ent}<small>,${dec} €</small>`;
  });
}
window.DUREE = video.duree;
window.seek = ms => { document.getAnimations().forEach(a=>{ a.pause(); a.currentTime = ms; }); compteurs(ms); };

if(!new URLSearchParams(location.search).has("rendu")){   // lecture en boucle pour regarder dans le navigateur
  const t0 = performance.now();
  (function boucle(){ window.seek((performance.now()-t0) % video.duree); requestAnimationFrame(boucle); })();
}
</script>
</body>
</html>
