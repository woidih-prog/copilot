<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vite &amp; Calé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Une semaine de repas qui calent, à petit budget, de saison et presque sans cuisine.">
<meta name="theme-color" content="#2D774A">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : appli mobile, une colonne de 640px max, barre d'onglets fixée en bas, fiches en panneau qui monte. */
:root{
  --bg:#F1F4EC; --surface:#FFFFFF; --ink:#1B251E; --muted:#5A685F; --line:#D6DDD1;
  --leaf:#2D774A; --leaf-soft:#E2EEE4; --squash:#B8650F; --squash-soft:#F7EAD9; --warn:#A33A2A; --warn-soft:#F6E1DC;
  --plate:#FFFFFF; --plate-line:#DCE2D8; --pic-bg:#E7ECE2; --scrim:rgba(20,28,22,.45);
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Figtree',ui-sans-serif,system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#18201B; --ink:#E4ECE6; --muted:#93A399; --line:#29342D;
  --leaf:#6DC290; --leaf-soft:#1E3226; --squash:#E7A15C; --squash-soft:#352818; --warn:#F08A78; --warn-soft:#3A221D;
  --plate:#EDEFEA; --plate-line:#3A463E; --pic-bg:#202A23; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#18201B; --ink:#E4ECE6; --muted:#93A399; --line:#29342D;
  --leaf:#6DC290; --leaf-soft:#1E3226; --squash:#E7A15C; --squash-soft:#352818; --warn:#F08A78; --warn-soft:#3A221D;
  --plate:#EDEFEA; --plate-line:#3A463E; --pic-bg:#202A23; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--leaf)}
h2{font-size:21px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--leaf);outline-offset:2px}
.page{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* Boutons et choix */
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:700;background:var(--leaf);color:var(--surface)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 14px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14.5px;text-align:left;display:flex;flex-direction:column;gap:1px}
.opt small{font-weight:400;color:var(--muted);font-size:12.5px}
.opt[aria-pressed=true]{border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf)}
.opt.no[aria-pressed=true]{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.field{display:flex;flex-direction:column;gap:10px}
.field + .field{margin-top:22px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.stepper b{font-family:var(--f-display);font-size:28px;min-width:2ch;text-align:center}
input[type=range]{width:100%;accent-color:var(--leaf)}
input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.rangeval{font-family:var(--f-display);font-size:28px;font-weight:800}
.hint{font-size:13px;color:var(--muted)}

/* Onboarding */
#onb{min-height:100%;display:flex;flex-direction:column;padding-block:24px 28px;gap:22px}
.dots{display:flex;gap:6px}
.dots i{height:5px;flex:1;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--leaf)}
.onb-body{display:flex;flex-direction:column;gap:6px}
.onb-body > p{color:var(--muted);max-width:52ch}
.onb-nav{display:flex;gap:10px;justify-content:space-between;margin-top:auto;padding-top:12px}
.hero-plate{width:min(240px,60vw);margin:8px auto 4px}

/* En-tête de l'appli */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.top .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:24px}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:5px 11px;background:var(--leaf-soft);color:var(--leaf);white-space:nowrap}
.pill.over{background:var(--warn-soft);color:var(--warn)}
main{padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--leaf)}

/* Résumé semaine */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:1 1 0;min-width:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.days button b{font-size:14px}
.days button span{font-size:10.5px;color:var(--muted)}
.days button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.days button[aria-pressed=true] span{color:var(--bg);opacity:.75}
.daytotal{display:flex;justify-content:space-between;align-items:baseline}

.meal{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 10px}
.meal .pic{width:72px;height:72px;border:0;padding:0;background:transparent}
.meal .txt{min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.meal .open{border:0;background:transparent;padding:0;text-align:left;font-weight:600;font-size:15.5px;line-height:1.3}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.meta .p{color:var(--leaf);font-weight:700}
.meta .c{color:var(--squash);font-weight:700}
.meal .swap{margin-top:4px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf)}
.tag.fun{background:var(--squash-soft);color:var(--squash)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card ul,.card ol{margin:0;padding-left:20px}
.banner{border-radius:12px;padding:10px 14px;font-size:14px;background:var(--warn-soft);color:var(--warn)}

/* Courses */
.group{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group h3{padding:12px 14px 6px;font-size:12px;font-family:var(--f-body);font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.item{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.item input{width:20px;height:20px;accent-color:var(--leaf);margin:0}
.item .nm{min-width:0}
.item .nm small{display:block;color:var(--muted);font-size:12px}
.item .pr{font-family:var(--f-mono);font-size:13px}
.item.done .nm,.item.done .pr{text-decoration:line-through;color:var(--muted)}
.totalbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.totalbar b{font-family:var(--f-mono);font-size:18px}
.season{display:flex;flex-wrap:wrap;gap:6px}
.season span{font-size:13px;background:var(--leaf-soft);color:var(--leaf);border-radius:999px;padding:3px 10px}

/* Plats */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;padding:0;text-align:left}
.dish .dpic{position:relative;background:var(--pic-bg);padding:12px;display:flex;justify-content:center}
.dish .dpic svg{width:100%;max-width:150px;height:auto;aspect-ratio:1}
.dish .badge{position:absolute;top:8px;right:8px;background:var(--ink);color:var(--bg);font-weight:700;font-size:12.5px;border-radius:999px;padding:2px 9px}
.dish .body{padding:9px 11px 11px;display:flex;flex-direction:column;gap:2px}
.dish .body b{font-weight:600;line-height:1.3;font-size:14.5px}
.dish .body span{font-size:12.5px;color:var(--muted)}
.dish .body .price{color:var(--squash);font-weight:700;font-size:14.5px}

/* Panneau (fiche recette, échange) */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:5px;border-radius:4px;background:var(--line);margin:0 auto}
.sheet .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet .x{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:36px;height:36px;flex:none;font-size:18px;line-height:1}
.sheet .big{width:min(220px,62vw);margin:0 auto}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.facts b{display:block;font-family:var(--f-display);font-size:17px}
.facts span{font-size:11px;color:var(--muted)}
.alt{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left}
.alt svg{width:52px;height:52px}
.alt .c{color:var(--squash);font-weight:700;font-variant-numeric:tabular-nums}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.srow .nm small{display:block;color:var(--muted);font-size:12px}
.srow.has .nm{font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;line-height:1}
.qty span{min-width:58px;text-align:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.srow.has .qty span{color:var(--leaf);font-weight:700}
.qty button:disabled{opacity:.35;cursor:default}
.saving{background:var(--leaf-soft);color:var(--leaf);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.plate-rim{fill:var(--plate)} .plate-edge{fill:none;stroke:var(--plate-line);stroke-width:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600}
.foot{font-size:12px;color:var(--muted)}
@media (min-width:600px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px)}to{transform:none}}}
</style>
</head>

<script>
/* ---------- Ingrédients : conditionnement acheté et prix indicatif (discount, métropole) ---------- */
const ING = {
  avoine:{n:"Flocons d'avoine",u:"g",size:500,price:0.95,pk:"500 g"},

  soupe:{n:"Soupe de légumes",u:"ml",size:1000,price:1.40,pk:"brique 1 L"},

  fruit:{n:"Fruits de saison",u:"pc",size:1,price:0.30,pk:"à la pièce",kind:"saison"},
  leg:{n:"Légumes de saison à croquer",u:"g",size:500,price:1.00,pk:"500 g",kind:"saison"}
};

/* ---------- Recettes : une portion. kcal et protéines approximatifs. ---------- */
const R = [
 // Matin
 {id:"m1",slot:"matin",n:"Porridge banane au micro-ondes",t:3,cook:"micro-ondes",kcal:405,p:16,tags:["lait"],

 {id:"m2",slot:"matin",n:"Fromage blanc, flocons, fruit et cacahuètes",t:2,cook:"aucune",kcal:370,p:24,tags:["lait"],

 {id:"m3",slot:"matin",n:"Tartines complètes et œufs brouillés minute",t:4,cook:"micro-ondes",kcal:380,p:21,tags:["oeuf"],

  steps:["Bats 2 œufs dans un bol avec sel et poivre.","1 min au micro-ondes, remue, encore 30 s.","Sur les tartines, avec un fruit à côté."]},
 {id:"m4",slot:"matin",n:"Yaourts nature, banane et cacahuètes",t:1,cook:"aucune",kcal:360,p:14,tags:["lait"],
  ing:[["yaourt",2],["banane",1],["noix",20]],
  steps:["Tu ouvres, tu coupes la banane, tu manges."]},

 // Midi et soir
 {id:"r1",slot:"repas",n:"Salade thon, pois chiches et crudités",t:5,cook:"aucune",kcal:495,p:40,tags:["poisson"],
  ing:[["thon",1],["pchiche",0.5],["leg",150],["pain",1]],
  steps:["Égoutte le thon et les pois chiches.","Ajoute les crudités coupées.","Huile, vinaigre, sel, poivre. Le reste des pois chiches pour demain."]},
 {id:"r2",slot:"repas",n:"Pâtes au thon et à la tomate",t:12,cook:"casserole",kcal:510,p:42,tags:["poisson"],
  ing:[["pates",100],["thon",1],["tomate",150]],
  steps:["Cuis les pâtes (10 min).","Égoutte, ajoute tomates concassées et thon.","Herbes de Provence, poivre. 1 min sur le feu."]},
 {id:"r3",slot:"repas",n:"Omelette aux légumes surgelés et pain",t:10,cook:"poêle",kcal:530,p:35,tags:["oeuf","lait"],
  ing:[["oeuf",3],["surg",200],["fromage",20],["pain",2]],
  steps:["Légumes surgelés 5 min à la poêle avec un filet d'huile.","Verse les 3 œufs battus et le fromage.","Couvre 3 min. Avec 2 tranches de pain."]},
 {id:"r4",slot:"repas",n:"Wraps maquereau et crudités",t:5,cook:"aucune",kcal:515,p:31,tags:["poisson","lait"],
  ing:[["tortilla",2],["maq",1],["leg",100],["fb",50]],
  steps:["Étale du fromage blanc sur les tortillas.","Émiette le maquereau, ajoute les crudités.","Roule. C'est prêt."]},
 {id:"r5",slot:"repas",n:"Dahl de lentilles corail et riz",t:20,cook:"casserole",kcal:665,p:27,tags:[],

let plateN=0;
function plateSVG(id){
  const parts=VIZ[id]||[["veg",1]]; const rand=rng([...id].reduce((a,c)=>a*31+c.charCodeAt(0),7));
  const uid="pl"+(plateN++); const R0=38, C=50;
  const tot=parts.reduce((s,x)=>s+x[1],0); let a=-Math.PI/2-0.4;
  let out='<svg viewBox="0 0 100 100" role="img" aria-hidden="true" class="plate"><defs>';
  const wedges=parts.map(([k,w],i)=>{ const a0=a, a1=a+w/tot*Math.PI*2; a=a1; return {k,a0,a1,i}; });
  wedges.forEach(W=>{ if(parts.length===1){ out+='<clipPath id="'+uid+W.i+'"><circle cx="50" cy="50" r="'+R0+'"/></clipPath>'; return; }
    const x0=C+R0*Math.cos(W.a0),y0=C+R0*Math.sin(W.a0),x1=C+R0*Math.cos(W.a1),y1=C+R0*Math.sin(W.a1);
    out+='<clipPath id="'+uid+W.i+'"><path d="M50 50L'+x0.toFixed(2)+' '+y0.toFixed(2)+'A'+R0+' '+R0+' 0 '+((W.a1-W.a0)>Math.PI?1:0)+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+'Z"/></clipPath>'; });
  out+='</defs><circle cx="51" cy="52.5" r="48" fill="#000" opacity=".12"/><circle class="plate-rim" cx="50" cy="50" r="48"/><circle class="plate-edge" cx="50" cy="50" r="41.5"/>';
  wedges.forEach(W=>{ const f=FOOD[W.k]||FOOD.veg;
    out+='<g clip-path="url(#'+uid+W.i+')"><circle cx="50" cy="50" r="'+R0+'" fill="'+f.b+'"/>';
    const span=W.a1-W.a0;
    f.bits.forEach(([shape,cols,n,sz])=>{
      const count=Math.max(1,Math.round(n*Math.min(1,span/(Math.PI*2)*2.2)));
      for(let j=0;j<count;j++){
        const ang=W.a0+rand()*span, rr=Math.sqrt(rand())*(R0-2), x=C+rr*Math.cos(ang), y=C+rr*Math.sin(ang);
        const col=cols[Math.floor(rand()*cols.length)], rot=Math.round(rand()*180);
        const P=(v)=>v.toFixed(1);
        if(shape==="dot") out+='<circle cx="'+P(x)+'" cy="'+P(y)+'" r="'+P(sz*(.75+rand()*.5))+'" fill="'+col+'"/>';
        else if(shape==="grain") out+='<ellipse cx="'+P(x)+'" cy="'+P(y)+'" rx="'+P(sz*1.6)+'" ry="'+P(sz*.75)+'" fill="'+col+'" transform="rotate('+rot+' '+P(x)+' '+P(y)+')"/>';
        else if(shape==="leaf") out+='<ellipse cx="'+P(x)+'" cy="'+P(y)+'" rx="'+P(sz*2)+'" ry="'+P(sz)+'" fill="'+col+'" transform="rotate('+rot+' '+P(x)+' '+P(y)+')"/>';
        else if(shape==="tube") out+='<rect x="'+P(x-sz*1.6)+'" y="'+P(y-sz*.7)+'" width="'+P(sz*3.2)+'" height="'+P(sz*1.4)+'" rx="'+P(sz*.6)+'" fill="'+col+'" transform="rotate('+rot+' '+P(x)+' '+P(y)+')"/>';
        else if(shape==="strip") out+='<rect x="'+P(x-sz*4)+'" y="'+P(y-sz*.5)+'" width="'+P(sz*8)+'" height="'+P(sz)+'" rx="'+P(sz*.5)+'" fill="'+col+'" transform="rotate('+rot+' '+P(x)+' '+P(y)+')"/>';
        else if(shape==="chunk") out+='<rect x="'+P(x-sz)+'" y="'+P(y-sz)+'" width="'+P(sz*2)+'" height="'+P(sz*1.7)+'" rx="'+P(sz*.45)+'" fill="'+col+'" transform="rotate('+rot+' '+P(x)+' '+P(y)+')"/>';
        else if(shape==="slice") out+='<circle cx="'+P(x)+'" cy="'+P(y)+'" r="'+P(sz)+'" fill="'+col+'"/><circle cx="'+P(x)+'" cy="'+P(y)+'" r="'+P(sz*.35)+'" fill="'+f.b+'" opacity=".55"/>';
        else if(shape==="egg") out+='<ellipse cx="'+P(x)+'" cy="'+P(y)+'" rx="'+P(sz)+'" ry="'+P(sz*.78)+'" fill="#FFFFFF"/><circle cx="'+P(x)+'" cy="'+P(y)+'" r="'+P(sz*.42)+'" fill="#F2B526"/>';
        else if(shape==="roll") out+='<rect x="'+P(x-sz*2)+'" y="'+P(y-sz*.8)+'" width="'+P(sz*4)+'" height="'+P(sz*1.6)+'" rx="'+P(sz*.8)+'" fill="'+col+'" transform="rotate('+rot+' '+P(x)+' '+P(y)+')"/><circle cx="'+P(x)+'" cy="'+P(y)+'" r="'+P(sz*.55)+'" fill="#6FAE4E" transform="rotate('+rot+' '+P(x)+' '+P(y)+')"/>';
        else if(shape==="grill"){ out+='<g transform="rotate('+rot+' '+P(x)+' '+P(y)+')"><rect x="'+P(x-sz*2.4)+'" y="'+P(y-sz*.8)+'" width="'+P(sz*4.8)+'" height="'+P(sz*1.6)+'" rx="'+P(sz*.6)+'" fill="'+col+'"/>'+
          [-1,0,1].map(o=>'<line x1="'+P(x+o*sz*1.3-sz*.4)+'" y1="'+P(y-sz*.8)+'" x2="'+P(x+o*sz*1.3+sz*.4)+'" y2="'+P(y+sz*.8)+'" stroke="#8A5A30" stroke-width=".7"/>').join("")+'</g>'; }
      }
    });
    out+='</g>';
  });
  if(parts.length>1) wedges.forEach(W=>{ out+='<line x1="50" y1="50" x2="'+(C+R0*Math.cos(W.a0)).toFixed(2)+'" y2="'+(C+R0*Math.sin(W.a0)).toFixed(2)+'" stroke="#000" stroke-opacity=".12" stroke-width=".6"/>'; });
  return out+'</svg>';
}

function rng(seed){ let a=seed>>>0; return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}; }

function magasin(P){ const l=MAGASINS[P.region]; return l.find(m=>m[0]===P.magasin)||l[0]; }
function price(id,P){
  const g=ING[id]; let p=g.price;
  if(P.region==="re") p*=(g.kind==="saison"||g.kind==="local")?0.9:1.3;
  if(g.kind==="saison" && P.marche) p*=0.85; else p*=magasin(P)[2];
  return p;
}
function mealCost(r,P){ return r.ing.reduce((s,[id,q])=>s+q/ING[id].size*price(id,P),0); }
function interdits(P){
  const ing=new Set(), rec=new Set();
  P.allergies.forEach(a=>{ const A=ALLERGIES.find(x=>x[0]===a); if(A) A[3].forEach(i=>ing.add(i)); (ALLERGIE_RECETTE[a]||[]).forEach(r=>rec.add(r)); });
  P.degouts.forEach(d=>{ const D=DEGOUTS.find(x=>x[0]===d); if(D) D[2].forEach(i=>ing.add(i)); });
  if(P.regime==="sansporc") ing.add("jambon");
  return {ing,rec,tags:P.regime==="vege"?["viande","poisson"]:[]};
}
function permis(r,P,I){
  I=I||interdits(P);
  if(I.rec.has(r.id)) return false;
  if(r.ing.some(([id])=>I.ing.has(id))) return false;
  if(r.tags.some(t=>I.tags.includes(t))) return false;
  if(P.temps==="zero") return ["aucune","micro-ondes","bouilloire"].includes(r.cook);
  return r.t <= +P.temps;
}
function pools(P){ const I=interdits(P); const f=s=>R.filter(r=>r.slot===s && permis(r,P,I)); return {matin:f("matin"),repas:f("repas"),encas:f("encas")}; }
const SLOTS=["matin","midi","soir","encas"];
/* Ce qu'on a déjà (onglet Chez moi) est retiré des achats : l'optimiseur préfère donc les plats qui l'utilisent. */
function ticket(days,P,stock){
  stock=stock||ST.stock||{};
  const use={};
  days.forEach(d=>SLOTS.forEach(k=>{ const r=RID[d[k]]; if(r) r.ing.forEach(([id,q])=>use[id]=(use[id]||0)+q*P.personnes); }));
  const rows=Object.keys(use).map(id=>{ const g=ING[id], have=stock[id]||0, need=Math.max(0,use[id]-have);
    const packs=need>1e-9?Math.ceil(need/g.size-1e-9):0; return {id,used:use[id],have,packs,cost:packs*price(id,P)}; });
  return {rows,total:rows.reduce((s,r)=>s+r.cost,0)};
}
/* Pas plus de 12 œufs par personne et par semaine : l'optimiseur de prix en mettrait partout. */
const OEUFS_MAX=12;
function oeufs(days){ let n=0; days.forEach(d=>SLOTS.forEach(k=>{ const r=RID[d[k]]; if(r) r.ing.forEach(([id,q])=>{ if(id==="oeuf") n+=q; }); })); return n; }
function generer(P,seed){
  const PL=pools(P);
  if(PL.repas.length<2) return {err:"Avec tes allergies, ton régime, tes goûts et ton temps de cuisine, il reste moins de 2 plats pour midi et soir. Autorise 20 minutes de cuisine ou retire un « je n'aime pas »."};
  const rand=rng(seed*7919+MOIS_COURANT*31);
  const pick=a=>a[Math.floor(rand()*a.length)];
  const maxUse=Math.max(3,Math.ceil(14/PL.repas.length));
  let best=null;
  for(let t=0;t<80;t++){
    const count={}, days=[];
    for(let d=0;d<7;d++){
      const day={matin:PL.matin.length?pick(PL.matin).id:null,encas:PL.encas.length?pick(PL.encas).id:null};
      for(const k of ["midi","soir"]){
        let c=PL.repas.filter(r=>(count[r.id]||0)<maxUse && r.id!==day.midi && !(r.fun&&(count[r.id]||0)>=1));
        if(!c.length) c=PL.repas.filter(r=>r.id!==day.midi);
        const r=pick(c); day[k]=r.id; count[r.id]=(count[r.id]||0)+1;
      }
      days.push(day);
    }
    if(t%2===0){
      for(let pass=0;pass<2;pass++) for(let i=0;i<7;i++) for(const k of SLOTS){
        const pl=(k==="midi"||k==="soir")?PL.repas:PL[k]; if(!days[i][k]) continue;
        let cur=ticket(days,P).total; const oeufs0=oeufs(days);
        for(const r of pl){
          const old=days[i][k]; if(r.id===old) continue;
          if(k==="midi"||k==="soir"){ if(r.id===days[i][k==="midi"?"soir":"midi"]) continue; if((count[r.id]||0)>=maxUse||(r.fun&&(count[r.id]||0)>=1)) continue; }
          days[i][k]=r.id; const c=ticket(days,P).total;
          if(c<cur-0.01 && oeufs(days)<=Math.max(OEUFS_MAX,oeufs0)){ cur=c; if(k==="midi"||k==="soir"){ count[old]--; count[r.id]=(count[r.id]||0)+1; } } else days[i][k]=old;
        }
      }
    }
    const tk=ticket(days,P); const distinct=new Set(days.flatMap(d=>[d.midi,d.soir])).size;
    const ok=tk.total<=P.budget; const trop=oeufs(days)>OEUFS_MAX;
    const score=(trop?-1e7:0)+(ok?1e6+distinct*100-tk.total:-tk.total);
    if(!best||score>best.score) best={days,score};
  }
  return {days:best.days};
}
function nouveauPlan(seed){
  const s=seed||Math.floor(Math.random()*1e6)+1;
  const g=generer(ST.profil,s);
  ST.plan=g.err?{err:g.err,seed:s}:{days:g.days,seed:s,cree:Date.now()};
  ST.coches=[]; persist();
}
/* Un plat retiré du profil (allergie ajoutée…) ne doit pas rester dans la semaine. */
function planValide(){
  if(!ST.plan||!ST.plan.days) return false;
  const P=ST.profil, I=interdits(P);
  return ST.plan.days.every(d=>SLOTS.every(k=>!d[k]||(RID[d[k]]&&permis(RID[d[k]],P,I))));
}

function qtyTxt(id,q){ const g=ING[id]; const n=Math.round(q*100)/100;

  if(g.u==="bt") return n===0.5?"½ boîte":(String(n).replace(".",",")+(n>1?" boîtes":" boîte"));
  if(g.u==="tr") return n+(n>1?" tranches":" tranche"); return String(n).replace(".",","); }

function bindForm(container,P,rerender){
  container.onclick=e=>{
    const b=e.target.closest("button"); if(!b||!container.contains(b)) return;
    if(b.dataset.set){ let v=b.dataset.v; if(v==="true"||v==="false") v=(v==="true");
      P[b.dataset.set]=v;
      if(b.dataset.set==="region"){ const l=MAGASINS[P.region]; if(!l.some(m=>m[0]===P.magasin)) P.magasin=l[0][0]; }
      rerender(); }
    else if(b.dataset.toggle){ const a=P[b.dataset.toggle], v=b.dataset.v, i=a.indexOf(v);
      if(i>=0) a.splice(i,1); else a.push(v); rerender(); }
    else if(b.dataset.step){ const old=P.personnes; P.personnes=Math.min(8,Math.max(1,P.personnes+ +b.dataset.step));
      P.budget=Math.round(P.budget/old*P.personnes); rerender(); }
  };
  container.oninput=e=>{ const t=e.target; if(t.dataset&&t.dataset.range){ P[t.dataset.range]=+t.value; const v=$("budgetVal"); if(v) v.textContent=t.value+" €"; } };
}

/* ================= Appli ================= */
function renderApp(){
  const P=ST.profil;
  if(!ST.plan || (ST.plan.days && !planValide())) nouveauPlan();
  const plan=ST.plan;
  const tk=plan.days?ticket(plan.days,P):null;
  const over=tk&&tk.total>P.budget;
  $("root").innerHTML=
    '<header class="top"><div class="page row"><h1>Vite <em>&amp;</em> Calé</h1>'+
      (tk?'<span class="pill num'+(over?" over":"")+'">'+eur(tk.total)+' / '+P.budget+' €</span>':"")+'</div></header>'+
    '<main class="page" id="view"></main>'+
    '<nav class="tabs" aria-label="Sections"><div class="in">'+
      [["semaine","Semaine"],["stock","Chez moi"],["courses","Courses"],["plats","Plats"],["profil","Profil"]].map(([v,n])=>
        '<button type="button" data-tab="'+v+'"'+(ST.onglet===v?' aria-current="page"':"")+'>'+ICONES[v]+n+'</button>').join("")+'</div></nav>';
  document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ST.onglet=b.dataset.tab;persist();renderApp();window.scrollTo(0,0);});
  ({semaine:vueSemaine,stock:vueStock,courses:vueCourses,plats:vuePlats,profil:vueProfil})[ST.onglet]($("view"),P,tk);
}

function prepDimanche(days){
  const all=days.flatMap(d=>SLOTS.map(k=>RID[d[k]]).filter(Boolean));
  const P=ST.profil;
  const oeufs=all.filter(r=>r.batchEggs).reduce((s,r)=>s+(r.ing.find(x=>x[0]==="oeuf")||[0,0])[1],0)*P.personnes;
  const riz=all.filter(r=>r.ing.some(x=>x[0]==="riz")).length;
  const it=[];
  if(oeufs) it.push("Cuis "+oeufs+" œufs durs d'un coup : eau bouillante, 9 minutes. Ils se gardent 5 jours au frigo.");
  if(riz>=2) it.push("Cuis le riz pour "+Math.min(riz,3)+" repas en une fois. Il se garde 3 jours au frigo, bien fermé.");
  if(all.some(r=>r.ing.some(x=>x[0]==="poulet"))) it.push("Sors le poulet du congélateur la veille au soir, au frigo.");
  it.push("Lave et coupe les crudités de la semaine dans une boîte.");
  return '<div class="card"><h3>Le dimanche, 15 minutes</h3><ul>'+it.map(t=>"<li>"+esc(t)+"</li>").join("")+'</ul></div>';
}

function vueCourses(v,P,tk){

  const se=saison(P.region,MOIS_COURANT);
  const coches=new Set(ST.coches);
  const achats=tk.rows.filter(r=>r.packs>0), dispo=tk.rows.filter(r=>r.packs===0);
  const parRayon={}; achats.forEach(r=>{(parRayon[RAYON[r.id]]=parRayon[RAYON[r.id]]||[]).push(r);});
  const sansStock=ticket(ST.plan.days,P,{}).total, eco=sansStock-tk.total;
  const libelle=r=>{ const g=ING[r.id];
    if(r.id==="fruit") return [Math.ceil(r.used)+" fruits de saison","ex. "+se.fruits.slice(0,3).join(", ")];
    if(r.id==="leg") return [String(r.packs*0.5).replace(".",",")+" kg de légumes de saison","ex. "+se.legs.slice(0,3).join(", ")];
    const left=r.packs*g.size+r.have-r.used;
    return [(r.packs>1?r.packs+" × ":"")+g.n+" ("+g.pk+")", left>0.001?"il t'en restera "+(g.u==="g"||g.u==="ml"?Math.round(left)+" "+g.u:String(Math.round(left*10)/10).replace(".",",")):""]; };
  const reste=achats.filter(r=>!coches.has(r.id)).reduce((s,r)=>s+r.cost,0);
  const mag=magasin(P)[1];
  v.innerHTML=
    '<div class="totalbar"><div><h2>Courses de la semaine</h2><span class="muted">Chez '+esc(mag)+(P.marche?", fruits et légumes au marché":"")+'</span></div>'+
      '<div style="text-align:right"><b class="num">'+eur(tk.total)+'</b><br><span class="muted num" style="font-size:12.5px">reste à prendre : '+eur(reste)+'</span></div></div>'+
    (eco>0.01?'<div class="saving">Grâce à ce que tu as déjà, tu économises '+eur(eco)+' cette semaine.</div>':
      '<p class="hint">Astuce : note ce que tu as déjà dans l\'onglet <b>Chez moi</b>, ça le retire de la liste.</p>')+
    (achats.length?"":'<div class="saving">Tu as déjà tout ce qu\'il faut pour la semaine. Pas de courses !</div>')+
    RAYONS.filter(n=>parRayon[n]).map(n=>'<div class="group"><h3>'+n+'</h3>'+parRayon[n].map(r=>{ const [a,b]=libelle(r); const on=coches.has(r.id);
      return '<label class="item'+(on?" done":"")+'"><input type="checkbox" data-coche="'+r.id+'"'+(on?" checked":"")+'><span class="nm">'+esc(a)+(b?'<small>'+esc(b)+'</small>':"")+'</span><span class="pr num">'+eur(r.cost)+'</span></label>'; }).join("")+'</div>').join("")+
    (dispo.length?'<div class="card"><h3>Déjà chez toi</h3><p class="muted">'+dispo.map(r=>esc(r.id==="fruit"?"fruits de saison":r.id==="leg"?"légumes de saison":ING[r.id].n)).join(", ")+'</p></div>':"")+
    '<div class="card"><h3>Au placard (pas compté)</h3><p class="muted">Huile, vinaigre, moutarde, sel, poivre, épices (curry, paprika, cumin, herbes)'+(P.allergies.includes("soja")?"":", sauce soja")+'.</p></div>'+
    '<div class="card"><h3>De saison en '+MOIS[MOIS_COURANT]+'</h3><span class="lbl">Fruits</span><div class="season">'+se.fruits.map(f=>"<span>"+esc(f)+"</span>").join("")+'</div>'+
      '<span class="lbl">Légumes</span><div class="season">'+se.legs.map(f=>"<span>"+esc(f)+"</span>").join("")+'</div></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+(achats.length?'<button type="button" class="btn" id="ranger">J\'ai fait les courses</button>':"")+
      '<button type="button" class="btn dark" id="copier">Copier la liste</button><button type="button" class="btn ghost" id="decocher">Tout décocher</button></div>'+
    (achats.length?'<p class="hint">« J\'ai fait les courses » range ce que tu as coché (ou toute la liste si rien n\'est coché) dans Chez moi.</p>':"")+
    '<p class="foot">Prix indicatifs, ajustés à peu près à ton magasin'+(P.region==="re"?" et à La Réunion (produits importés majorés d'environ 30 %)":"")+'. Vérifie en rayon.</p>';
  v.querySelectorAll("[data-coche]").forEach(c=>c.onchange=()=>{ const id=c.dataset.coche; const s=new Set(ST.coches); c.checked?s.add(id):s.delete(id); ST.coches=[...s]; persist(); vueCourses(v,P,tk); });
  $("decocher").onclick=()=>{ST.coches=[];persist();vueCourses(v,P,tk);};
  if($("ranger")) $("ranger").onclick=()=>{
    const pris=achats.filter(r=>coches.size?coches.has(r.id):true);
    pris.forEach(r=>{ ST.stock[r.id]=(ST.stock[r.id]||0)+r.packs*ING[r.id].size; });
    ST.coches=[]; persist(); renderApp(); toast(pris.length+" produit"+(pris.length>1?"s rangés":" rangé")+" dans Chez moi.");
  };
  $("copier").onclick=()=>{
    const txt="Courses Vite & Calé, "+MOIS[MOIS_COURANT]+" ("+mag+")\n"+RAYONS.filter(n=>parRayon[n]).map(n=>"\n"+n.toUpperCase()+"\n"+parRayon[n].map(r=>"- "+libelle(r)[0]).join("\n")).join("\n")+"\n\nTotal estimé : "+eur(tk.total);
    navigator.clipboard.writeText(txt).then(()=>toast("Liste copiée."),()=>toast("Copie refusée par l'appareil."));
  };
}

/* ================= Chez moi : frigo, congélateur, placard ================= */
const LIEUX=[["Frigo",["oeuf","lait","fb","yaourt","fromage","jambon"]],["Congélateur",["surg","poulet","steak"]],
  ["Placard",["pates","riz","semoule","avoine","lcorail","lbocal","pchiche","hrouge","tomate","coco","thon","maq","soupe","noix","tortilla","pain"]],
  ["Fruits et légumes",["banane","pdt","patate","fruit","leg"]]];
function pas(id){ const g=ING[id]; if(g.u==="g"||g.u==="ml") return g.size>=1000?g.size/4:g.size/2; if(id==="oeuf"||id==="pain") return 2; return 1; }
function stockTxt(id,q){ const g=ING[id]; if(!q) return "0";
  if(g.u==="pc") return String(q)+(id==="fruit"?" fruit"+(q>1?"s":""):id==="oeuf"?" œuf"+(q>1?"s":""):"");
  return qtyTxt(id,q); }
function manques(r,P){ return r.ing.filter(([id,q])=>q*P.personnes>(ST.stock[id]||0)+1e-9).map(([id])=>id); }
function nomCourt(id){ return id==="fruit"?"un fruit de saison":id==="leg"?"des crudités":ING[id].n.toLowerCase(); }
function vueStock(v,P){
  const I=interdits(P);
  const nb=Object.keys(ST.stock).filter(k=>ST.stock[k]>0).length;
  const perm=R.filter(r=>permis(r,P,I));
  const prets=perm.filter(r=>manques(r,P).length===0), presque=perm.filter(r=>manques(r,P).length===1);
  const ligneRecette=(r,txt)=>'<button type="button" class="alt" data-open="'+r.id+'">'+plateSVG(r.id)+'<span><b>'+esc(r.n)+'</b><br><span class="muted" style="font-size:12.5px">'+esc(txt)+'</span></span><span class="c">'+eur(mealCost(r,P))+'</span></button>';
  v.innerHTML='<div><h2>Chez moi</h2><p class="muted" style="font-size:13.5px">Note ce que tu as déjà. La liste de courses le retire, et ta prochaine semaine l\'utilisera en priorité.</p></div>'+
    (nb?'<div class="card"><h3>Ce que tu peux cuisiner maintenant</h3>'+
      (prets.length?prets.map(r=>ligneRecette(r,"Tout est là"+(P.personnes>1?" pour "+P.personnes:""))).join(""):'<p class="muted">Pas encore de plat complet avec ce que tu as.</p>')+
      (presque.length?'<span class="lbl" style="margin-top:6px">Il manque une seule chose</span>'+presque.slice(0,6).map(r=>ligneRecette(r,"Il manque : "+nomCourt(manques(r,P)[0]))).join(""):"")+
      '</div><button type="button" class="btn dark" id="refaire">Refaire ma semaine avec ce que j\'ai</button>':"")+
    LIEUX.map(([lieu,ids])=>{ const vis=ids.filter(id=>!I.ing.has(id));
      return '<div class="group"><h3>'+lieu+'</h3>'+vis.map(id=>{ const q=ST.stock[id]||0; const g=ING[id];
        const nom=id==="fruit"?"Fruits":id==="leg"?"Légumes à croquer":g.n;
        return '<div class="srow'+(q?" has":"")+'"><span class="nm">'+esc(nom)+'<small>'+esc(g.kind==="saison"?"de saison":"vendu en "+g.pk)+'</small></span>'+
          '<span class="qty"><button type="button" data-moins="'+id+'" aria-label="Moins de '+esc(nom)+'"'+(q?"":" disabled")+'>−</button><span>'+esc(stockTxt(id,q))+'</span>'+
          '<button type="button" data-plus="'+id+'" aria-label="Plus de '+esc(nom)+'">+</button></span></div>'; }).join("")+'</div>'; }).join("")+
    (nb?'<button type="button" class="btn ghost" id="vider">Vider Chez moi</button>':"")+
    '<p class="foot">Huile, sel, épices et autres basiques du placard sont considérés comme toujours présents.</p>';
  v.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>{ const id=b.dataset.plus; ST.stock[id]=(ST.stock[id]||0)+pas(id); persist(); vueStock(v,P); majPill(); });
  v.querySelectorAll("[data-moins]").forEach(b=>b.onclick=()=>{ const id=b.dataset.moins; ST.stock[id]=Math.max(0,(ST.stock[id]||0)-pas(id)); if(!ST.stock[id]) delete ST.stock[id]; persist(); vueStock(v,P); majPill(); });
  v.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>ficheRecette(b.dataset.open,null));
  if($("refaire")) $("refaire").onclick=()=>{ nouveauPlan(); ST.onglet="semaine"; persist(); renderApp(); toast("Semaine refaite avec ce que tu as."); };
  let arm=false;
  if($("vider")) $("vider").onclick=()=>{ if(!arm){ arm=true; $("vider").textContent="Toucher encore pour tout vider"; return; } ST.stock={}; persist(); vueStock(v,P); majPill(); };
}
/* Le total en haut suit le stock sans tout redessiner. */
function majPill(){ const el=document.querySelector(".top .pill"); if(!el||!ST.plan||!ST.plan.days) return;
  const t=ticket(ST.plan.days,ST.profil).total; el.textContent=eur(t)+" / "+ST.profil.budget+" €"; el.classList.toggle("over",t>ST.profil.budget); }

function vuePlats(v,P){
  const I=interdits(P);
  const F=[["tous","Tous"],["repas","Midi et soir"],["matin","Matin"],["encas","En-cas"]];
  const order={repas:0,matin:1,encas:2}, KIND={repas:"Midi ou soir",matin:"Matin",encas:"En-cas"};
  const list=R.filter(r=>permis(r,P,I)&&(ST.filtre==="tous"||r.slot===ST.filtre)).sort((a,b)=>order[a.slot]-order[b.slot]||mealCost(a,P)-mealCost(b,P));
  const exclus=R.filter(r=>!permis(r,P,I)).length;
  v.innerHTML='<div><h2>Les plats et leur prix</h2><p class="muted" style="font-size:13.5px">Prix par assiette chez '+esc(magasin(P)[1])+'. Les images sont des illustrations.</p></div>'+
    '<div class="seg" role="group" aria-label="Filtrer">'+F.map(([k,n])=>'<button type="button" data-f="'+k+'" aria-pressed="'+(ST.filtre===k)+'">'+n+'</button>').join("")+'</div>'+
    '<div class="cards">'+list.map(r=>'<button type="button" class="dish" data-open="'+r.id+'"><div class="dpic">'+plateSVG(r.id)+'<span class="badge">'+r.p+' g</span></div>'+
      '<div class="body"><span>'+KIND[r.slot]+' · '+(r.t?r.t+" min":"sans préparation")+'</span><b>'+esc(r.n)+'</b><span><span class="price num">'+eur(mealCost(r,P))+'</span> · '+r.kcal+' kcal</span></div></button>').join("")+'</div>'+
    (exclus?'<p class="foot">'+exclus+' plat'+(exclus>1?"s":"")+' masqué'+(exclus>1?"s":"")+' à cause de ton profil (allergies, régime, goûts ou temps de cuisine).</p>':"");
  v.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ST.filtre=b.dataset.f;persist();vuePlats(v,P);});
  v.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>ficheRecette(b.dataset.open,null));
}

function vueProfil(v){
  const draft=JSON.parse(JSON.stringify(ST.profil));
  const draw=()=>{
    v.innerHTML='<h2>Mon profil</h2>'+
      '<div class="field"><label class="lbl" for="prenom2">Prénom</label><input type="text" id="prenom2" value="'+esc(draft.prenom)+'"></div>'+
      '<div class="card">'+sectionLieu(draft)+'</div><div class="card">'+sectionSante(draft)+'</div><div class="card">'+sectionBudget(draft)+'</div>'+
      '<button type="button" class="btn" id="save">Enregistrer et refaire ma semaine</button>'+
      '<button type="button" class="btn ghost" id="reset">Tout effacer et recommencer</button>'+
      '<p class="foot" id="resetMsg" hidden></p>';
    bindForm(v,draft,draw);
    $("prenom2").oninput=e=>{draft.prenom=e.target.value.slice(0,30);};
    $("save").onclick=()=>{ ST.profil=draft; nouveauPlan(); ST.onglet="semaine"; persist(); renderApp(); toast("Profil enregistré, nouvelle semaine prête."); };
    let arm=false;
    $("reset").onclick=()=>{ if(!arm){ arm=true; $("reset").textContent="Toucher encore pour tout effacer"; return; }
      ST={profil:null,plan:null,coches:[],onglet:"semaine",jour:null,filtre:"tous",stock:{}}; persist(); demarrer(); };
  };
  draw();
}

/* ================= Panneaux ================= */
function ouvrirPanneau(html,onBind){
  fermerPanneau();
  const s=document.createElement("div"); s.className="scrim"; s.id="scrim";
  s.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div>';
  document.body.appendChild(s); document.body.style.overflow="hidden";
  s.onclick=e=>{ if(e.target===s) fermerPanneau(); };
  s.querySelectorAll("[data-close]").forEach(b=>b.onclick=fermerPanneau);
  const f=s.querySelector("[data-close]"); if(f) f.focus();
  if(onBind) onBind(s);
}
function fermerPanneau(){ const s=$("scrim"); if(s){ s.remove(); document.body.style.overflow=""; } }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") fermerPanneau(); });

function ficheRecette(id,slot){
  const P=ST.profil, r=RID[id], c=mealCost(r,P), se=saison(P.region,MOIS_COURANT); let fi=0,li=0;
  const ing=r.ing.map(([i,q])=>{ let n=ING[i].n.toLowerCase();
    if(i==="fruit") n="fruit de saison ("+se.fruits[(fi++)%se.fruits.length]+")";
    if(i==="leg") n="crudités de saison ("+se.legs[(li++)%se.legs.length]+")";
    return "<li>"+esc(qtyTxt(i,q*P.personnes))+" · "+esc(n)+"</li>"; }).join("");
  ouvrirPanneau(
    '<div class="head"><h2>'+esc(r.n)+'</h2><button type="button" class="x" data-close aria-label="Fermer">×</button></div>'+
    '<div class="big">'+plateSVG(id)+'</div>'+
    '<div class="facts"><div><b class="num">'+eur(c).replace(" €","€")+'</b><span>par assiette</span></div><div><b class="num">'+r.p+' g</b><span>protéines</span></div>'+
      '<div><b class="num">'+r.kcal+'</b><span>kcal</span></div><div><b class="num">'+(r.t||0)+' min</b><span>'+esc(r.cook==="aucune"?"sans cuisson":r.cook)+'</span></div></div>'+
    '<div class="card"><h3>Ingrédients'+(P.personnes>1?" pour "+P.personnes:"")+'</h3><ul>'+ing+'</ul></div>'+
    '<div class="card"><h3>Comment faire</h3><ol>'+r.steps.map(s=>"<li>"+esc(s)+"</li>").join("")+'</ol></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" id="cuisine">J\'ai cuisiné ce plat</button>'+
      (slot?'<button type="button" class="btn dark" id="goSwap">Changer ce plat</button>':"")+'</div>'+
    '<p class="hint">« J\'ai cuisiné ce plat » retire les ingrédients de Chez moi.</p>',
    s=>{ const b=s.querySelector("#goSwap"); if(b) b.onclick=()=>ficheEchange(slot);
      s.querySelector("#cuisine").onclick=()=>{ let n=0;
        r.ing.forEach(([i,q])=>{ if(ST.stock[i]){ n++; ST.stock[i]=Math.max(0,ST.stock[i]-q*P.personnes); if(ST.stock[i]<1e-6) delete ST.stock[i]; } });
        persist(); fermerPanneau(); renderApp(); toast(n?"Ingrédients retirés de Chez moi.":"Rien à retirer : ces ingrédients ne sont pas notés dans Chez moi."); }; });
}
function ficheEchange(slot){
  const P=ST.profil, d=ST.plan.days[ST.jour], cur=d[slot];
  const PL=pools(P); const pool=(slot==="midi"||slot==="soir")?PL.repas:PL[slot];
  const other=slot==="midi"?d.soir:slot==="soir"?d.midi:null;
  const alts=pool.filter(r=>r.id!==cur&&r.id!==other).sort((a,b)=>mealCost(a,P)-mealCost(b,P));
  ouvrirPanneau('<div class="head"><h2>Remplacer le '+SLOT_NOM[slot].toLowerCase()+' de '+JOURS[ST.jour].toLowerCase()+'</h2><button type="button" class="x" data-close aria-label="Fermer">×</button></div>'+
    (alts.length?alts.map(r=>'<button type="button" class="alt" data-pick="'+r.id+'">'+plateSVG(r.id)+'<span><b>'+esc(r.n)+'</b><br><span class="muted" style="font-size:12.5px">'+(r.t||0)+' min · '+r.p+' g prot.</span></span><span class="c">'+eur(mealCost(r,P))+'</span></button>').join("")
      :'<p class="muted">Aucun autre plat ne correspond à ton profil pour ce moment de la journée.</p>'),
    s=>s.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ d[slot]=b.dataset.pick; persist(); fermerPanneau(); renderApp(); toast("Plat remplacé."); }));
}

/* ================= Démarrage ================= */
function demarrer(){
  if(!ST.profil){ ONB={step:0,draft:JSON.parse(JSON.stringify(PROFIL_DEFAUT))}; renderOnb(); }
  else renderApp();
}
demarrer();
if("serviceWorker" in navigator && location.protocol==="https:" && !/claude\.ai|claudeusercontent/.test(location.hostname)){
  try{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }catch(e){}
}
</script>
</body>
