<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vite &amp; Calé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Une semaine de repas qui calent, à petit budget, de saison et presque sans cuisine.">
<meta name="theme-color" content="#2D774A">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : appli mobile, une colonne de 640px max, barre d'onglets fixée en bas, fiches en panneau qui monte. */
:root{
  --bg:#F1F4EC; --surface:#FFFFFF; --ink:#1B251E; --muted:#5A685F; --line:#D6DDD1;
  --leaf:#2D774A; --leaf-soft:#E2EEE4; --squash:#B8650F; --squash-soft:#F7EAD9; --warn:#A33A2A; --warn-soft:#F6E1DC;
  --plate:#FFFFFF; --plate-line:#DCE2D8; --pic-bg:#E7ECE2; --scrim:rgba(20,28,22,.45);
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Figtree',ui-sans-serif,system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#18201B; --ink:#E4ECE6; --muted:#93A399; --line:#29342D;
  --leaf:#6DC290; --leaf-soft:#1E3226; --squash:#E7A15C; --squash-soft:#352818; --warn:#F08A78; --warn-soft:#3A221D;
  --plate:#EDEFEA; --plate-line:#3A463E; --pic-bg:#202A23; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#18201B; --ink:#E4ECE6; --muted:#93A399; --line:#29342D;
  --leaf:#6DC290; --leaf-soft:#1E3226; --squash:#E7A15C; --squash-soft:#352818; --warn:#F08A78; --warn-soft:#3A221D;
  --plate:#EDEFEA; --plate-line:#3A463E; --pic-bg:#202A23; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--leaf)}
h2{font-size:21px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--leaf);outline-offset:2px}
.page{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* Boutons et choix */
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:700;background:var(--leaf);color:var(--surface)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 14px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14.5px;text-align:left;display:flex;flex-direction:column;gap:1px}
.opt small{font-weight:400;color:var(--muted);font-size:12.5px}
.opt.store{flex-direction:row;align-items:center;gap:10px;padding:8px 14px 8px 8px}
.logo{display:inline-flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:8px;background:#FFFFFF;border:1px solid var(--line);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;padding:3px}
.logo.txt{font-size:11px;font-weight:800;color:#1B251E;letter-spacing:-.02em}
.logo.sm{width:24px;height:24px;border-radius:6px}
.chez{display:inline-flex;align-items:center;gap:8px}
.plist summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px}
.plist summary::-webkit-details-marker{display:none}
.plist summary b{font-weight:700}
.plist summary span.muted{font-size:12.5px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 14px;border-top:1px solid var(--line)}
.prow .nm small{display:block;color:var(--muted);font-size:12px}
.prow .pp{text-align:right;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.prow .pp small{display:block;color:var(--muted);font-size:11.5px}
.src{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--line);color:var(--muted);margin-left:6px;vertical-align:1px;white-space:nowrap}
.src.ok{background:var(--leaf-soft);color:var(--leaf)}
.promo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.promo.prise{border-color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf)}
.promo .nm{min-width:0;display:flex;flex-direction:column;gap:3px}
.promo .nm b{font-weight:600;line-height:1.3}
.promo .nm small{color:var(--muted);font-size:12.5px}
.promo .px{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.promo .px b{font-family:var(--f-display);font-size:22px;font-weight:800;color:var(--squash);line-height:1}
.promo .px s{color:var(--muted);font-size:13px}
.promo .act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pct{font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--warn);color:var(--surface)}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--squash-soft);color:var(--squash)}
.chip.ing{background:var(--leaf-soft);color:var(--leaf)}
.mini{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.mini .nm small{display:block;color:var(--muted);font-size:12px}
.mini .pp{text-align:right;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.mini .pp s{display:block;color:var(--muted);font-size:11.5px}
.sug{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.sug button{border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:10px 14px;font-size:14.5px}
.sug button:first-child{border-top:0}
.sug button small{color:var(--muted);margin-left:6px}
.ville{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--leaf-soft);color:var(--leaf);border-radius:12px;padding:10px 14px;font-weight:600}
.dist{font-size:11.5px;font-weight:700;color:var(--leaf)}
.form{display:flex;flex-direction:column;gap:14px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .f{display:flex;flex-direction:column;gap:6px;min-width:0}
.form .f label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.form input[type=file]{font:inherit;font-size:13.5px;max-width:100%}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--leaf);margin:1px 0 0}
.etat{border-radius:12px;padding:10px 14px;font-size:14px;background:var(--leaf-soft);color:var(--leaf)}
.etat.err{background:var(--warn-soft);color:var(--warn)}
.links{display:flex;flex-direction:column}
.links a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.links a:first-child{border-top:0}
.links a small{color:var(--muted);font-weight:400}
.contrib b{font-family:var(--f-display);font-size:17px}
.jauge{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.jauge i{display:block;height:100%;background:var(--leaf);border-radius:999px}
.photo-plat{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:50%;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.desc{color:var(--muted);font-size:14px;line-height:1.45;max-width:60ch}
.eqi{width:30px;height:30px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.opt.eq{flex-direction:row;align-items:center;gap:10px}
.opt.eq span{display:flex;flex-direction:column;gap:1px}
.seg .eqi{width:20px;height:20px;vertical-align:-5px;margin-right:6px}
.dish .pourtoi{position:absolute;top:8px;left:8px;background:var(--leaf);color:var(--surface);font-weight:700;font-size:11.5px;border-radius:999px;padding:2px 9px}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--leaf);animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.phase{display:flex;flex-direction:column;gap:4px;padding-top:6px}
.phase+.phase{border-top:1px dashed var(--line);padding-top:10px}
.phase h4{margin:0;font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--leaf)}
.phase ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.prayon{padding:10px 14px 4px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
.opt[aria-pressed=true]{border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf)}
.opt.no[aria-pressed=true]{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.field{display:flex;flex-direction:column;gap:10px}
.field + .field{margin-top:22px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.stepper b{font-family:var(--f-display);font-size:28px;min-width:2ch;text-align:center}
input[type=range]{width:100%;accent-color:var(--leaf)}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=email],input[type=tel],select.in{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.rangeval{font-family:var(--f-display);font-size:28px;font-weight:800}
.hint{font-size:13px;color:var(--muted)}

/* Onboarding */
#onb{min-height:100%;display:flex;flex-direction:column;padding-block:24px 28px;gap:22px}
.dots{display:flex;gap:6px}
.dots i{height:5px;flex:1;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--leaf)}
.onb-body{display:flex;flex-direction:column;gap:6px}
.onb-body > p{color:var(--muted);max-width:52ch}
.onb-nav{display:flex;gap:10px;justify-content:space-between;margin-top:auto;padding-top:12px}
.hero-plate{width:min(240px,60vw);margin:8px auto 4px}

/* En-tête de l'appli */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.top .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:24px}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:5px 11px;background:var(--leaf-soft);color:var(--leaf);white-space:nowrap}
.pill.over{background:var(--warn-soft);color:var(--warn)}
main{padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:0;min-width:0}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--leaf)}

/* Résumé semaine */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:1 1 0;min-width:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.days button b{font-size:14px}
.days button span{font-size:10.5px;color:var(--muted)}
.days button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.days button[aria-pressed=true] span{color:var(--bg);opacity:.75}
.daytotal{display:flex;justify-content:space-between;align-items:baseline}

.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:150px;background:var(--pic-bg)}
.hero .hpic{position:relative;width:190px;max-width:60%;margin:4px auto 0;border:0;padding:0;background:transparent;aspect-ratio:1}
.hero .htxt{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.hero h3{font-family:var(--f-display);font-size:21px;font-weight:800;text-align:left;border:0;background:transparent;padding:0;color:var(--ink);cursor:pointer}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meal{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 10px}
.meal .pic{width:72px;height:72px;border:0;padding:0;background:transparent}
.meal .txt{min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.meal .open{border:0;background:transparent;padding:0;text-align:left;font-weight:600;font-size:15.5px;line-height:1.3}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.meta .p{color:var(--leaf);font-weight:700}
.meta .c{color:var(--squash);font-weight:700}
.meal .swap{margin-top:4px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf)}
.tag.fun{background:var(--squash-soft);color:var(--squash)}
.tag.promo{background:var(--warn-soft);color:var(--warn)}
/* Promos en direct */
nav.tabs button{position:relative}
nav.tabs .nb{position:absolute;top:7px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--warn);color:var(--surface);font-size:10.5px;font-weight:800;line-height:17px;text-align:center}
.qui{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.qui b{color:var(--ink);font-weight:700}
.qui .conf{color:var(--leaf);font-weight:700}
.direct{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--surface);background:var(--warn);border-radius:999px;padding:1px 7px;margin-right:6px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
.votes{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.votes span{margin-right:2px}
.vote{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;font:600 12.5px var(--f-body);min-height:34px}
.vote:hover{border-color:var(--leaf)}
.mini.autre .votes{border-top:0;padding-top:0}
.big-cta{width:100%;min-height:56px;font-size:17px}
.chasse ol{list-style:none;margin:8px 0 6px;padding:0;display:grid;gap:4px}
.chasse li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 8px;border-radius:10px}
.chasse li b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.chasse li.moi{background:var(--leaf-soft)}
.chasse .rg{font-family:var(--f-display);font-weight:800;color:var(--leaf)}
.promo-sem{display:grid;gap:6px;border-color:var(--warn)}
.vote.part{margin-left:auto}
.fr{font-style:normal;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 7px;margin-right:6px}
.fr.ok{background:var(--leaf-soft);color:var(--leaf)}
.fr.verif{background:var(--squash-soft);color:var(--squash)}
.fr.old{background:var(--line);color:var(--muted)}
details.finies summary{cursor:pointer;font-weight:700;padding:12px 14px}
.invite{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.invite b{flex:1 1 200px;font-size:14.5px}
.beta-card{display:grid;gap:8px;border-color:var(--leaf)}
.beta-card .row{display:flex;gap:8px;flex-wrap:wrap}
textarea.in{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);resize:vertical}
.promo-sem .btn{justify-self:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card ul,.card ol{margin:0;padding-left:20px}
.banner{border-radius:12px;padding:10px 14px;font-size:14px;background:var(--warn-soft);color:var(--warn)}

/* Courses */
.group{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group h3{padding:12px 14px 6px;font-size:12px;font-family:var(--f-body);font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.item{display:grid;grid-template-columns:24px 38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.item input{width:20px;height:20px;accent-color:var(--leaf);margin:0}
.item .nm{min-width:0}
.item .nm small{display:block;color:var(--muted);font-size:12px}
.item .pr{font-family:var(--f-mono);font-size:13px}
.item.done .nm,.item.done .pr{text-decoration:line-through;color:var(--muted)}
.totalbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.totalbar b{font-family:var(--f-mono);font-size:18px}
.season{display:flex;flex-wrap:wrap;gap:6px}
.season span{font-size:13px;background:var(--leaf-soft);color:var(--leaf);border-radius:999px;padding:3px 10px}

/* Plats */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;padding:0;text-align:left}
.dish .dpic{position:relative;background:var(--pic-bg);padding:12px;display:flex;justify-content:center}
.dish .dpic svg{width:100%;max-width:150px;height:auto;aspect-ratio:1}
.dish .badge{position:absolute;top:8px;right:8px;background:var(--ink);color:var(--bg);font-weight:700;font-size:12.5px;border-radius:999px;padding:2px 9px}
.dish .body{padding:9px 11px 11px;display:flex;flex-direction:column;gap:2px}
.dish .body b{font-weight:600;line-height:1.3;font-size:14.5px}
.dish .body span{font-size:12.5px;color:var(--muted)}
.dish .body .price{color:var(--squash);font-weight:700;font-size:14.5px}

/* Panneau (fiche recette, échange) */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:5px;border-radius:4px;background:var(--line);margin:0 auto}
.sheet .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet .x{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:36px;height:36px;flex:none;font-size:18px;line-height:1}
.sheet .big{width:min(220px,62vw);margin:0 auto}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.facts b{display:block;font-family:var(--f-display);font-size:17px}
.facts span{font-size:11px;color:var(--muted)}
.igrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.igrid div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.igrid b{font-family:var(--f-display);font-size:15px}
.igrid span{font-size:12px;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.alt{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left}
.alt svg{width:52px;height:52px}
.alt .c{color:var(--squash);font-weight:700;font-variant-numeric:tabular-nums}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.srow .nm small{display:block;color:var(--muted);font-size:12px}
.srow.has .nm{font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;line-height:1}
.qty span{min-width:58px;text-align:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.srow.has .qty span{color:var(--leaf);font-weight:700}
.qty button:disabled{opacity:.35;cursor:default}
.saving{background:var(--leaf-soft);color:var(--leaf);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.plate-rim{fill:var(--plate)} .plate-edge{fill:none;stroke:var(--plate-line);stroke-width:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600}
.foot{font-size:12px;color:var(--muted)}

@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px)}to{transform:none}}}

/* Écran d'accès payant (Whop) */
.mur{align-items:stretch}
.mur .apercu{display:grid;gap:8px;position:relative}
.mur .apercu .flou{filter:blur(5px);user-select:none;pointer-events:none}
.mur .apercu .l{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.mur .cadenas{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;text-align:center;padding:0 24px}
.mur .cadenas span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.mur .actions{display:grid;gap:10px}
.mur .prix{font-family:var(--f-display);font-weight:800;font-size:19px}

/* Dessins des produits : le trait se trace quand la ligne arrive à l'écran */
.dess{width:38px;height:38px;border-radius:12px;background:var(--leaf-soft);display:grid;place-items:center;color:var(--leaf);flex:none}
.dess svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dess svg *{stroke-dasharray:1;stroke-dashoffset:1}
.dess.vu svg *{stroke-dashoffset:0;transition:stroke-dashoffset .8s ease}
.dess.vu svg :nth-child(2){transition-delay:.25s}
.dess.vu svg :nth-child(n+3){transition-delay:.45s}
.dess.deja svg *{stroke-dashoffset:0;transition:none}
@media (prefers-reduced-motion:reduce){.dess svg *{stroke-dashoffset:0!important;transition:none!important}}
.item.enpromo .dess{background:var(--squash-soft);color:var(--squash)}
.item .pr{text-align:right}
.item .pr s{display:block;color:var(--muted);font-size:11.5px}
.item .pr b{color:var(--squash)}
.item .nm small.pm{color:var(--squash);font-weight:600}
.ipromo{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 14px 10px 88px;font-size:12.5px;color:var(--squash);background:var(--squash-soft)}
.ipromo .btn{flex:none;background:var(--squash);color:#fff}
.srow.dessine{grid-template-columns:38px minmax(0,1fr) auto}
.budgetbar{display:grid;gap:6px}
.budgetbar .barre{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.budgetbar .barre i{display:block;height:100%;border-radius:5px;background:var(--leaf)}
.budgetbar.over .barre i{background:var(--warn)}
.budgetbar span{font-size:13.5px}
.budgetbar.over b{color:var(--warn)}
.banner.budget{display:grid;gap:8px;background:var(--squash-soft);color:var(--ink)}
.banner.budget .btn{justify-self:start}

function dessinAssiette(id){

  wedges.forEach(W=>{ if(parts.length===1){ out+='<clipPath id="'+uid+W.i+'"><circle cx="50" cy="50" r="'+R0+'"/></clipPath>'; return; }
    const x0=C+R0*Math.cos(W.a0),y0=C+R0*Math.sin(W.a0),x1=C+R0*Math.cos(W.a1),y1=C+R0*Math.sin(W.a1);

    f.bits.forEach(([shape,cols,n,sz])=>{
      const count=Math.max(1,Math.round(n*Math.min(1,span/(Math.PI*2)*2.2)));
      for(let j=0;j<count;j++){
        const ang=W.a0+rand()*span, rr=Math.sqrt(rand())*(R0-2), x=C+rr*Math.cos(ang), y=C+rr*Math.sin(ang);
        const col=cols[Math.floor(rand()*cols.length)], rot=Math.round(rand()*180);

        else if(shape==="strip") out+='<rect x="'+P(x-sz*4)+'" y="'+P(y-sz*.5)+'" width="'+P(sz*8)+'" height="'+P(sz)+'" rx="'+P(sz*.5)+'" fill="'+col+'" transform="rotate('+rot+' '+P(x)+' '+P(y)+')"/>';
        else if(shape==="chunk") out+='<rect x="'+P(x-sz)+'" y="'+P(y-sz)+'" width="'+P(sz*2)+'" height="'+P(sz*1.7)+'" rx="'+P(sz*.45)+'" fill="'+col+'" transform="rotate('+rot+' '+P(x)+' '+P(y)+')"/>';

        else if(shape==="roll") out+='<rect x="'+P(x-sz*2)+'" y="'+P(y-sz*.8)+'" width="'+P(sz*4)+'" height="'+P(sz*1.6)+'" rx="'+P(sz*.8)+'" fill="'+col+'" transform="rotate('+rot+' '+P(x)+' '+P(y)+')"/><circle cx="'+P(x)+'" cy="'+P(y)+'" r="'+P(sz*.55)+'" fill="#6FAE4E" transform="rotate('+rot+' '+P(x)+' '+P(y)+')"/>';

  ST.plan=g.err?{err:g.err,seed:s}:{days:g.days,seed:s,cree:Date.now(),horsBudget:!g.ok,temps:g.temps,retires:g.retires,complet:g.complet};
  ST.coches=[]; persist();
}
/* Le budget passe avant tout. Si la semaine complète le dépasse :
   1. on autorise des plats plus longs à cuisiner (ils sont moins chers), en le disant ;
   2. s'il le faut encore, on retire des repas de la liste, les moins essentiels d'abord
      (en-cas, puis petits-déjeuners, puis déjeuners, puis dîners), jusqu'à tenir dans le budget.
   La liste ne dépasse donc jamais le budget demandé, et on dit ce qu'elle couvre. */
function generePourBudget(P,seed){
  let g=generer(P,seed), temps=null;
  if(g.err||g.ok) return g;
  const ordre=TEMPS.map(t=>t[0]);
  for(let i=ordre.indexOf(P.temps)+1;i>0&&i<ordre.length&&!g.ok;i++){
    const e=generer(Object.assign({},P,{temps:ordre[i]}),seed);
    if(!e.err&&(e.ok||e.total<g.total-0.5)){ g=e; temps=ordre[i]; } }
  if(g.ok) return {days:g.days,ok:true,total:g.total,temps};
  const days=g.days.map(d=>Object.assign({},d)), retires={encas:0,matin:0,midi:0,soir:0}, cout=()=>ticket(days,P).total;
  let t=cout(); const complet=t;
  for(const k of ["encas","matin","midi","soir"]) while(t>P.budget+0.005){
    let best=-1, bt=Infinity;
    days.forEach((d,i)=>{ if(!d[k]) return; const o=d[k]; d[k]=null; const c=cout(); d[k]=o; if(c<bt){ bt=c; best=i; } });
    if(best<0) break;
    days[best][k]=null; retires[k]++; t=bt; }
  return {days,ok:t<=P.budget+0.005,total:t,temps,retires,complet};
}
/* Ce que la liste couvre quand le budget ne permet pas la semaine complète. */
function bandeauBudget(P){
  const pl=ST.plan; if(!pl||!pl.days) return "";
  const r=pl.retires, n=r?r.encas+r.matin+r.midi+r.soir:0, tps=pl.temps&&(TEMPS.find(t=>t[0]===pl.temps)||[])[1];
  if(!n&&!tps) return "";
  const nb=(k,un,pl2)=>{ const c=7-(r?r[k]:0); return c?c+" "+(c>1?pl2:un):"aucun "+un; };
  return '<div class="banner budget"><span>'+
    (n?'<b>Pour tenir '+P.budget+' € pour '+P.personnes+(P.personnes>1?" personnes":" personne")+'</b>, ta liste couvre '+nb("soir","dîner","dîners")+', '+nb("midi","déjeuner","déjeuners")+', '+
      nb("matin","petit-déjeuner","petits-déjeuners")+' et '+nb("encas","en-cas","en-cas")+' sur 7. La semaine complète coûterait environ '+Math.ceil(pl.complet)+' €.':"")+
    (tps?(n?" ":"")+'Pour baisser le prix, j\'ai pris des plats plus longs à cuisiner ('+esc(tps.toLowerCase())+').':"")+'</span>'+
    (n?'<button type="button" class="btn small" data-budget="'+Math.ceil(pl.complet)+'">Tout couvrir : passer à '+Math.ceil(pl.complet)+' €</button>':"")+'</div>';
}

/* ================= Communes (communes.json, geo.api.gouv.fr) ================= */
let COMMUNES=null, chargementCommunes=null;
function chargeCommunes(){
  if(COMMUNES) return Promise.resolve(COMMUNES);
  return chargementCommunes=chargementCommunes||fetch("./communes.json").then(r=>r.json()).then(d=>{
    COMMUNES=d.communes.map(c=>({nom:c[0],cp:c[1],lat:c[2],lon:c[3],dep:c[4],pop:c[5]||0,k:normalise(c[0])})); return COMMUNES; })
    .catch(()=>{ chargementCommunes=null; return null; });
}
function normalise(t){ return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[-'’]/g," ").replace(/\bst\b/g,"saint").replace(/\s+/g," ").trim(); }
function chercheCommunes(q){
  if(!COMMUNES) return [];
  const n=normalise(q); if(n.length<2) return [];
  if(/^\d{2,5}$/.test(n)) return COMMUNES.filter(c=>c.cp.startsWith(n)).slice(0,8);
  const debut=COMMUNES.filter(c=>c.k.startsWith(n)), dedans=debut.length>=8?[]:COMMUNES.filter(c=>!c.k.startsWith(n)&&c.k.includes(n));
  /* Nom exact d'abord, puis mot complet (« paris 1 » → 1er avant 15e), puis les plus peuplées. */
  const rang=c=>c.k===n?0:/\d/.test(c.k.charAt(n.length))?2:1;
  return debut.sort((a,b)=>rang(a)-rang(b)||b.pop-a.pop).concat(dedans.sort((a,b)=>b.pop-a.pop)).slice(0,8);
}
function distanceKm(a,b){ const R=6371, r=Math.PI/180, dl=(b.lat-a.lat)*r, dg=(b.lon-a.lon)*r;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

function bindForm(container,P,rerender){
  container.onclick=e=>{

      rerender(); }
    else if(b.dataset.villeRaz){ P.ville=null; rerender(); setTimeout(()=>{ const q=$("villeQ"); if(q) q.focus(); },0); }
    else if(b.dataset.ville!=null){ const c=VILLES_SUG[+b.dataset.ville]; if(!c) return;
      P.ville={nom:c.nom,cp:c.cp,lat:c.lat,lon:c.lon,dep:c.dep};
      P.region=c.dep==="974"?"re":"fr";
      const l=MAGASINS[P.region]; if(!l.some(m=>m[0]===P.magasin)) P.magasin=l[0][0];
      rerender(); }
    else if(b.dataset.stylesTout){ P.styles=[]; rerender(); }
    else if(b.dataset.toggle){ if(b.dataset.toggle==="equip"&&!P.equip) P.equip=PROFIL_DEFAUT.equip.slice();
      if(b.dataset.toggle==="styles"&&!P.styles) P.styles=[];
      const a=P[b.dataset.toggle], v=b.dataset.v, i=a.indexOf(v);
      if(i>=0) a.splice(i,1); else a.push(v); rerender(); }
    else if(b.dataset.step){ const old=P.personnes; P.personnes=Math.min(8,Math.max(1,P.personnes+ +b.dataset.step));
      P.budget=Math.round(P.budget/old*P.personnes); rerender(); }
  };
  container.oninput=e=>{ const t=e.target;
    if(t.id==="villeQ"){ const q=t.value; chargeCommunes().then(()=>{ if($("villeQ")!==t||t.value!==q) return;

    if(t.dataset&&t.dataset.range){ P[t.dataset.range]=+t.value; const v=$("budgetVal"); if(v) v.textContent=t.value+" €"; } };
}

function traceDessins(racine){

/* ================= Open Prices : envoyer une promo (compte Open Food Facts) ================= */
const OP_API="https://prices.openfoodfacts.org/api/v1";
if(!ST.op) ST.op=null;   // {user, token} : le mot de passe n'est jamais gardé
/* Fruits et légumes vendus au kilo : envoyés par catégorie, sans code-barres. */
const CAT_OP={banane:[["en:bananas","Bananes"]],pdt:[["en:potatoes","Pommes de terre"]],citron:[["en:lemons","Citrons"]],patate:[["en:sweet-potatoes","Patates douces"]],oignon:[["en:onions","Oignons"]],
  fruit:[["en:apples","Pommes"],["en:pears","Poires"],["en:oranges","Oranges"],["en:clementines","Clémentines"],["en:kiwis","Kiwis"]],
  leg:[["en:carrots","Carottes"],["en:tomatoes","Tomates"],["en:leeks","Poireaux"]]};
const TYPES_PROMO=[["SALE","Promo"],["LOYALTY_PROGRAM","Carte fidélité"],["QUANTITY","Lot ou quantité"]];
function opConnexion(user,pass){
  const body=new URLSearchParams({username:user,password:pass});
  return fetch(OP_API+"/auth",{method:"POST",body}).then(r=>r.json().then(d=>{ if(!r.ok||!d.access_token) throw new Error(r.status===401||r.status===400?"Identifiant ou mot de passe incorrect.":"Connexion refusée ("+r.status+").");
    ST.op={user,token:d.access_token}; persist(); return ST.op; }));
}
function opEchec(r){ return r.json().catch(()=>({})).then(d=>{ if(r.status===401){ ST.op=null; persist(); throw new Error("Ta connexion à Open Prices a expiré : reconnecte-toi dans Profil."); }
  throw new Error("Open Prices a refusé l'envoi ("+r.status+")"+(d&&d.detail?" : "+JSON.stringify(d.detail).slice(0,160):"")+"."); }); }
const PREUVES=new Map();   // une même photo n'est envoyée qu'une fois, même pour plusieurs prix
function opPreuve(photo,lireEtiquettes,osm){
  osm=osm||ST.profil.osm;
  const cle=photo.name+"|"+photo.size+"|"+photo.lastModified+"|"+!!lireEtiquettes+"|"+osm.id;
  if(PREUVES.has(cle)) return Promise.resolve(PREUVES.get(cle));
  const fd=new FormData();
  fd.append("file",photo); fd.append("type","PRICE_TAG"); fd.append("location_osm_id",String(osm.id)); fd.append("location_osm_type",osm.type);
  fd.append("date",AUJ); fd.append("currency","EUR");
  if(lireEtiquettes) fd.append("ready_for_price_tag_validation","true");
  return fetch(OP_API+"/proofs/upload",{method:"POST",headers:{Authorization:"Bearer "+ST.op.token},body:fd}).then(r=>r.ok?r.json():opEchec(r))
    .then(p=>{ PREUVES.set(cle,p.id); return p.id; });
}
function opPrix(promo,proofId,osm){
  osm=osm||ST.profil.osm;
  const prix={price:promo.prix,currency:"EUR",date:AUJ,location_osm_id:osm.id,location_osm_type:osm.type,proof_id:proofId,price_is_discounted:!!promo.typeOP};
  if(promo.typeOP) prix.discount_type=promo.typeOP;
  if(promo.avant) prix.price_without_discount=promo.avant;
  if(promo.fin&&promo.fin>=AUJ) prix.owner_comment="Valable jusqu'au "+promo.fin+" (Vite & Calé)";
  if(promo.categorie){ prix.type="CATEGORY"; prix.category_tag=promo.categorie; prix.price_per=promo.per||"KILOGRAM"; }
  else { prix.type="PRODUCT"; prix.product_code=promo.code; if(promo.nom) prix.product_name=promo.nom; }
  return fetch(OP_API+"/prices",{method:"POST",headers:{Authorization:"Bearer "+ST.op.token,"Content-Type":"application/json"},body:JSON.stringify(prix)}).then(r=>r.ok?r.json():opEchec(r));
}
function opEnvoi(promo,photo,osm){ return opPreuve(photo,false,osm).then(id=>opPrix(promo,id,osm)).then(r=>{ ST.contrib.prix++; persist(); return r; }); }

/* ===== Lecture des codes-barres sur une photo : le navigateur s'il sait faire, sinon ZXing (licence MIT) ===== */
let zxingCharge=null;
function chargeZXing(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  return zxingCharge=zxingCharge||new Promise((ok,ko)=>{ const sc=document.createElement("script");
    sc.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"; sc.onload=()=>ok(window.ZXing); sc.onerror=()=>{ zxingCharge=null; ko(new Error("zxing")); };
    document.head.appendChild(sc); });
}
function litCodeBarres(fichier){
  const essaiNatif=()=>("BarcodeDetector" in window)?createImageBitmap(fichier).then(img=>new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]}).detect(img))
    .then(l=>l&&l[0]?l[0].rawValue:null).catch(()=>null):Promise.resolve(null);
  return essaiNatif().then(code=>{ if(code) return code;
    return chargeZXing().then(Z=>{ const url=URL.createObjectURL(fichier); const lecteur=new Z.BrowserMultiFormatReader();
      return lecteur.decodeFromImageUrl(url).then(r=>{ URL.revokeObjectURL(url); return r.getText(); }).catch(()=>{ URL.revokeObjectURL(url); return null; }); }).catch(()=>null); });
}
/* Fiche produit Open Food Facts : nom, marque, contenance. */
function ficheProduit(code){
  return fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json?fields=product_name,product_name_fr,brands,quantity,product_quantity,product_quantity_unit")
    .then(r=>r.ok?r.json():null).then(d=>d&&d.status===1?d.product:null).catch(()=>null);
}
/* Rattache un produit à un ingrédient de l'appli (même logique que prix/maj_prix.py, en plus simple). */
const MOTS=[["pate",/p[âa]te bris[ée]e/],["lasagne",/lasagne/],["lcorail",/lentilles? corail/],["lbocal",/lentille/],["pchiche",/pois chiche/],["hrouge",/haricots? rouge/],

  ["cacahuete",/cacahu.*(beurre|p[âa]te)|beurre de cacahu|arachide/],["noix",/cacahu/],["fb",/fromage blanc|faisselle/],["yaourt",/yaourt|yoghourt/],["reblochon",/reblochon/],

  ["lardons",/lardon/],["jambon",/jambon/],["merguez",/merguez/],["saucisse",/saucisse|chipolata/],["steak",/steak|hach[ée]/],["poulet",/(filet|escalope|blanc|aiguillette)s? de poulet/],
  ["cuisse",/cuisse|pilon/],["boeuf",/b(œ|oe)uf|paleron|bourguignon/],["colin",/colin|merlu|cabillaud|\blieu\b/],["moules",/moules/],["farine",/farine/],["painburger",/burger|buns?\b/],
  ["baguette",/baguette/],["pain",/pain de mie|pain complet/],["tortilla",/tortilla|wrap/],["confiture",/confiture/],["cereales",/c[ée]r[ée]ales|corn ?flakes|p[ée]tales/],
  ["biere",/bi[èe]re/],["soupe",/soupe|velout[ée]|moulin[ée]/],["semoule",/semoule|couscous/],["riz",/\briz\b/],["avoine",/avoine/],
  ["pates",/spaghetti|penne|torsade|coquillette|fusilli|macaroni|tagliatelle|p[âa]tes/],["surg",/surgel/]];
function ingredientDuNom(nom){ const n=(nom||"").toLowerCase(); const m=MOTS.find(([,re])=>re.test(n)); return m?m[0]:null; }
function contenuProduit(prod,ing){
  if(!prod) return null;
  const base=(PRIX&&PRIX.ingredients&&PRIX.ingredients[ing]&&PRIX.ingredients[ing].base)||(ing==="oeuf"?"piece":["lait","coco","soupe","biere"].includes(ing)?"l":"kg");
  if(base==="piece"){ const m=((prod.product_name||"")+" "+(prod.quantity||"")).match(/(\d{1,2})\s*(?:x|œufs|oeufs|pi[èe]ces)/i); return m?+m[1]:null; }
  const q=+prod.product_quantity, u=(prod.product_quantity_unit||"").toLowerCase();
  if(!(q>0)) return null; return u==="kg"||u==="l"?q:q/1000;
}

      if(!photo){ msg("Pour partager ce prix, ajoute la photo de l'étiquette (étape 1).",true); return; }
      $("sOk").disabled=true; msg("Envoi à Open Prices…");
      opPreuve(photo).then(pid=>opPrix({prix,avant,nom,code:c,typeOP:promo?$("sType").value:null},pid))
        .then(()=>{ ST.contrib.prix++; persist(); const nv=niveau(ST.contrib.prix);
          suivant("Merci ! "+ST.contrib.prix+" prix partagé"+(ST.contrib.prix>1?"s":"")+" · "+nv.nom+". Au suivant !"); })
        .catch(e=>{ $("sOk").disabled=false; msg((e&&e.message&&!/fetch|network|Failed/i.test(e.message)?e.message:"Envoi impossible : vérifie ta connexion. Depuis l'aperçu claude.ai, l'envoi ne marche pas.")+(promo&&id?" La promo reste dans ton budget.":""),true); });
    };
  });
}

/* Magasin exact sur OpenStreetMap (Nominatim), pour qu'Open Prices sache où la promo a été vue. */
function chercheMagasinsOSM(q){
  return fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&countrycodes=fr,re&accept-language=fr&q="+encodeURIComponent(q))
    .then(r=>r.ok?r.json():[]).then(l=>l.filter(x=>x.category==="shop"||x.type==="supermarket").map(x=>({
      id:+x.osm_id,type:({node:"NODE",way:"WAY",relation:"RELATION"})[x.osm_type],nom:x.name||x.display_name.split(",")[0],adresse:x.display_name.split(",").slice(1,4).join(",").trim()})).filter(x=>x.type));
}

/* ================= Promos ================= */
function dateCourte(iso){ return new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"}); }
/* Promos visibles pour ce profil : ni masquées (« plus là »), ni simples confirmations d'une promo déjà listée. */
/* Durée de vie d'une promo selon son type (en jours, jour du relevé compris), sauf date de fin indiquée par la personne qui l'a vue. */
const DUREE_PROMO={EXPIRES_SOON:2,SALE:7,LOYALTY_PROGRAM:14,QUANTITY:14,SEASONAL:14};
const NOM_DUREE={2:"2 jours",7:"7 jours",14:"14 jours"};
function dureePromo(p){ return DUREE_PROMO[p.remise]||7; }
function plusJours(iso,n){ const d=new Date(iso+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function finPromo(p){ return p.fin||plusJours(p.date||AUJ,dureePromo(p)-1); }
function promoEnCours(p){ return finPromo(p)>=AUJ; }
function agePromo(p){ return Math.max(0,Math.round((Date.parse(AUJ)-Date.parse(p.date||AUJ))/864e5)); }
/* 1 = toute fraîche, vers 0,75 en fin de vie : la carte pâlit avec l'âge */
function opacitePromo(p){ const t=Math.min(1,agePromo(p)/Math.max(1,dureePromo(p))); return promoEnCours(p)?(1-0.25*t).toFixed(2):"0.6"; }
function fraicheur(p){ const a=agePromo(p);
  if(!promoEnCours(p)) return '<i class="fr old">Sans doute finie</i>';
  if(a===0) return '<i class="fr ok">Vue aujourd\'hui</i>';
  if(a===1) return '<i class="fr ok">Vue hier</i>';
  return a>=3||a>=dureePromo(p)/2?'<i class="fr verif">À vérifier</i>':""; }
function promosVisibles(P,avecFinies){
  const I=interdits(P), V=P.ville, fin=ST.promosFinies||{};
  return ((PROMOS&&PROMOS.promos)||[]).filter(p=>!p.doublon&&!fin[p.id]&&(avecFinies||promoEnCours(p))&&!(p.ing&&I.ing.has(p.ing))&&(P.region==="re"?true:!p.reunion))
    .map(p=>{ p._d=V&&p.lat!=null&&p.lon!=null?distanceKm(V,{lat:p.lat,lon:p.lon}):null; return p; });
}
function promosPres(P){ const r=+P.rayon||20; return promosVisibles(P).filter(p=>p._d!=null&&p._d<=r); }
/* Combien de personnes différentes ont relevé la même promo dans le même magasin */
function vuesPar(p){ const k=(p.code||p.cat||p.nom)+"|"+p.loc, s=new Set();
  ((PROMOS&&PROMOS.promos)||[]).forEach(q=>{ if((q.code||q.cat||q.nom)+"|"+q.loc===k&&q.par) s.add(q.par); }); return s; }

/* ================= Chez moi : frigo, congélateur, placard ================= */
const LIEUX=[["Frigo",["oeuf","lait","fb","yaourt","fromage","creme","jambon","lardons","saucisse","cuisse","pate","beurre","merguez","boeuf","moules","reblochon"]],["Congélateur",["surg","poulet","steak","colin"]],

function pas(id){ const g=ING[id]; if(g.u==="g"||g.u==="ml") return g.size>=1000?g.size/4:g.size/2; if(id==="oeuf"||id==="pain") return 2; return 1; }
function stockTxt(id,q){ const g=ING[id]; if(!q) return "0";
  if(g.u==="pc") return String(q)+(id==="fruit"?" fruit"+(q>1?"s":""):id==="oeuf"?" œuf"+(q>1?"s":""):"");
  return qtyTxt(id,q); }
function manques(r,P){ return r.ing.filter(([id,q])=>q*P.personnes>(ST.stock[id]||0)+1e-9).map(([id])=>id); }
function nomCourt(id){ return id==="fruit"?"un fruit de saison":id==="leg"?"des crudités":ING[id].n.toLowerCase(); }

  v.innerHTML='<div><h2>Chez moi</h2><p class="muted" style="font-size:13.5px">Note ce que tu as déjà. La liste de courses le retire, et ta prochaine semaine l\'utilisera en priorité.</p></div>'+
    (nb?'<div class="card"><h3>Ce que tu peux cuisiner maintenant</h3>'+
      (prets.length?prets.map(r=>ligneRecette(r,"Tout est là"+(P.personnes>1?" pour "+P.personnes:""))).join(""):'<p class="muted">Pas encore de plat complet avec ce que tu as.</p>')+

window.addEventListener("error",e=>{ if(!e.message) return; const t=$("toast"); if(!t) return;
  t.textContent="Oups, un problème est survenu : "+e.message+". Fais une capture d'écran et envoie-la, merci !"; t.hidden=false;
  clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,8000); });
/* ================= Accès payant : Whop =================
   Tant que WHOP.app, WHOP.produit ou WHOP.paiement est vide, l'appli reste gratuite et rien de ce bloc ne s'exécute.
   - Le paiement se fait sur la page Whop (WHOP.paiement) : carte, essai gratuit, code promo, tout se règle dans le tableau de bord Whop.
   - L'appli vérifie l'accès sans serveur : « Se connecter avec Whop » (OAuth 2.1 + PKCE, sans secret), puis
     GET /users/{id}/access/{produit}. Seuls des identifiants publics figurent ici, jamais de clé d'API.
   - Bêta-testeurs : un code promo à 100 % ou un lien de paiement gratuit créé dans Whop leur donne le même accès.
   Une page web ne peut pas être verrouillée à 100 % : ce contrôle arrête l'usage normal, pas une personne décidée à modifier le code. */
const WHOP={
  app:"",        // identifiant de l'appli Whop, « app_… » (Whop > Developer)
  produit:"",    // identifiant du produit, « prod_… »
  paiement:"",   // lien de paiement, « https://whop.com/checkout/plan_… »
  prix:"2,99 € par mois ou 19,99 € par an",
  essai:""       // ex. « 7 jours gratuits, puis » : à remplir seulement si l'essai est activé sur le lien Whop
};
const WHOP_API="https://api.whop.com", K_ACCES="vc_acces", K_JETONS="vc_whop", K_PKCE="vc_whop_pkce";
const PAYANT=!!(WHOP.app&&WHOP.produit&&WHOP.paiement);
const WHOP_RETOUR=location.origin+location.pathname;          // à déclarer comme « redirect URI » dans l'appli Whop
const JOUR_MS=864e5, GRACE_JOURS=7;                           // sans réseau, l'accès tient 7 jours après la dernière vérification
let MUR_MSG="";
function lit(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function ecrit(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function accesOK(){ if(!PAYANT) return true; const a=lit(K_ACCES); return !!(a&&a.ok&&Date.now()-a.vu<GRACE_JOURS*JOUR_MS); }
function b64url(octets){ return btoa(String.fromCharCode.apply(null,octets)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function alea(n){ return b64url(crypto.getRandomValues(new Uint8Array(n))); }
async function whopConnexion(){
  const pkce={v:alea(32),etat:alea(16),nonce:alea(16)}; ecrit(K_PKCE,pkce);
  const defi=b64url(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pkce.v))));
  location.href=WHOP_API+"/oauth/authorize?"+new URLSearchParams({response_type:"code",client_id:WHOP.app,redirect_uri:WHOP_RETOUR,
    scope:"openid profile",state:pkce.etat,nonce:pkce.nonce,code_challenge:defi,code_challenge_method:"S256"});
}
async function whopJeton(corps){
  const r=await fetch(WHOP_API+"/oauth/token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({client_id:WHOP.app},corps))});
  if(!r.ok){ const e=new Error("jeton "+r.status); e.refus=r.status===400||r.status===401; throw e; }
  const j=await r.json(); j.recu=Date.now(); ecrit(K_JETONS,j); return j;
}
async function whopJetonValide(){
  const j=lit(K_JETONS); if(!j) { const e=new Error("pas connecté"); e.refus=true; throw e; }
  if(Date.now()<j.recu+(j.expires_in-300)*1000) return j;
  return whopJeton({grant_type:"refresh_token",refresh_token:j.refresh_token});
}
/* Vrai ou faux selon Whop ; lève une erreur si la question n'a pas pu être posée (hors connexion…). */
async function whopVerifie(){
  const j=await whopJetonValide(), ent={Authorization:"Bearer "+j.access_token};
  let a=lit(K_ACCES), id=a&&a.user;
  if(!id){ const r=await fetch(WHOP_API+"/oauth/userinfo",{headers:ent}); if(!r.ok) throw new Error("profil "+r.status); id=(await r.json()).sub; }
  const r=await fetch(WHOP_API+"/api/v1/users/"+encodeURIComponent(id)+"/access/"+encodeURIComponent(WHOP.produit),{headers:ent});
  if(!r.ok) throw new Error("accès "+r.status);
  const ok=!!(await r.json()).has_access;
  ecrit(K_ACCES,{ok:ok,vu:Date.now(),user:id}); return ok;
}
/* Retour de Whop après connexion (?code=…&state=…) ou après paiement (?status=…). */
async function whopRetour(){
  const q=new URLSearchParams(location.search), code=q.get("code"), etat=q.get("state"), paye=q.get("status")||q.get("payment")||q.get("payment_id");
  if(!code&&!q.get("error")&&!paye) return;
  history.replaceState(null,"",location.pathname);
  if(!code){ MUR_MSG=q.get("error")?"La connexion à Whop a été annulée.":"Paiement terminé ? Connecte-toi avec le compte Whop utilisé pour payer."; return; }
  const pkce=lit(K_PKCE); ecrit(K_PKCE,null);
  if(!pkce||pkce.etat!==etat){ MUR_MSG="La connexion n'a pas abouti. Réessaie depuis ce téléphone."; return; }
  try{
    ecrit(K_ACCES,null);
    await whopJeton({grant_type:"authorization_code",code:code,redirect_uri:WHOP_RETOUR,code_verifier:pkce.v});
    MUR_MSG=(await whopVerifie())?"":"Aucun accès actif sur ce compte Whop. Si tu viens de payer, attends une minute puis réessaie.";
  }catch(e){ MUR_MSG="Impossible de vérifier ton accès pour l'instant. Vérifie ta connexion puis réessaie."; }
}
/* Une fois par jour, on redemande à Whop : un abonnement arrêté referme l'appli, une panne de réseau non. */
function whopRevue(){
  const a=lit(K_ACCES); if(!PAYANT||!a||!a.ok||Date.now()-a.vu<JOUR_MS||!navigator.onLine) return;
  whopVerifie().then(ok=>{ if(!ok){ MUR_MSG="Ton accès a pris fin."; if(!$("scrim")) demarrer(); } })
    .catch(e=>{ if(e.refus){ ecrit(K_ACCES,null); ecrit(K_JETONS,null); MUR_MSG="Reconnecte-toi pour retrouver ton accès."; if(!$("scrim")) demarrer(); } });
}
function renderMur(){
  const P=ST.profil; if(!ST.plan||(ST.plan.days&&!planValide())) nouveauPlan();
  const plan=ST.plan, tk=plan.days?ticket(plan.days,P):null;
  const soirs=plan.days?plan.days.map((d,i)=>[JOURS[i],RID[d.soir]]).filter(x=>x[1]):[];
  $("root").innerHTML='<div id="onb" class="page mur">'+
    '<div class="onb-body"><h1>Ta liste de courses est <em>prête</em>'+(P.prenom?", "+esc(P.prenom):"")+'</h1>'+
      '<p>'+(tk?'7 jours de repas pour '+P.personnes+(P.personnes>1?" personnes":" personne")+', '+eur(tk.total)+' de courses pour un budget de '+P.budget+' €.':"7 jours de repas adaptés à ton profil.")+'</p></div>'+
    '<div class="apercu" aria-hidden="true"><div class="flou">'+soirs.map(([j,r])=>'<div class="l"><b>'+j+'</b><span>'+esc(r.n)+'</span><span class="num">'+eur(mealCost(r,P))+'</span></div>').join("")+'</div>'+
      '<div class="cadenas"><span>🔒 Ta liste de courses, tes plats et tes recettes</span></div></div>'+
    (MUR_MSG?'<div class="etat">'+esc(MUR_MSG)+'</div>':"")+
    '<div class="actions"><p class="prix">'+esc((WHOP.essai?WHOP.essai+" ":"")+WHOP.prix)+'</p>'+
      '<a class="btn" id="murPayer" href="'+esc(WHOP.paiement)+'" style="text-align:center;text-decoration:none">Voir ma liste de courses</a>'+
      '<button type="button" class="btn ghost" id="murConnexion">J\'ai déjà un accès : me connecter</button>'+
      '<p class="hint">Le paiement est géré par Whop. Un code bêta-testeur se saisit sur la page de paiement. Après le paiement, reviens ici et connecte-toi avec le même compte.</p>'+
      '<button type="button" class="btn small ghost" id="murProfil" style="justify-self:start">Modifier mes réponses</button></div></div>';
  $("murConnexion").onclick=()=>{ $("murConnexion").disabled=true; whopConnexion().catch(()=>{ MUR_MSG="Connexion impossible pour l'instant."; renderMur(); }); };
  $("murProfil").onclick=()=>{ ONB={step:1,draft:JSON.parse(JSON.stringify(ST.profil))}; renderOnb(); };
  window.scrollTo(0,0);
}

function demarrer(){
  if(!ST.profil){ ONB={step:0,draft:JSON.parse(JSON.stringify(PROFIL_DEFAUT))}; renderOnb(); }
  else renderApp();
}
const majAvant=PRIX&&PRIX.maj;
if(PAYANT&&/[?&](code|error|status|payment|payment_id)=/.test(location.search)){ $("root").innerHTML='<div class="page"><p class="muted" style="padding:40px 0">Vérification de ton accès…</p></div>'; whopRetour().then(demarrer); }
else{ demarrer(); whopRevue(); }
/* Prix plus récents trouvés : on recalcule le menu (gardé en cache pour le hors connexion). */
chargePrix().then(ok=>{ if(ok&&PRIX.maj!==majAvant&&ST.profil&&!$("onb")){ if(!$("scrim")) renderApp(); } });
const promosAvant=PROMOS&&PROMOS.maj;
/* Promos : le fichier du jour, puis Open Prices en direct, puis toutes les minutes tant que l'appli est ouverte. */
function rafraichitPromos(n){
  if(!ST.profil||$("onb")) return;
  if(ST.onglet==="promos"){ if(n&&!$("scrim")){ const y=window.scrollY; renderApp(); window.scrollTo(0,y); } else majHeureLive(); }
  else majBadgePromos();
}
chargePromos().then(ok=>chargePromosLive().then(n=>rafraichitPromos(n+(ok&&PROMOS.maj!==promosAvant?1:0))));
setInterval(()=>{ if(document.visibilityState==="visible") chargePromosLive().then(rafraichitPromos); },60000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&Date.now()-LIVE_T>30000) chargePromosLive().then(rafraichitPromos); });
if("serviceWorker" in navigator && location.protocol==="https:" && !/claude\.ai|claudeusercontent/.test(location.hostname)){
  try{ sessionStorage.removeItem("vc_sans_photo"); }catch(e){}
  try{
    navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(reg=>{
      reg.update();                                  // cherche une nouvelle version à chaque ouverture
      document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") reg.update(); });
    }).catch(()=>{});
    /* Nouvelle version installée : on recharge une fois pour l'afficher. */
    let recharge=false;
    if(navigator.serviceWorker.controller) navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(recharge) return; recharge=true; location.reload(); });
  }catch(e){}
}
</script>
</body>
</html>
